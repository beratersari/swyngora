[project]
name = "swyngora-ai"
version = "0.1.0"
description = "Swyngora multi-agent AI assistant (LangGraph + MCP tools)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langgraph>=1.0",
  "langchain-ollama>=1.0",
  "langchain-xai>=1.0",
  "duckduckgo-search>=7.0.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "typer>=0.27.1",
  "rich>=15.0.0",
]

[project.scripts]
swyngora-ai = "swyngora_ai.cli:main"
swyngora-ai-serve = "swyngora_ai.serve:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.16.5", "ty>=0.0.77"]

[build-system]
requires = ["uv_build>=0.12.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", "src/*.egg-info"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade (3.11+)
  "SLF", # flake8-self: do not access private members of other objects
  "PTH", # flake8-use-pathlib: prefer pathlib over os.path / open()
  "T10", # flake8-debugger: no leftover debugger breakpoints
  "PIE", # flake8-pie: misc tidy Python idioms
  "FLY",  # flynt: prefer f-strings over % / .format / join of static pieces
  "PERF", # perflint: performance anti-patterns
  "FURB", # refurb: modern Python refreshes
  "PLR0124", # comparison-with-itself
  "PLR0133", # comparison-of-constant
  "PLR0206", # property-with-parameters
  "PLR0402", # manual-from-import
  "PLR1704", # redefined-argument-from-local
  "PLR1708", # stop-iteration-return
  "PLR1711", # useless-return
  "PLR1714", # repeated-equality-comparison
  "PLR1716", # boolean-chained-comparison
  "PLR1722", # sys-exit-alias
  "PLR1730", # if-stmt-min-max
  "PLR1733", # unnecessary-dict-index-lookup
  "PLR1736", # unnecessary-list-index-lookup
  "PLR2044", # empty-comment
  "PLR5501", # collapsible-else-if
  "PLW",     # pylint warning
  "PLE",     # pylint error
  "TRY400",  # error-instead-of-exception
  "TRY004",  # type-check-without-type-error
  "RUF013",  # implicit-optional
  "RUF034",  # useless-if-else
  "N804",    # first arg of a classmethod should be named cls
  "N805",    # first arg of a method should be named self
  "PT008",   # pytest.raises() call with no expected exception
  "PT009",   # unittest-style assert rather than plain assert
  "PT010",   # set the expected exception in pytest.raises()
  "PT011",   # pytest.raises(broad exception) is too coarse
  "PT012",   # pytest.raises() block should be a single simple statement
  "PT015",   # assertion always fails
  "PT016",   # no message passed to pytest.fail()
  "PT017",   # assertion on exception in except block
  "PT018",   # composite assertion should be split
  "PT027",   # use pytest.raises instead of unittest assertRaises
  "LOG009",  # logging.WARN → logging.WARNING
  "COM818",  # trailing comma on a bare tuple (typo hazard)
  "SIM201",  # negate-equal-op: not x == y → x != y
  "SIM202",  # negate-not-equal-op: not x != y → x == y
  "SIM208",  # double-negation: not (not x) → x
  "SIM101",  # duplicate-isinstance-call
  "SIM102",  # collapsible-if
  "SIM103",  # needless-bool
  "BLE001",  # blind-except
  "RUF018",  # assignment-in-assert
  "RUF049",  # dataclass-enum
  "RUF051",  # if-key-in-dict-del
  "RUF061",  # legacy-form-pytest-raises
  "RUF068",  # duplicate-entry-in-dunder-all
  "RUF100",  # unused-noqa
  "RUF102",  # invalid-rule-code
  "RUF200",  # invalid-pyproject-toml
  "C403",    # unnecessary-list-comprehension-set
  "C404",    # unnecessary-list-comprehension-dict
  "C413",    # unnecessary-call-around-sorted
  "C416",    # unnecessary-comprehension
  "B015",    # useless-comparison
  "YTT101",  # sys-version-slice3
  "YTT102",  # sys-version2
]
ignore = [
  "E501",  # line length owned by the formatter; prompt/URL strings may exceed 100
  # Formatter-incompatible whitespace/indent rules
  # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "E111",
  "E114",
  "E117",
  "W191",
  "FURB110",  # x if x else y → or is less explicit for list fallbacks
]

[tool.ruff.lint.per-file-ignores]
# Tests may call module-private helpers (_wikipedia, etc.). SLF still applies in src/.
"tests/**" = ["SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["swyngora_ai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]
exclude = [".venv", "dist"]

[tool.ty.rules]
# Default is ignore; require explicit type parameters on generics (list[str], not list).
missing-type-argument = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
blanket-ignore-comment = "error"
ignore-comment-unknown-rule = "error"
invalid-ignore-comment = "error"
pydantic-discarded-extra-argument = "error"
deprecated = "error"
unused-awaitable = "error"
possibly-missing-import = "error"
missing-slot = "error"
