[project]
name = "swyngora-ai"
version = "0.1.0"
description = "Swyngora multi-agent AI assistant (LangGraph + MCP tools)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.14",
  "langchain-core>=0.3.28",
  "langgraph>=0.2.60",
  "langchain-ollama>=0.2.2",
  "langchain-xai>=0.2.0",
  "langchain-community>=0.3.14",
  "duckduckgo-search>=7.0.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
swyngora-ai = "swyngora_ai.cli:main"
swyngora-ai-serve = "swyngora_ai.serve:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
