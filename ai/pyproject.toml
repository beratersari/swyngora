[project]
name = "swyngora-ai"
version = "0.1.0"
description = "Swyngora multi-agent AI assistant (LangGraph + MCP tools)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.14",
  "langchain-core>=0.3.28",
  "langgraph>=0.2.60",
  "langchain-ollama>=0.2.2",
  "langchain-xai>=0.2.0",
  "langchain-community>=0.3.14",
  "duckduckgo-search>=7.0.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "typer>=0.27.0",
  "rich>=15.0.0",
]

[project.scripts]
swyngora-ai = "swyngora_ai.cli:main"
swyngora-ai-serve = "swyngora_ai.serve:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.16.0"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", "src/*.egg-info"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade (3.11+)
]
ignore = [
  "E501",  # line length owned by the formatter; prompt/URL strings may exceed 100
  # Formatter-incompatible whitespace/indent rules
  # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "E111",
  "E114",
  "E117",
  "W191",
]

[tool.ruff.lint.isort]
known-first-party = ["swyngora_ai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false
