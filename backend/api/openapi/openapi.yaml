                quantity:
                  type: number
                  description: Omit or 0 for full close
                idempotencyKey:
                  type: string
                  maxLength: 128
                  description: Optional client key; same key + same request returns the original close
      responses:
        '200':
          description: Updated or closed position plus close trade
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/portfolio/margin/positions/{id}/margin:
    post:
      summary: Add or remove margin from an isolated position
      description: |
        delta > 0 adds cash into the position margin; delta < 0 returns excess to cash.
        Cannot go below initial margin for remaining size. Liquidation price is recalculated.
        Only allowed in isolated mode.
      operationId: adjustMargin
      tags: [Portfolio]
      parameters:
