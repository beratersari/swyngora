openapi: 3.0.3
info:
  title: Swyngora Market API
  description: |
    Public market data for Swyngora (v0.1).

    - Candles, 24h volume/ticker, and spot market listing support **binance**, **coinbase**,
      and **bybit** (select with `?exchange=`).
    - Circulating / total / max supply is sourced from the **Binance** public marketing
      symbol list (asset-level, used for all venues' mcap enrichment), refreshed daily.
      Max supply is null when undefined.
    - Watchlist is unauthenticated state keyed by client-supplied `clientId`
      (must be non-empty; not for multi-tenant production without real auth).
      Data is persisted in SQLite on the server (survives restarts). Each list has a monotonic
      `version` for multi-device sync: send `baseVersion` on writes; concurrent adds of different
      symbols auto-merge; delete-vs-update on the same symbol returns 409 with both sides.
    - Price alerts support `one_time` (default) or `repeating` modes for above/below targets.
      One-time alerts become `triggered` after the first fire; repeating alerts stay `active`
      and re-fire only after the price returns to the safe side and crosses again.
    - Clients may register a webhook URL with deliveryMode `immediate` or `hourly_digest`,
      plus optional quiet hours (IANA timeZone + local start/end). Delivery is deferred until
      quiet hours end; pending notifications survive restarts.
    - Realtime WebSocket (`GET /api/v1/ws`): subscribe/unsubscribe selected coin prices
      and one paper portfolio for order/position/cash events. Reconnect by resubscribing;
      access is checked per book. See `GET /api/v1/realtime`.
    - Paper trading: one or more named virtual portfolios per client (own cash, positions,
      orders, and performance), market buy/sell at last price,
      pending limit buy/sell and stop-loss orders with balance/position reservations and
      partial fills (auto-fill on price), open positions, realized/unrealized P&amp;L,
      trade history, recurring buy (DCA) plans, and isolated margin long/short (1x–10x)
      with market/limit opens, liquidation, partial close, and stop-loss/take-profit
      (SQLite; not real money).
    - Cross-exchange price difference tracking: watch a coin across Binance, Coinbase, and
      Bybit; when net edge after fees exceeds a threshold, store a buy/sell opportunity.
      Open opportunities persist across restarts; no duplicate while open; re-open after
      the edge falls below the limit and rises again. Stale or missing prices skip signals.
    - Technical indicator scanner: RSI, EMA crossover, and volume-increase rules over the
      client's watchlist; background evaluation; match history deduped by rule/symbol/bar.
    - Historical scanner backtests: run a rule over a date range for one symbol, track progress,
      cancel jobs, and view signals with 1/5/20-day forward returns.
    - User data export: download watchlist, shares, price-alert history, and backtest results as
      JSON or CSV. Large exports run in the background with progress and cancel; one active export
      per client; files are owner-only downloads and expire after a TTL.
    - User data import: upload a prior JSON/CSV export, preview valid/invalid/willAdd counts, then
      confirm with merge or replace mode. Dedupes symbols/shares/ids; large applies run in the
      background with progress and cancel.
    - Account close: close a clientId for 7 days (reopen allowed); product APIs and shared-list
      access stop; after grace, user data and jobs are purged.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  time:
                    type: string
                    format: date-time
  /api/v1/realtime:
    get:
      summary: Realtime WebSocket protocol description
      description: |
        Returns how to connect to `GET /api/v1/ws` (JSON messages).
        Subscribe/unsubscribe selected coins for price ticks and one paper portfolio
        for order/position/cash events. Resubscribe after reconnect; access is
        enforced per book (owner, trader, or viewer). Paper trading only.
      operationId: getRealtimeInfo
      tags: [Realtime]
      responses:
        '200':
          description: Connection and message protocol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeInfo'
  /api/v1/ws:
    get:
      summary: WebSocket realtime stream
      description: |
        Upgrade to WebSocket. Same auth as REST (`Authorization` / `X-API-Key`);
        browsers may pass `?token=` and must pass `?clientId=`.

        Client JSON: `{ "type": "subscribe_prices", "symbols": [{ "exchange", "symbol" }] }`,
        `unsubscribe_prices`, `subscribe_portfolio` (`portfolioId`), `unsubscribe_portfolio`, `ping`.

        Server JSON: `hello`, `ack`, `price`, `portfolio` (snapshot / order / position / fill),
        `error`, `pong`. After reconnect, resend subscriptions; the server snapshots current state.
        Portfolio events are sent only if this clientId can view the book.
      operationId: realtimeWebSocket
      tags: [Realtime]
      parameters:
        - in: query
          name: clientId
          required: true
          schema: { type: string }
        - in: query
          name: token
          schema: { type: string }
          description: API token when the browser cannot set Authorization
        - in: query
          name: portfolioId
          schema: { type: string }
          description: Optional initial book (still send subscribe_portfolio)
      responses:
        '101':
          description: Switching Protocols (WebSocket)
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/market/exchanges:
    get:
      summary: List supported spot exchanges
      operationId: listExchanges
      tags: [Market]
      responses:
        '200':
          description: Configured venues
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchanges:
                    type: array
                    items:
                      type: string
                    example: ["binance", "coinbase", "bybit"]
                  default:
                    type: string
                    example: binance

  /api/v1/market/intervals:
    get:
      summary: List supported candle intervals
      operationId: listIntervals
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          description: Venue id (binance | coinbase | bybit). Default binance. Interval sets differ per venue.
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit]
      responses:
        '200':
          description: Supported intervals for the selected exchange
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchange:
                    type: string
                    example: binance
                  intervals:
                    type: array
                    items:
                      type: string
                    example: ["1m", "5m", "1h", "1d"]

  /api/v1/market/tags:
    get:
      summary: List Binance product-catalog tags
      description: |
        Unique crypto product tags from Binance product catalog (e.g. Meme, defi, Layer1_Layer2).
        Used to power spot list tag filters. Non-crypto tags (bStocks, tCommodities) are excluded.
        Tags are only populated for Binance; other exchanges return an empty list.
      operationId: listProductTags
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          description: Venue id (binance | coinbase | bybit). Default binance.
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit]
      responses:
        '200':
          description: Sorted unique tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchange:
                    type: string
                    example: binance
                  tags:
                    type: array
                    items:
                      type: string
                    example: ["AI", "Layer1_Layer2", "Meme", "defi"]
        '502':
          $ref: '#/components/responses/Error'


  /api/v1/market/delist-schedule:
    get:
      summary: List scheduled spot delistings
      description: |
        Cached Binance spot delist schedule (hourly when BINANCE_API_KEY is set).
      operationId: listDelistSchedule
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit]
      responses:
        '200':
          description: Delist schedule snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelistScheduleResponse'
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/market/spot:
    get:
      summary: List Binance spot markets with search and sort
      description: |
        Returns spot-tradable pairs from Binance `exchangeInfo`, joined with
        24h ticker metrics. Supports substring search (`q`), quote/base/status
        filters, sorting by volume and other metrics, and offset pagination.
      operationId: listSpotMarkets
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          description: Venue id (binance | coinbase | bybit). Default binance.
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit]
        - name: q
          in: query
          required: false
          description: Case-insensitive search on symbol, baseAsset, or quoteAsset
          schema:
            type: string
            example: btc
        - name: quote
          in: query
          required: false
          description: Filter by quote asset (e.g. USDT)
          schema:
            type: string
            example: USDT
        - name: base
          in: query
          required: false
          description: Filter by base asset (e.g. BTC)
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by exchange status (e.g. TRADING)
          schema:
            type: string
            example: TRADING
        - name: tag
          in: query
          required: false
          description: |
            Filter by Binance product-catalog tag (case-insensitive).
            Comma-separated or repeated `tag` params use OR semantics (has any).
            Examples: `Meme`, `defi,AI`, `Layer1_Layer2`.
          schema:
            type: string
            example: Meme
        - name: tags
          in: query
          required: false
          description: Alias of `tag` (comma-separated product tags, OR match)
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort field (default quoteVolume)
          schema:
            type: string
            default: quoteVolume
            enum: [quoteVolume, volume, priceChangePercent, lastPrice, tradeCount, symbol, baseAsset, marketCapCirculating, marketCapTotal, marketCapMax, tags]
        - name: order
          in: query
          required: false
          description: Sort direction (default desc for metrics, asc for symbol/baseAsset)
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          required: false
          description: Page size (1-500, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          required: false
          description: Rows to skip after filter+sort (default 0)
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Paged spot market list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotListResponse'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/candles:
    get:
      summary: Fetch OHLCV candlesticks
      operationId: getCandles
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          schema:
            type: string
            enum: [binance, coinbase, bybit]
            default: binance
        - name: symbol
          in: query
          required: true
          description: Trading pair (Binance/Bybit BTCUSDT; Coinbase BTC-USD)
          schema:
            type: string
            example: BTCUSDT
        - name: interval
          in: query
          required: false
          description: |
            Candle interval (default 1h). Supported values are exchange-specific -
            call GET /api/v1/market/intervals?exchange=... for the authoritative list.
            Coinbase/Bybit reject many Binance-only intervals with 400.
          schema:
            type: string
            default: 1h
            example: 1h
        - name: limit
          in: query
          required: false
          description: Number of candles (1-1000, default 100)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: startTime
          in: query
          required: false
          description: RFC3339 or Unix milliseconds
          schema:
            type: string
        - name: endTime
          in: query
          required: false
          description: RFC3339 or Unix milliseconds
          schema:
            type: string
      responses:
        '200':
          description: Candle series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandlesResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/ticker/24h:
    get:
      summary: 24-hour rolling ticker including volume
      operationId: getTicker24h
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          description: Venue id (binance | coinbase | bybit). Default binance.
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit]
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: BTCUSDT
      responses:
        '200':
          description: 24h statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticker24h'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook:
    get:
      summary: Grouped spot order book
      description: |
        Live spot bid/ask depth with **backend price grouping** (e.g. 0.01, 0.1, 1).
        Each row is a merged price bucket with quantity, quote notional, running totals,
        and `isWall` when that bucket is unusually large versus the rest of the visible
        side (buy/sell walls). `suggestedGroupSizes` are ready-made steps for the UI.
        Spot only. Binance, Coinbase, and Bybit each keep a **live local book** on their
        public depth websocket. A dropped stream or missed update invalidates the copy and
        resyncs; stale depth is not returned. Informational — not financial advice.
      operationId: getSpotOrderBook
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit], default: binance }
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: group
          in: query
          description: Price bucket size (e.g. 0.1). Omit to use a suggested default.
          schema: { type: string, example: "0.1" }
        - name: limit
          in: query
          description: Grouped rows per side (5–100, default 20)
          schema: { type: integer, default: 20, minimum: 5, maximum: 100 }
      responses:
        '200':
          description: Grouped book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotOrderBook'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/supply:
    get:
      summary: Asset circulating / total / max supply (Binance)
      description: |
        Supply metrics from the Binance marketing symbol list snapshot (cache-only
        on the request path). Accepts base asset (`BTC`) or a pair (`BTCUSDT`);
        USD-stable quote suffixes are stripped for convenience. `maxSupply` is null
        when Binance does not publish a hard cap.
      operationId: getSupply
      tags: [Market]
      parameters:
        - name: asset
          in: query
          required: false
          description: Base asset ticker (preferred). Provide asset or symbol (at least one required).
          schema:
            type: string
            example: BTC
        - name: symbol
          in: query
          required: false
          description: Alias for asset; may be a pair like BTCUSDT. Provide asset or symbol (at least one required).
          schema:
            type: string
            example: BTCUSDT
      responses:
        '200':
          description: Supply snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supply'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/indicators:
    get:
      summary: RSI and EMA indicators for a symbol
      description: |
        Fetches OHLCV candles from the selected exchange and computes:
        - RSI (Wilder's smoothing, default period 14)
        - EMA (default periods 12 and 26; seed = SMA of first period)
        Informational only - not financial advice.
      operationId: getIndicators
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit], default: binance }
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: interval
          in: query
          schema: { type: string, default: 1h }
        - name: limit
          in: query
          description: Number of output bars (extra history is fetched for warm-up)
          schema: { type: integer, default: 100, minimum: 1, maximum: 1000 }
        - name: rsiPeriod
          in: query
          schema: { type: integer, default: 14, minimum: 2, maximum: 500 }
        - name: emaPeriods
          in: query
          description: Comma-separated EMA periods
          schema: { type: string, default: "12,26", example: "12,26" }
      responses:
        '200':
          description: Indicator series
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchange: { type: string }
                  symbol: { type: string }
                  interval: { type: string }
                  rsiPeriod: { type: integer }
                  emaPeriods:
                    type: array
                    items: { type: integer }
                  latest:
                    type: object
                    properties:
                      rsi: { type: number, nullable: true }
                      ema:
                        type: object
                        additionalProperties: { type: number }
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        openTime: { type: string, format: date-time }
                        close: { type: number }
                        rsi: { type: number, nullable: true }
                        ema:
                          type: object
                          additionalProperties: { type: number }
                  note: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /api/v1/market/pumps:
    get:
      summary: Detect pump/dump events on one symbol
      description: |
        Mechanical threshold detection over OHLCV candles (close-to-close, candle body, or high-from-low).
        Configure minReturnPct, windowBars, interval, lookbackHours or limit, mode, direction, minVolumeRatio.
        Informational only - not financial advice.
      operationId: getPumpEvents
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string }
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit], default: binance }
        - name: interval
          in: query
          schema: { type: string, default: 1h }
        - name: lookbackHours
          in: query
          schema: { type: number }
        - name: limit
          in: query
          schema: { type: integer }
        - name: minReturnPct
          in: query
          schema: { type: number, default: 5 }
        - name: windowBars
          in: query
          schema: { type: integer, default: 1 }
        - name: mode
          in: query
          schema: { type: string, enum: [close_return, candle_body, high_from_low], default: close_return }
        - name: direction
          in: query
          schema: { type: string, enum: [up, down, both], default: up }
        - name: minVolumeRatio
          in: query
          schema: { type: number }
        - name: maxEvents
          in: query
          schema: { type: integer }
        - name: startTime
          in: query
          schema: { type: string, format: date-time }
        - name: endTime
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Pump events for the symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PumpEventsResponse'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /api/v1/market/pumps/scan:
    get:
      summary: Scan top-volume symbols for recent pumps
      description: |
        Scans top quote-volume spot symbols with the same mechanical thresholds as /pumps.
        Omitted optional parameters use documented defaults; the response metadata echoes the
        resolved values (not zeros/empty strings).
        maxTotalEvents caps the aggregate number of events across all hits (not the hit count).
        Informational only - not financial advice.
      operationId: scanPumpEvents
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit], default: binance }
        - name: quote
          in: query
          schema: { type: string, default: USDT }
        - name: interval
          in: query
          schema: { type: string, default: 15m }
        - name: lookbackHours
          in: query
          schema: { type: number, default: 24 }
        - name: minReturnPct
          in: query
          schema: { type: number, default: 8 }
        - name: windowBars
          in: query
          schema: { type: integer, default: 1 }
        - name: mode
          in: query
          schema: { type: string, enum: [close_return, candle_body, high_from_low], default: close_return }
        - name: direction
          in: query
          schema: { type: string, enum: [up, down, both], default: up }
        - name: minVolumeRatio
          in: query
          schema: { type: number }
        - name: symbolLimit
          in: query
          schema: { type: integer, default: 15, maximum: 40 }
        - name: maxTotalEvents
          in: query
          description: Maximum total events across all symbols (default 30). Hits are ranked by |return|; excess events/hits are dropped.
          schema: { type: integer, default: 30, minimum: 1 }
      responses:
        '200':
          description: Ranked pump hits with resolved scan parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PumpScanResponse'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /api/v1/market/indicators/batch:
    post:
      summary: Latest RSI/EMA for many symbols (one exchange)
      description: |
        Computes latest RSI and EMA for up to 50 symbols on a single exchange/interval.
        Per-symbol failures return `error: unavailable` on that item rather than failing the batch.
        Upstream concurrency is bounded process-wide. Informational only - not financial advice.
      operationId: postIndicatorsBatch
      tags: [Market]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbols]
              properties:
                exchange:
                  type: string
                  enum: [binance, coinbase, bybit]
                  default: binance
                interval:
                  type: string
                  default: 1h
                  description: Exchange-specific; use /intervals?exchange=
                symbols:
                  type: array
                  items: { type: string }
                  maxItems: 50
                  example: [BTCUSDT, ETHUSDT]
                rsiPeriod:
                  type: integer
                  default: 14
                  minimum: 2
                  maximum: 500
                emaPeriods:
                  type: string
                  default: "12,26"
                  description: Comma-separated EMA periods
      responses:
        '200':
          description: Per-symbol indicator snapshots
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchange: { type: string }
                  interval: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol: { type: string }
                        rsi: { type: number, nullable: true }
                        ema:
                          type: object
                          additionalProperties: { type: number }
                        error: { type: string, description: Present when symbol failed (redacted) }
                  note: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /api/v1/watchlist:
    get:
      summary: Get watchlist for a client id
      description: |
        Returns the actor's own list, or a list shared with them when `ownerClientId` is set.
        Response includes `role` (owner|viewer|editor) and `ownerClientId`.
      operationId: getWatchlist
      tags: [Watchlist]
      parameters:
        - name: clientId
          in: query
          description: Actor client tenancy key (not the shared name "default")
          schema: { type: string, minLength: 1 }
        - name: ownerClientId
          in: query
          description: List owner when viewing a shared watchlist; omit for own list
          schema: { type: string, minLength: 1 }
        - name: X-Client-Id
          in: header
          description: Preferred alternative to clientId query
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Watchlist with access role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
    put:
      summary: Replace entire watchlist (owner only)
      description: |
        Full replace of items. Editors and viewers receive 403.
        Multi-device: send `baseVersion` from the last GET. Different symbols added on two
        devices auto-merge. Same-symbol delete vs update returns 409 with `conflict` details;
        re-PUT with `baseVersion` = `serverVersion` and your resolved `items` to finish.
        Optional `baseItems` improves 3-way merge accuracy.
      operationId: putWatchlist
      tags: [Watchlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string }
                ownerClientId: { type: string, description: Must be the actor (owner only) }
                baseVersion:
                  type: integer
                  format: int64
                  description: Version from last GET; omit for unconditional write (legacy)
                baseItems:
                  type: array
                  description: Snapshot from last GET (recommended for accurate delete detection)
                  items:
                    type: object
                    properties:
                      exchange: { type: string }
                      symbol: { type: string }
                      note: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [symbol]
                    properties:
                      exchange: { type: string }
                      symbol: { type: string }
                      note: { type: string }
      responses:
        '200':
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          description: Version conflict — resolve and retry
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
                  conflict:
                    $ref: '#/components/schemas/WatchlistSyncConflict'

  /api/v1/alerts/webhook:
    get:
      summary: Get price-alert webhook URL for a client
      operationId: getAlertWebhook
      tags: [Alerts]
      parameters:
        - name: clientId
          in: query
          schema: { type: string, minLength: 1 }
        - name: X-Client-Id
          in: header
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Webhook settings (url may be empty if not configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertWebhook'
        '400':
          $ref: '#/components/responses/Error'
    put:
      summary: Set price-alert webhook URL and notification preferences
      description: |
        Stores an absolute http(s) URL and preferences:
        - deliveryMode immediate (default) or hourly_digest
        - timeZone (IANA) and quietHours local start/end (HH:MM); ranges may cross midnight
        Notifications created during quiet hours wait until quiet hours end.
        Pending deliveries survive restarts and retry on failure.
      operationId: putAlertWebhook
      tags: [Alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                clientId: { type: string }
                url: { type: string, format: uri, example: https://hooks.example.com/swyngora }
                deliveryMode:
                  type: string
                  enum: [immediate, hourly_digest]
                  default: immediate
                timeZone:
                  type: string
                  default: UTC
                  example: Europe/Istanbul
                quietHours:
                  type: object
                  properties:
                    enabled: { type: boolean, default: false }
                    start: { type: string, example: "22:00", description: Local HH:MM }
                    end: { type: string, example: "08:00", description: Local HH:MM; may be earlier than start }
      responses:
        '200':
          description: Saved webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertWebhook'
        '400':
          $ref: '#/components/responses/Error'
    delete:
      summary: Clear price-alert webhook URL
      operationId: deleteAlertWebhook
      tags: [Alerts]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Webhook cleared
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/alerts:
    get:
      summary: List price alerts for a client
      operationId: listPriceAlerts
      tags: [Alerts]
      parameters:
        - name: clientId
          in: query
          schema: { type: string, minLength: 1 }
        - name: X-Client-Id
          in: header
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Alert list
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId: { type: string }
                  count: { type: integer }
                  alerts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PriceAlert'
        '400':
          $ref: '#/components/responses/Error'
    post:
      summary: Create a price alert (one-time or repeating)
      description: |
        Creates an active alert for when last price goes above or below targetPrice.
        mode=one_time (default): fires once then status becomes triggered.
        mode=repeating: fires on each edge into the condition zone; does not re-fire while price
        stays on that side; re-arms when price returns to the safe side. Informational only.
      operationId: createPriceAlert
      tags: [Alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, condition, targetPrice]
              properties:
                clientId: { type: string }
                exchange: { type: string, enum: [binance, coinbase, bybit], default: binance }
                symbol: { type: string }
                condition: { type: string, enum: [above, below] }
                targetPrice: { type: number, exclusiveMinimum: 0 }
                mode:
                  type: string
                  enum: [one_time, repeating]
                  default: one_time
                  description: one_time fires once; repeating fires on each re-cross of the target
      responses:
        '201':
          description: Created alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlert'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/alerts/{id}:
    get:
      summary: Get one price alert
      operationId: getPriceAlert
      tags: [Alerts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlert'
        '404':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete a price alert
      operationId: deletePriceAlert
      tags: [Alerts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  id: { type: string }
        '404':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/watchlist/items:
    post:
      summary: Add or update a watchlist item
      description: |
        Owner or editor may add/update symbols. Send `baseVersion` from last GET for multi-device
        safety. Adding a symbol missing on the server auto-merges even if versions differ.
        Conflicting notes on the same symbol return 409.
      operationId: addWatchlistItem
      tags: [Watchlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol]
              properties:
                clientId: { type: string, description: Actor client id }
                ownerClientId: { type: string, description: List owner when mutating a shared list }
                baseVersion: { type: integer, format: int64 }
                exchange: { type: string, default: binance }
                symbol: { type: string }
                note: { type: string }
      responses:
        '200':
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          description: Symbol note conflict with concurrent edit
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
                  conflict:
                    $ref: '#/components/schemas/WatchlistSyncConflict'
    delete:
      summary: Remove a watchlist item
      description: |
        Owner or editor may remove symbols. Send `baseVersion` (query or If-Match).
        If another device changed the same symbol, returns 409 so the user can choose.
      operationId: removeWatchlistItem
      tags: [Watchlist]
      parameters:
        - name: exchange
          in: query
          required: true
          schema: { type: string }
        - name: symbol
          in: query
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: ownerClientId
          in: query
          description: List owner when mutating a shared list
          schema: { type: string }
        - name: baseVersion
          in: query
          schema: { type: integer, format: int64 }
        - name: If-Match
          in: header
          description: Optional alternative to baseVersion (list version)
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          description: Delete vs concurrent update conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
                  conflict:
                    $ref: '#/components/schemas/WatchlistSyncConflict'

  /api/v1/watchlist/shares:
    get:
      summary: List shares granted on the owner's watchlist
      operationId: listWatchlistShares
      tags: [Watchlist]
      parameters:
        - name: clientId
          in: query
          schema: { type: string, minLength: 1 }
        - name: X-Client-Id
          in: header
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Share list
          content:
            application/json:
              schema:
                type: object
                properties:
