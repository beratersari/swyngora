  /api/v1/market/forensics/radar:
    get:
      summary: Review saved Setup Radar hits and after-outcomes
      description: |
        Lists past Setup Radar appearances and what price did after 15m / 1h / 4h.
        Usefulness is how often an up/down lean matched the later move.
        Hits are saved when Now scans or the background worker finds a new
        appearance (one per coin per 4h). Informational only.
      operationId: reviewSetupRadar
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          schema: { type: string, default: all }
        - name: symbol
          in: query
          schema: { type: string }
        - name: since
          in: query
          description: 24h | 7d | 30d (default 7d)
          schema: { type: string, default: 7d }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: Saved setups and usefulness stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketForensicsRadarReview' }
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/vwap:
    get:
      summary: Volume-weighted average price
      description: |
        **VWAP** from a start time (or named `window`) until now.
        Each candle's typical price (high+low+close)/3 is weighted by
        **quote volume**, so prices with more trading pull the average
        more. Returns `vwap`, last vs VWAP (`distance`, `distancePct`,
        `side`), and total volume. `exchange=all` (default) returns
        Binance and Bybit separately plus `combined` (volume-weighted
        across both). Use `window` (`1h` / `4h` / `24h` / `7d` / `30d`,
        default `24h`) or `startTime` (+ optional `endTime`).
        Informational only.
      operationId: getMarketVWAP
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all = all futures venues + combined)
          schema: { type: string, default: all }
        - name: window
          in: query
          description: 1h | 4h | 24h | 7d | 30d (default 24h). Ignored when startTime is set.
          schema: { type: string, default: "24h" }
        - name: startTime
          in: query
          description: Range start (RFC3339 or unix ms)
          schema: { type: string }
        - name: endTime
          in: query
          description: Range end (RFC3339 or unix ms). Default now.
          schema: { type: string }
      responses:
        '200':
          description: Per-venue and optional combined VWAP
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/volume-profile:
    get:
      summary: Volume profile (volume by price)
      description: |
        **Volume profile** shows **where** trading happened by **price**
        over a time range you choose — not just how much traded over time.
        Each row is quote (USDT) volume in a price band, with **buy** and
        **sell** when the venue publishes taker-buy (Binance klines; Bybit
        is total-only). The same row also carries **open interest opened
        and closed** (USDT change spread across the candles trading then)
        and **long / short liquidation** notional that printed in that band.
        `poc` is the price with the most volume. `valueArea`
        is the contiguous block around the POC that holds about **70%** of
        volume. `exchange=all` (default) returns Binance and Bybit separately
        plus `combined`. Combined adds both venues at the same price levels.
        Use `window` (`1h` / `4h` / `24h` / `7d` / `30d`, default `24h`) or
        `startTime` + `endTime`. Optional `tickSize` sets the row width.
        Built from spot candles (volume spread across each bar's high–low),
        not individual prints. Informational only.
      operationId: getMarketVolumeProfile
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all = all futures venues + combined)
          schema: { type: string, default: all }
        - name: window
          in: query
          description: 1h | 4h | 24h | 7d | 30d (default 24h). Ignored when startTime/endTime are set.
          schema: { type: string, default: "24h" }
        - name: startTime
          in: query
          description: Range start (RFC3339 or unix ms)
          schema: { type: string }
        - name: endTime
          in: query
          description: Range end (RFC3339 or unix ms)
          schema: { type: string }
        - name: tickSize
          in: query
          description: Price row width (e.g. 50). Omit to pick one automatically.
          schema: { type: number, example: 50 }
      responses:
        '200':
          description: Per-venue and optional combined volume profile
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/flow-at-prices:
    get:
      summary: Flow at prices (buy/sell/delta per price)
      description: |
        **Flow at prices** shows what actually printed at each price:
        market **buy** vs **sell** USDT, **print count**, and **delta**
        (buy − sell). Use this when a candle's total buy/sell is not
        enough — for example BTC traded 65400–65600 and you want the
        row at 65520. Built from aggressive **futures prints** (Binance
        USD-M aggTrades, Bybit recent trades), not candle volume smeared
        across high–low (that is `/volume-profile`). `exchange=all`
        (default) returns Binance and Bybit separately plus `combined`.
        Use `window` (`5m` / `15m` / `1h` / `4h` / `1d` / `3d` / `7d`,
        default `15m`) or `startTime` + `endTime` (max 7d). The live
        tape is about the last hour on Binance and the newest ~1000
        Bybit trades. Closed minutes are stored while this process runs
        (about 7 days), so a longer lookback and Bybit further back use
        that buy/sell and print-count ladder. Optional `tickSize` sets
        the row width; `minPrice` / `maxPrice` clip the ladder to a band.
        `truncated` is true when stored rows do not cover the whole window.
        `trades` is aggregated print count, not individual orders.
        Informational only.
      operationId: getMarketFlowAtPrices
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both + combined)
          schema: { type: string, default: all }
        - name: window
          in: query
          description: 5m | 15m | 1h | 4h | 1d | 3d | 7d (default 15m). Ignored when startTime/endTime are set.
          schema: { type: string, default: "15m" }
        - name: startTime
          in: query
          description: Range start (RFC3339 or unix ms). Max span 7d. Stored minutes cover the lookback; the live tape alone does not.
          schema: { type: string }
        - name: endTime
          in: query
          description: Range end (RFC3339 or unix ms)
          schema: { type: string }
        - name: tickSize
          in: query
          description: Price row width (e.g. 10). Omit to pick one automatically.
          schema: { type: number, example: 10 }
        - name: minPrice
          in: query
          description: Only include prints at or above this price (e.g. 65400).
          schema: { type: number, example: 65400 }
        - name: maxPrice
          in: query
          description: Only include prints at or below this price (e.g. 65600).
          schema: { type: number, example: 65600 }
      responses:
        '200':
          description: Per-venue and optional combined price ladder
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/venue-divergence:
    get:
      summary: Which futures venues move together
      description: |
        Compares **Binance USD-M**, **Bybit linear**, and **OKX USDT-swap**
        for one coin using open-interest change, funding payer, account
        long/short crowding, and price+OI positioning. `groups` lists venues
        that share a bullish or bearish lean. `outliers` is the venue moving
        the other way when the other two agree. Each `diffs[]` row has a
        reading per venue plus `same` and `different`. OKX has no account
        long/short, so it is left out of the crowding comparison. A missing
        venue is skipped; two venues are still compared. Informational only.
      operationId: getMarketVenueDivergence
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
      responses:
        '200':
          description: Venue comparison
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/positioning:
    get:
      summary: Price and open-interest positioning
      description: |
        Classifies **long buildup**, **short buildup**, **long unwinding**, or
        **short covering** from price change vs open-interest change (classic
        futures matrix) on Binance USD-M and Bybit linear. Short summary and
        reasons use funding and account long/short as corroboration. When
        `exchange=all`, also returns a **combined** general market direction
        (OI-weighted). Informational only — not financial advice.
      operationId: getMarketPositioning
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all = all futures venues + combined)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue and optional combined positioning
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/squeeze-risk:
    get:
      summary: Long and short squeeze risk
      description: |
        Scores **long-squeeze** and **short-squeeze** risk (0–100) for a coin
        on **Binance USD-M** and **Bybit linear** separately, and (when
        `exchange=all`) an **OI-weighted combined** view. Drivers: account
        long/short crowding, funding, open-interest build, recent liquidation
        heat, and nearby high-leverage pockets. Explains which side is crowded
        and why risk is high or low. Model only — not a prediction or financial
        advice.
      operationId: getMarketSqueezeRisk
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all = all futures venues + combined)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue and optional combined squeeze risk
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidation-hunt:
    get:
      summary: Hypothetical liquidation hunt (per venue)
      description: |
        **Hypothetical model only** — not evidence that any exchange moves
        price, and not financial advice.

        For Binance USD-M and Bybit linear separately: estimate where long/short
        liquidation pressure sits if price moves up or down, how much **spot**
        buying or selling the visible book needs to reach those areas, and a
        rough desk result (unwind on the current opposite side vs assuming
        part of estimated liquidations become exit flow). Also scores which
        direction looks easier or more likely (`upScore` / `downScore` plus
        `bias`) from zone distance, visible book cost, price+OI trend,
        crowding/funding, and recent taker / liquidation flow. `upCascade` /
        `downCascade` list zones in price order and whether earlier estimated
        liquidations cheapen the next hop. Uses live spot book, open interest,
        account long/short (blended toward 50/50), funding, and recent
        liquidation prints. Leverage mix is assumed. Direction scores and
        cascade paths do not change the zone or P&L numbers.
      operationId: getMarketLiquidationHunt
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all = all futures venues, never averaged)
          schema: { type: string, default: all }
        - name: weightProximity
          in: query
          description: Custom mix percent for distance to zone. If any weight* is sent, omitted factors are 0 and the six must sum to 100. Percents stay as given — a missing factor keeps its percent and adds 0 (neutral 50); remaining factors are not increased.
          schema: { type: number }
        - name: weightBook
          in: query
          schema: { type: number }
        - name: weightEfficiency
          in: query
          schema: { type: number }
        - name: weightTrend
          in: query
          schema: { type: number }
        - name: weightCrowding
          in: query
          schema: { type: number }
        - name: weightFlow
          in: query
          schema: { type: number }
      responses:
        '200':
          description: Per-venue hunt report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidationHunt'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidation-max-pain:
    get:
      summary: Largest liquidation pockets above and below last price
      description: |
        CoinGlass-style **max pain** for one coin: the price with the biggest
        estimated liquidation size above last (shorts) and below last (longs).
        This is **not** the hunt target (which also weighs spot-walk cost).
        Size is modeled OI at an assumed leverage mix plus 24h observed
        clusters. Venues stay separate; report-level above/below is the single
        largest pocket on that side (prices are never averaged).
      operationId: getMarketLiquidationMaxPain
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all = all futures venues, never averaged)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue max-pain pockets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidationMaxPain'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidation-hunt/heatmap:
    get:
      summary: Liquidation intensity heatmap (price × time)
      description: |
        CoinGlass-style grid of estimated liquidation intensity at each price
        for each time column. Built from historical open interest, mark price,
        the hunt leverage mix (tilted by funding), blended account long/short,
        and observed liquidation prints in that column.

        `range` is 12h, 24h, 3d, 7d, 14d, or 30d. 14d and 30d use the
        startup archive of 1-hour open interest, funding, and long/short.
        Binance and Bybit are modeled
        separately and each venue uses only its own candles (never the
        other exchange's price). `combined` is the sum of their cells.
        `review` scores whether later price reached the hot zones within
        1h / 4h / 12h, time-to-hit, hit rate / false signals, and whether
        observed liquidations in that zone rose. Not a live book and not
        financial advice.
      operationId: getMarketLiquidationHuntHeatmap
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: range
          in: query
          description: 12h | 24h | 3d | 7d
          schema: { type: string, default: 24h, enum: [12h, 24h, 3d, 7d, 14d, 30d] }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all = all futures venues + combined)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Price × time intensity grids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidationHuntHeatmap'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidation-levels:
    get:
      summary: Liquidation level bar chart
      description: |
        CoinGlass-style **liquidation map** as bars.

        - `symbol=BTCUSDT` (or ETHUSDT, …): estimated **price levels** from
          each venue's own last, open interest, and a 10x/25x/50x/100x mix.
          Longs sit below last; shorts sit above. Each bar has the mass at
          that price (`longNotional` / `byLeverage`) and the walk from last
          to that price (`cumLong` / `cumByLeverage`). Combined aligns
          venues by percent from their own last onto an OI-weighted
          reference last — it does not copy a missing venue's last.
          `review` rebuilds those past maps from stored OI + last and scores
          later same-venue liquidations in each 10x/25x/50x/100x band (1h / 4h / 12h).
          Live bars shrink bands that rarely print. Bands that do print are
          also shortened toward the share of the predicted amount that later
          showed up (`sizeScale`), and are not grown when prints exceed the model.
        - `symbol=all`: **total** observed liquidations for every tracked coin
          as time bars (last 24h max). `exchange=binance|bybit|okx|all`.

        Informational only.
      operationId: getMarketLiquidationLevels
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          description: Pair (BTCUSDT) or all
          schema: { type: string, default: all, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all = combined)
          schema: { type: string, default: all, example: all }
        - name: range
          in: query
          description: 12h | 24h | 3d | 7d (totals clamp to 24h)
          schema: { type: string, default: 24h, enum: [12h, 24h, 3d, 7d, 14d, 30d] }
      responses:
        '200':
          description: Price-level bars or time-total bars
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLiquidationLevels'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidation-cascade:
    get:
      summary: Liquidation cascade risk (one coin or whole market)
      description: |
        Detects a **liquidation cascade**: a short burst of long or short
        liquidations far above that stream's own typical rate.

        Compares the last **1 minute**, **5 minutes**, and **15 minutes** to
        the median of prior blocks over ~6 hours. `grade` is quiet / elevated
        / cascade / extreme. Binance and Bybit are scored **separately**.
        `both.agree` is true only when the **same side** is cascading on both
        venues. `episodes` lists each wave in the last 24h (start, duration,
        long/short notional, price move). Overlapping same-side waves on two
        or more venues are one `combined` episode with `startedBy`,
        `venueStarts[].lagSec` (seconds after the first print),
        `venueStarts[].totalNotional` / `sharePct` (how much of the wave
        that venue produced), `largestBy`, and `orderUnknown` when two
        venues share the same first-print second.
        `symbol=all` pools every tracked coin (market-wide risk; no price).
        Informational only.
      operationId: getMarketLiquidationCascade
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          description: Pair (BTCUSDT) or all for the pooled market
          schema: { type: string, default: all, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all, example: all }
      responses:
        '200':
          description: Per-venue cascade scores plus both-venues flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLiquidationCascade'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidation-cascade/scan:
    get:
      summary: Market liquidation cascade scan
      description: |
        Scores **market-wide** cascade risk (pooled liquidations) and ranks
        coins that are currently elevated or cascading. Binance and Bybit stay
        separate; a hit's `both` flag means the same side is cascading on both
        venues. Informational only.
      operationId: scanMarketLiquidationCascades
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all, example: all }
      responses:
        '200':
          description: Market cascade plus ranked bursting coins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLiquidationCascadeScan'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/supply:
    get:
      summary: Asset circulating / total / max supply (Binance)
      description: |
        Supply metrics from the Binance marketing symbol list snapshot (cache-only
