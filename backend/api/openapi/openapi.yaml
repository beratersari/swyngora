          schema: { type: string, default: all }
        - name: quote
          in: query
          description: Quote asset for the universe (default USDT)
          schema: { type: string, default: USDT }
        - name: lookback
          in: query
          description: 4h | 12h | 24h | 3d | 7d (default 3d)
          schema: { type: string, default: "3d" }
        - name: interval
          in: query
