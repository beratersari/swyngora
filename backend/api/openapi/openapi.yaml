  /api/v1/market/holders:
    get:
      summary: Crypto holder count and top wallets
      description: |
        On-chain holder snapshot for a crypto base asset (or pair). Sources are
        tried in order (no paid plans): CoinMarketCap public detail by Binance
        `cmcUniqueId` or marketing `slug`, then Coin Metrics `AdrBalCnt`, then
        GeckoTerminal token info, then Ethplorer ERC-20, then Routescan EVM
        (including Chiliz), then Tronscan TRC-20. UTXO coins such as PIVX may
        fall back to Chainz CryptoID. Cache TTL default 1h; 429 / upstream blips
        may serve last-good with `stale: true`. `404` `catalog_unmapped` /
        `holders_unpublished` only after every source misses. Informational only.
      operationId: getHolders
      tags: [Market]
      parameters:
        - name: asset
          in: query
          required: false
          description: Base asset ticker (preferred). Provide asset or symbol (at least one required).
          schema:
            type: string
            example: BTC
        - name: symbol
          in: query
          required: false
          description: Alias for asset; may be a pair like BTCUSDT. Provide asset or symbol (at least one required).
          schema:
            type: string
            example: BTCUSDT
      responses:
        '200':
          description: Holder snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetHolders'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
