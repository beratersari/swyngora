        unusedNotional:
          type: string
          description: Requested notional minus usedNotional
        usedQuantity: { type: string }
        unusedQuantity: { type: string }
        usedPct:
          type: number
          description: Percent of the entered size that can really be used
        note: { type: string }
    PriceDiffQuoteScan:
      type: object
      properties:
        symbol: { type: string }
        requestedNotional: { type: string }
        requestedQuantity: { type: string }
        bestRoute:
          $ref: '#/components/schemas/PriceDiffQuote'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/PriceDiffQuote'
        minProfitPct: { type: number }
        minProfitAmount: { type: number }
        profitableCount: { type: integer }
        skippedCount: { type: integer, description: Routes hidden because they missed the profit floor }
        venueCount: { type: integer }
        loadedVenueCount: { type: integer }
        unavailable:
          type: array
