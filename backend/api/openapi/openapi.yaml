        - name: portfolioId
          in: query
          schema: { type: string }
        - name: X-Portfolio-Id
          in: header
          schema: { type: string }
        - name: period
          in: query
          required: false
          description: Lookback window. Default 1w.
          schema:
            type: string
            enum: [1d, 1w, 1m, 3m]
            default: 1w
      responses:
        '200':
          description: Period P&L and equity series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioPerformance'
        '404':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/portfolio/risk-limits:
    get:
      summary: Get paper risk limits and live status
      description: |
        Optional user-set brakes. Limits never close existing positions.
        Daily loss uses UTC start-of-day equity vs current equity (spot+margin MTM).
        maxAssetWeightPct blocks new buys/opens that would push one coin over the cap.
        Returns limits plus status (daily PnL, per-asset weights, blockReasons) for the settings screen.
      operationId: getPortfolioRiskLimits
      tags: [Portfolio]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Limits + live status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskLimitsView'
        '404':
          $ref: '#/components/responses/Error'
    put:
      summary: Set or update paper risk limits
      description: |
        Replace both rules. Omit a field or send null to disable that rule.
        Does not close positions. New spot buys and new margin long/short are blocked when a rule is hit.
      operationId: putPortfolioRiskLimits
      tags: [Portfolio]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxDailyLossPct:
                  type: number
                  nullable: true
                  exclusiveMinimum: 0
                  maximum: 100
                  description: Block new risk when today's MTM loss reaches this % of UTC start-of-day equity
                  example: 5
                maxAssetWeightPct:
                  type: number
                  nullable: true
                  exclusiveMinimum: 0
                  maximum: 100
                  description: Block new buys/opens that would make one coin more than this % of equity
                  example: 30
      responses:
        '200':
          description: Updated limits + status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskLimitsView'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      summary: Clear all paper risk limits
      operationId: deletePortfolioRiskLimits
      tags: [Portfolio]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Limits removed
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/portfolio/trading-costs:
    get:
      summary: Paper trading fee and slippage rates
      description: |
        Per-exchange paper taker fee and adverse slippage applied on every fill
        (market, pending, recurring, margin). Rates are fractions (0.001 = 0.10%).
        Optional exchange query returns one venue; omit to list all.
        Paper trading only — not real money.
      operationId: getPaperTradingCosts
      tags: [Portfolio]
      parameters:
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit] }
          description: Optional venue; omit to list all
      responses:
        '200':
          description: Paper fee and slippage rates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperTradingCostsResponse'
  /api/v1/portfolio/orders:
    post:
      summary: Place a paper order (market or pending)
      description: |
        type=market (default): immediate buy/sell at last price plus adverse slippage (side required);
        a taker fee is charged. Buy cash debit and tax-lot unit cost include the fee; sell credit and
        realized PnL are after the fee. Uses available cash/qty only.
        type=limit_buy|limit_sell|stop_loss: resting order with triggerPrice; reserves cash (buy, including
        worst-case slip + fee) or position (sell);
        may fill partially and stay open until remaining size is zero; each fill is a trade history row.
        type=oco: linked take-profit limit_sell + stop_loss for the same quantity (takeProfitPrice, stopLossPrice);
        shared position reservation; full fill of one cancels the other; partial fill shrinks both remainings;
        same price tick fills at most one leg (stop preferred if both trigger).
        type=trailing_stop: sell stop that trails a high-water mark by percent or fixed offset; stop only moves up;
        triggers once when last <= stop (including price gaps through the level).
        type=bracket: limit_buy entry (triggerPrice) plus takeProfitPrice + stopLossPrice; exits stay pending until
        entry fills, size tracks filled qty, exits are OCO so only one side sells each unit.
        lotMethod=fifo (default) or lifo selects which buy lots a sell consumes; remaining qty stays on the lot.
        See GET /api/v1/portfolio/trading-costs for per-exchange rates.
        Optional Idempotency-Key header or idempotencyKey body: a retry with the same key and same request
        returns the original order/trade instead of creating a second one. A different request with the same
        key returns 409. Keys last 24 hours and are scoped to the paper book.
        Paper trading only — not real money.
      operationId: placePortfolioOrder
      tags: [Portfolio]
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string, maxLength: 128 }
          description: Optional retry key; same key + same request replays the original result (body idempotencyKey also accepted)
        - name: X-Idempotency-Key
          in: header
          schema: { type: string, maxLength: 128 }
          description: Alias of Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, quantity]
              properties:
                clientId: { type: string }
                exchange: { type: string, enum: [binance, coinbase, bybit], default: binance }
                symbol: { type: string }
                type:
                  type: string
                  enum: [market, limit_buy, limit_sell, stop_loss, trailing_stop, oco, bracket]
                  default: market
                side:
                  type: string
                  enum: [buy, sell]
                  description: Required for market orders; derived for pending types
                quantity: { type: number, exclusiveMinimum: 0 }
                triggerPrice:
                  type: number
                  exclusiveMinimum: 0
                  description: Limit/stop price, or bracket entry limit_buy price
                trailType:
                  type: string
                  enum: [percent, offset]
                  description: Trailing stop distance mode (required for type=trailing_stop)
                trailValue:
                  type: number
                  exclusiveMinimum: 0
                  description: |
                    Trail distance — percent as fraction (0.05 = 5% below peak), or fixed price offset.
                    Required for type=trailing_stop.
                takeProfitPrice:
                  type: number
                  exclusiveMinimum: 0
                  description: OCO take-profit limit sell price (required for type=oco)
                stopLossPrice:
                  type: number
                  exclusiveMinimum: 0
                  description: OCO stop-loss trigger (required for type=oco; must be below takeProfitPrice)
                timeInForce:
                  type: string
                  enum: [gtc, ioc, fok]
                  default: gtc
                  description: |
                    gtc - rest until filled/canceled/expired;
                    ioc - fill available on first try, cancel remainder;
                    fok - fill fully on first try or cancel with no fill
                expiresAt:
                  type: string
                  format: date-time
                  description: Optional RFC3339 expiry (GTC only); cancels and releases reservation when reached
                lotMethod:
                  type: string
                  enum: [fifo, lifo]
                  default: fifo
                  description: Sell lot matching (market, limit_sell, stop, trailing, OCO, bracket exits). Ignored on buys.
                idempotencyKey:
                  type: string
                  maxLength: 128
                  description: Optional client key; same key + same request replays the original result (header Idempotency-Key also accepted)
      responses:
        '200':
          description: Market fill and updated portfolio
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, example: market }
                  trade: { $ref: '#/components/schemas/PaperTrade' }
                  portfolio: { $ref: '#/components/schemas/PortfolioView' }
                  note: { type: string }
        '201':
          description: Pending order or OCO pair created
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string }
                  order: { $ref: '#/components/schemas/PendingOrder' }
                  ocoGroupId: { type: string }
                  bracketId: { type: string }
                  entry: { $ref: '#/components/schemas/PendingOrder' }
                  takeProfit: { $ref: '#/components/schemas/PendingOrder' }
                  stopLoss: { $ref: '#/components/schemas/PendingOrder' }
                  note: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      summary: List paper pending orders
      description: Defaults to open orders. status=open|filled|canceled|rejected|all
      operationId: listPortfolioOrders
      tags: [Portfolio]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [open, filled, canceled, rejected, all], default: open }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Pending order list
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/portfolio/orders/cancel-all:
    post:
      summary: Cancel all open paper pending orders
      description: |
        Cancels every open (and inactive bracket-exit `pending`) paper order for the client,
        or only those on one market when `symbol` is set (optional `exchange`, default binance).
        `exchange` without `symbol` cancels every pair on that venue.
        Releases unused cash/position reservations. Empty result is success (`canceled: 0`).
        Does not cancel margin limit orders. Paper trading only.
      operationId: cancelAllPortfolioOrders
      tags: [Portfolio]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string }
                exchange: { type: string, enum: [binance, coinbase, bybit] }
                symbol:
                  type: string
                  description: When set, cancel only this pair; omit to cancel all markets
                  example: BTCUSDT
      responses:
        '200':
          description: Canceled orders and updated portfolio
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/PendingOrder' }
                  canceled: { type: integer }
                  scope: { type: string, enum: [all, market, exchange] }
                  exchange: { type: string }
                  symbol: { type: string }
                  portfolio: { $ref: '#/components/schemas/PortfolioView' }
                  note: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/portfolio/orders/{id}:
    get:
      summary: Get one paper pending order
      description: |
        Returns the order plus last price and amend hints for the edit screen.
        availableCashForOrder / availableQuantityForOrder include this order's current reservation
        so the UI can compute max remaining at a typed price. editable is false for filled,
        canceled, IOC/FOK, trailing, OCO, and bracket legs.
      operationId: getPortfolioOrder
      tags: [Portfolio]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Order detail for display or edit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingOrderDetail'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      summary: Amend an open paper pending order
      description: |
        Change triggerPrice and/or remainingQuantity in place (same id). Recalculates cash or
        position reservations. Only open GTC standalone limit_buy, limit_sell, and stop_loss.
        remainingQuantity must stay above zero (use DELETE to cancel). Original quantity becomes
        filledQuantity + remainingQuantity. If the new price is already marketable, one fill
        attempt runs immediately. Concurrent fill/cancel returns 409.
      operationId: amendPortfolioOrder
      tags: [Portfolio]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendPendingOrderRequest'
      responses:
        '200':
          description: Amended order and updated portfolio snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/PendingOrder' }
                  portfolio: { $ref: '#/components/schemas/PortfolioView' }
                  note: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      summary: Cancel an open paper pending order
      description: Only open orders can be canceled. Filled/canceled/rejected return 404. Canceled orders never fill.
      operationId: cancelPortfolioOrder
      tags: [Portfolio]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Canceled order
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/PendingOrder' }
                  note: { type: string }
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/portfolio/trades:
    get:
      summary: List paper trade history
      operationId: listPortfolioTrades
      tags: [Portfolio]
