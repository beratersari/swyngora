        sellExchange: { type: string, enum: [binance, coinbase, bybit] }
        requestedNotional: { type: string }
        requestedQuantity: { type: string }
        filledQuantity: { type: string }
        filledRequested: { type: boolean }
        averageBuyPrice: { type: string }
        averageSellPrice: { type: string }
        bestAsk: { type: string }
        bestBid: { type: string }
        buySlippagePct: { type: number, description: Adverse vs best ask }
        sellSlippagePct: { type: number, description: Adverse vs best bid }
        slippagePct: { type: number, description: buySlippagePct + sellSlippagePct }
        buyNotional: { type: string }
        sellNotional: { type: string }
        buyFeePct: { type: number }
        sellFeePct: { type: number }
        buyFee: { type: string }
        sellFee: { type: string }
        costAfterFees: { type: string }
        proceedsAfterFees: { type: string }
        profitAfterFees: { type: string }
        profitPct: { type: number }
        grossProfit: { type: string }
        grossPct: { type: number }
        buyExhausted: { type: boolean }
        sellExhausted: { type: boolean }
        profitable: { type: boolean }
        executable:
