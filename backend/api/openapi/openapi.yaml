openapi: 3.0.3
info:
  title: Swyngora Market API
  description: |
    Public market data for Swyngora (v0.1).

    - Candles, 24h volume/ticker, and spot/equity listing support **binance**, **coinbase**,
      **bybit**, **nasdaq**, and **bist** (select with `?exchange=`). Nasdaq/BIST are cash
      equities (USD/TRY) via public Yahoo quotes; no live order book.
    - Circulating / total / max supply is sourced from the **Binance** public marketing
      symbol list (asset-level, used for all venues' mcap enrichment), refreshed daily.
      Max supply is null when undefined.
    - Watchlist is unauthenticated state keyed by client-supplied `clientId`
      (must be non-empty; not for multi-tenant production without real auth).
      Data is persisted in SQLite on the server (survives restarts). Each list has a monotonic
      `version` for multi-device sync: send `baseVersion` on writes; concurrent adds of different
      symbols auto-merge; delete-vs-update on the same symbol returns 409 with both sides.
    - Price alerts support `one_time` (default) or `repeating` modes for above/below targets.
      Order-book alerts (`kind=imbalance` or `kind=wall`) use the live local book and default
      to repeating with edge re-arm so the same wall/imbalance does not re-fire until it clears.
      One-time alerts become `triggered` after the first fire; repeating alerts stay `active`
      and re-fire only after the price returns to the safe side and crosses again.
    - Clients may register a webhook URL with deliveryMode `immediate` or `hourly_digest`,
      plus optional quiet hours (IANA timeZone + local start/end). Delivery is deferred until
      quiet hours end; pending notifications survive restarts.
    - Realtime WebSocket (`GET /api/v1/ws`): subscribe/unsubscribe selected coin prices
      and one paper portfolio for order/position/cash events. Reconnect by resubscribing;
      access is checked per book. See `GET /api/v1/realtime`.
    - Paper trading: one or more named virtual portfolios per client (own cash, positions,
      orders, and performance), market buy/sell at last price,
      pending limit buy/sell and stop-loss orders with balance/position reservations and
      partial fills (auto-fill on price), open positions, realized/unrealized P&amp;L,
      trade history, recurring buy (DCA) plans, and isolated margin long/short (1x–10x)
      with market/limit opens, liquidation, partial close, and stop-loss/take-profit
      (SQLite; not real money).
    - Cross-exchange price difference tracking: watch a coin across Binance, Coinbase, and
      Bybit; when net edge after fees exceeds a threshold, store a buy/sell opportunity.
      Open opportunities persist across restarts; no duplicate while open; re-open after
      the edge falls below the limit and rises again. Stale or missing prices skip signals.
    - Funding-arb follows: watch Binance vs Bybit after-fee funding; notify via the
      alert webhook when horizon net is at least `minProfit`. The first clock of a
      history run is the entry signal (not collected profit).
    - Technical indicator scanner: RSI, EMA crossover, and volume-increase rules over the
      client's watchlist; background evaluation; match history deduped by rule/symbol/bar.
    - Swing engine: 4h+1d pattern detection (Wilder RSI/ADX/ATR, SuperTrend, MACD), BTC regime
      and R:R quality gates, ATR/structure trade levels. Informational only.
    - Historical backtests: run a scanner rule or custom signal profile over a date range for one symbol, track progress,
      cancel jobs, and view signals with 1/5/20-day forward returns plus first-touch TP/SL trades.
    - User data export: download watchlist, shares, price-alert history, and backtest results as
      JSON or CSV. Large exports run in the background with progress and cancel; one active export
      per client; files are owner-only downloads and expire after a TTL.
    - User data import: upload a prior JSON/CSV export, preview valid/invalid/willAdd/willUpdate
      counts (custom signal profiles list addNames vs updateNames), then confirm with merge or
      replace mode. Dedupes symbols/shares/ids; same-name custom mixes are updated on merge;
      large applies run in the background with progress and cancel.
    - Account close: close a clientId for 7 days (reopen allowed); product APIs and shared-list
      access stop; after grace, user data and jobs are purged.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  time:
                    type: string
                    format: date-time
  /api/v1/realtime:
    get:
      summary: Realtime WebSocket protocol description
      description: |
        Returns how to connect to `GET /api/v1/ws` (JSON messages).
        Subscribe/unsubscribe selected coins for price ticks and one paper portfolio
        for order/position/cash events. Resubscribe after reconnect; access is
        enforced per book (owner, trader, or viewer). Paper trading only.
      operationId: getRealtimeInfo
      tags: [Realtime]
      responses:
        '200':
          description: Connection and message protocol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeInfo'
  /api/v1/realtime/ticket:
    post:
      summary: Mint a one-time WebSocket ticket
      description: |
        Returns a 60-second, single-use ticket bound to the caller. Browsers
        send this as `?ticket=` on `GET /api/v1/ws` instead of the long-lived
        API secret. Requires the same header auth as other tenant routes.
      operationId: createRealtimeTicket
      tags: [Realtime]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Ticket minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicket'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/ws:
    get:
      summary: WebSocket realtime stream
      description: |
        Upgrade to WebSocket. REST uses `Authorization` / `X-API-Key`.
        Browsers mint a one-time ticket (`POST /api/v1/realtime/ticket`) and
        pass `?ticket=` plus `?clientId=`. Long-lived secrets are not accepted
        on the query string.

        Client JSON: `{ "type": "subscribe_prices", "symbols": [{ "exchange", "symbol" }] }`,
        `unsubscribe_prices`, `subscribe_portfolio` (`portfolioId`), `unsubscribe_portfolio`, `ping`.

        Server JSON: `hello`, `ack`, `price`, `portfolio` (snapshot / order / position / fill),
        `error`, `pong`. After reconnect, resend subscriptions; the server snapshots current state.
        Portfolio events are sent only if this clientId can view the book.
      operationId: realtimeWebSocket
      tags: [Realtime]
      parameters:
        - in: query
          name: clientId
          required: true
          schema: { type: string }
        - in: query
          name: ticket
          schema: { type: string }
          description: One-time ticket from POST /api/v1/realtime/ticket (60s, single use)
        - in: query
          name: portfolioId
          schema: { type: string }
          description: Optional initial book (still send subscribe_portfolio)
      responses:
        '101':
          description: Switching Protocols (WebSocket)
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/market/exchanges:
    get:
      summary: List supported spot exchanges
      operationId: listExchanges
      tags: [Market]
      responses:
        '200':
          description: Configured venues
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchanges:
                    type: array
                    items:
                      type: string
                    example: ["binance", "coinbase", "bybit"]
                  default:
                    type: string
                    example: binance
                  venueQuotes:
                    type: object
                    additionalProperties: { type: string }
                    description: Native quote of last/open/high/low/quoteVolume per venue
                  marketCapQuotes:
                    type: object
                    additionalProperties: { type: string }
                    description: Currency of market-cap fields per venue

  /api/v1/market/fx:
    get:
      summary: Spot FX rates for display conversion
      description: |
        USD-based spot rates (units of each currency per 1 USD) for converting
        BIST TRY, Nasdaq/Coinbase USD, and crypto USDT quotes in the UI.
        USDT is treated as USD. Rates are cached; `stale` is true when serving
        last-good after an upstream miss. Display only — not settlement FX.
      operationId: getFxRates
      tags: [Market]
      responses:
        '200':
          description: USD-based FX snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxRates'

  /api/v1/market/intervals:
    get:
      summary: List supported candle intervals
      operationId: listIntervals
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          description: Venue id (binance | coinbase | bybit | nasdaq | bist). Default binance. Interval sets differ per venue.
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit, nasdaq, bist]
      responses:
        '200':
          description: Supported intervals for the selected exchange
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchange:
                    type: string
                    example: binance
                  intervals:
                    type: array
                    items:
                      type: string
                    example: ["1m", "5m", "1h", "1d"]

  /api/v1/market/tags:
    get:
      summary: List Binance product-catalog tags
      description: |
        Unique crypto product tags from Binance product catalog (e.g. Meme, defi, Layer1_Layer2).
        Used to power spot list tag filters. Non-crypto tags (bStocks, tCommodities) are excluded.
        Tags are only populated for Binance; other exchanges return an empty list.
      operationId: listProductTags
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          description: Venue id (binance | coinbase | bybit | nasdaq | bist). Default binance.
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit, nasdaq, bist]
      responses:
        '200':
          description: Sorted unique tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchange:
                    type: string
                    example: binance
                  tags:
                    type: array
                    items:
                      type: string
                    example: ["AI", "Layer1_Layer2", "Meme", "defi"]
        '502':
          $ref: '#/components/responses/Error'


  /api/v1/market/delist-schedule:
    get:
      summary: List scheduled spot delistings
      description: |
        Cached spot delist schedule per venue. Binance uses the official
        wallet schedule when BINANCE_API_KEY is set. Bybit is parsed from
        public delisting announcements (no key). Coinbase / Nasdaq / BIST
        have no free future calendar. Each item includes `delistTime` (halt)
        and `announcedAt` when the venue published the notice (Binance CMS
        `releaseDate`, Bybit `publishTime`). Pairs that delist in the next
        ~31 days or in the last 30 days stay on the default TRADING markets
        list with a Delist tag.
      operationId: listDelistSchedule
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit, nasdaq, bist]
      responses:
        '200':
          description: Delist schedule snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelistScheduleResponse'
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/market/post-delist:
    get:
      summary: Off-venue price after this exchange delisted the pair
      description: |
        After a venue has halted a pair, Binance (or that venue) has no new
        trades. This returns a labeled public reference: another listed venue
        if the pair still trades there, otherwise CoinGecko USD last + OHLC.
        Informational only — not this venue's book, not financial advice.
        Listed and upcoming pairs return `available: false`.
      operationId: getPostDelist
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit, nasdaq, bist]
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: VICUSDT
        - name: interval
          in: query
          required: false
          description: Hint for other-venue candles. CoinGecko OHLC is daily (7d or 30d).
          schema:
            type: string
            default: 1d
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Post-delist off-venue snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDelistResponse'
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/market/spot:
    get:
      summary: List Binance spot markets with search and sort
      description: |
        Returns spot-tradable pairs from Binance `exchangeInfo`, joined with
        24h ticker metrics. Supports substring search (`q`), quote/base/status
        filters, sorting by volume and other metrics, and offset pagination.
      operationId: listSpotMarkets
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          description: Venue id (binance | coinbase | bybit | nasdaq | bist). Default binance.
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit, nasdaq, bist]
        - name: q
          in: query
          required: false
          description: Case-insensitive search on symbol, baseAsset, or quoteAsset
          schema:
            type: string
            example: btc
        - name: quote
          in: query
          required: false
          description: Filter by quote asset (e.g. USDT)
          schema:
            type: string
            example: USDT
        - name: base
          in: query
          required: false
          description: Filter by base asset (e.g. BTC)
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by exchange status (e.g. TRADING)
          schema:
            type: string
            example: TRADING
        - name: tag
          in: query
          required: false
          description: |
            Filter by Binance product-catalog tag (case-insensitive).
            Comma-separated or repeated `tag` params use OR semantics (has any).
            Examples: `Meme`, `defi,AI`, `Layer1_Layer2`.
          schema:
            type: string
            example: Meme
        - name: tags
          in: query
          required: false
          description: Alias of `tag` (comma-separated product tags, OR match)
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort field (default quoteVolume)
          schema:
            type: string
            default: quoteVolume
            enum: [quoteVolume, volume, priceChangePercent, lastPrice, tradeCount, symbol, baseAsset, marketCapCirculating, marketCapTotal, marketCapMax, tags]
        - name: order
          in: query
          required: false
          description: Sort direction (default desc for metrics, asc for symbol/baseAsset)
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          required: false
          description: Page size (1-500, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          required: false
          description: Rows to skip after filter+sort (default 0)
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Paged spot market list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotListResponse'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/candles:
    get:
      summary: Fetch OHLCV candlesticks
      operationId: getCandles
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          schema:
            type: string
            enum: [binance, coinbase, bybit, nasdaq, bist]
            default: binance
        - name: symbol
          in: query
          required: true
          description: Trading pair (Binance/Bybit BTCUSDT; Coinbase BTC-USD)
          schema:
            type: string
            example: BTCUSDT
        - name: interval
          in: query
          required: false
          description: |
            Candle interval (default 1h). Supported values are exchange-specific -
            call GET /api/v1/market/intervals?exchange=... for the authoritative list.
            Coinbase/Bybit reject many Binance-only intervals with 400.
          schema:
            type: string
            default: 1h
            example: 1h
        - name: limit
          in: query
          required: false
          description: Number of candles (1-1000, default 100)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: startTime
          in: query
          required: false
          description: RFC3339 or Unix milliseconds
          schema:
            type: string
        - name: endTime
          in: query
          required: false
          description: RFC3339 or Unix milliseconds
          schema:
            type: string
      responses:
        '200':
          description: Candle series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandlesResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/ticker/24h:
    get:
      summary: 24-hour rolling ticker including volume
      operationId: getTicker24h
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          description: Venue id (binance | coinbase | bybit | nasdaq | bist). Default binance.
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit, nasdaq, bist]
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: BTCUSDT
      responses:
        '200':
          description: 24h statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticker24h'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook:
    get:
      summary: Grouped spot order book
      description: |
        Live spot bid/ask depth with **backend price grouping** (e.g. 0.01, 0.1, 1).
        Each row is a merged price bucket with quantity, quote notional, running totals,
        and `isWall` when that bucket is unusually large versus the rest of the visible
        side (buy/sell walls). `suggestedGroupSizes` are ready-made steps for the UI.
        Spot only. Binance, Coinbase, and Bybit each keep a **live local book** on their
        public depth websocket. A dropped stream or missed update invalidates the copy and
        resyncs; stale depth is not returned.
        `analysis` scores buy/sell pressure, notional imbalance, and large walls using
        every resting level within ±`rangePct` of mid (default 2%) — not only the first
        few ladder rows. Informational — not financial advice.
      operationId: getSpotOrderBook
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit, nasdaq, bist], default: binance }
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: group
          in: query
          description: Price bucket size (e.g. 0.1). Omit to use a suggested default.
          schema: { type: string, example: "0.1" }
        - name: limit
          in: query
          description: Grouped rows per side (5–100, default 20)
          schema: { type: integer, default: 20, minimum: 5, maximum: 100 }
        - name: rangePct
          in: query
          description: Analyze resting depth within this ± percent of mid (0.25–10, default 2)
          schema: { type: number, default: 2, minimum: 0.25, maximum: 10, example: 2 }
      responses:
        '200':
          description: Grouped book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotOrderBook'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/history:
    get:
      summary: Stored order-book snapshots
      description: |
        Regular samples of the live spot book: grouped **bid/ask levels**,
        **spread**, **total liquidity**, **imbalance**, and **large walls**.
        Pass `at` for the snapshot nearest that time. Omit `at` to list
        recent samples (`from` / `to` optional). 1-minute ladder samples, not a
        24h tape. A snapshot's `flashes` are walls that rested only a few
        seconds inside that minute and were gone before the ladder was stored.
        `moves` are other resting-size changes in that minute (not walls) that
        the ladder does not show: size that left, or a swing whose peak is
        gone by the snapshot. Informational only.
      operationId: getOrderBookHistory
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit], default: binance }
        - name: at
          in: query
          description: Point in time (RFC3339 or unix ms)
          schema: { type: string, example: "2026-08-16T12:00:00Z" }
        - name: from
          in: query
          description: List window start (RFC3339 or unix ms)
          schema: { type: string }
        - name: to
          in: query
          description: List window end (RFC3339 or unix ms)
          schema: { type: string }
        - name: limit
          in: query
          description: Max list rows (default 60, max 500)
          schema: { type: integer, default: 60 }
      responses:
        '200':
          description: One snapshot or a newest-first list
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/history/compare:
    get:
      summary: Compare two stored order books
      description: |
        Loads the stored books nearest to `from` and `to` and shows which
        **price levels gained or lost liquidity**, plus mid / spread /
        imbalance change and walls that appeared or were pulled.
        Use this to see what changed before and after a price move.
        Informational only.
      operationId: compareOrderBookHistory
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit], default: binance }
        - name: from
          in: query
          required: true
          description: Earlier time (RFC3339 or unix ms)
          schema: { type: string, example: "2026-08-16T12:00:00Z" }
        - name: to
          in: query
          required: true
          description: Later time (RFC3339 or unix ms)
          schema: { type: string, example: "2026-08-16T12:15:00Z" }
      responses:
        '200':
          description: Before/after liquidity diff
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/icebergs:
    get:
      summary: Iceberg-style refill at the same price
      description: |
        Detects when visible **buy or sell** size at one price is eaten
        (hit at the touch or confirmed by trades) and then a similar clip
        comes back, repeatedly. This is the “10k sells, gets filled, 10k
        appears again” pattern — not a one-shot wall. Both sides.
        Walls on the live book also get `iceberg` / `behavior=iceberg`
        when this pattern is seen. Informational only — not proof of a
        hidden exchange order.
      operationId: getOrderBookIcebergs
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | coinbase | bybit | all (default all)
          schema: { type: string, default: all }
        - name: minNotional
          in: query
          description: Minimum visible clip in USD (default 25000)
          schema: { type: number, default: 25000 }
      responses:
        '200':
          description: Bid and ask icebergs, biggest clip first
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/liquidity-flow:
    get:
      summary: Traded vs pulled vs added resting liquidity
      description: |
        When a bid (or ask) shrinks — for example **8M at 65500 down to 2M**
        five minutes later — split that 6M into **traded** (aggressive prints
        at that price) versus **pulled** (cancelled / no matching print).
        Size that appeared is **added**. `bids` / `asks` totals plus per-price
        `levels`, and `series` of added/pulled/traded over the stored samples.
        Uses 1-minute stored spot books (top grouped levels) plus spot prints
        (Binance aggTrades; Bybit/Coinbase recent public trades). Not L3
        order-by-order. `window` `5m` / `15m` / `1h` (default `5m`) or
        `startTime` + `endTime` (max 1h). Optional `minPrice` / `maxPrice`.
        Informational only.
      operationId: getOrderBookLiquidityFlow
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | coinbase | bybit | all (default all)
          schema: { type: string, default: all }
        - name: window
          in: query
          description: 5m | 15m | 1h (default 5m). Ignored when startTime/endTime are set.
          schema: { type: string, default: "5m" }
        - name: startTime
          in: query
          description: Range start (RFC3339 or unix ms). Max span 1h.
          schema: { type: string }
        - name: endTime
          in: query
          description: Range end (RFC3339 or unix ms)
          schema: { type: string }
        - name: minPrice
          in: query
          description: Only include this price and above (e.g. 65400).
          schema: { type: number, example: 65400 }
        - name: maxPrice
          in: query
          description: Only include this price and below (e.g. 65600).
          schema: { type: number, example: 65600 }
      responses:
        '200':
          description: Per-venue and optional combined traded vs pulled vs added
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/combined:
    get:
      summary: Market-wide spot order book analysis
      description: |
        Combines live local books from Binance, Coinbase, and Bybit for one coin.
        Totals use only a **symmetric ±% band** every contributing venue can
        reach on **both** sides (the smaller of common bid reach and common ask
        reach). If all venues cover the requested ±`rangePct` both ways, that
        band is used (`requestedReached`, `usedRangePct`, `usedLow`, `usedHigh`).
        USD and USDT are treated as 1:1. Partial results if a venue is down.
        Informational only.
      operationId: getCombinedSpotOrderBook
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
          description: Pair on any venue (BTCUSDT or BTC-USD)
        - name: rangePct
          in: query
          description: ± percent of shared mid (0.25–10, default 2)
          schema: { type: number, default: 2, minimum: 0.25, maximum: 10, example: 2 }
      responses:
        '200':
          description: Combined analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedOrderBook'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/liquidity:
    get:
      summary: Liquidity score from live order-book depth
      description: |
        Scores how easy a pair is to trade from resting bid/ask notional.
        Only ±0.1 / ±0.5 / ±1% bands the book actually reaches on **both**
        sides are included (`usedRangePct`). Market-wide uses the symmetric
        ±% Binance, Coinbase, and Bybit can all reach. Near included depth
        is weighted more. Informational only.
      operationId: getMarketLiquidity
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | coinbase | bybit | all (default all)
          schema: { type: string, default: all, example: all }
      responses:
        '200':
          description: Liquidity scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLiquidity'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/spot-perp:
    get:
      summary: Compare spot and perpetual resting liquidity
      description: |
        Sums resting bid and ask notional on the spot books and on the
        perpetual books at the same ±0.1% / ±0.5% / ±1% of each book's mid.
        Says which book is thinner and which side (bid or ask) is thinner
        on each. A venue counts in a band only when that book reaches the
        percent on both sides. Binance and Bybit rows compare that venue's
        own spot book with its perp. Informational only.
      operationId: getSpotPerpLiquidity
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: rangePct
          in: query
          description: Headline ± percent of mid (0.1–1, default 1). Nearer bands are always included.
          schema: { type: number, default: 1, minimum: 0.1, maximum: 1, example: 1 }
      responses:
        '200':
          description: Spot versus perp liquidity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotPerpLiquidity'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/heatmap:
    get:
      summary: Resting order-book heatmap over time
      description: |
        Recent **resting** bid/ask notional at each grouped price (not executed
        volume). Windows up to 30 minutes use the live 1s tape. Longer windows
        use stored 1-minute ladders, with brief walls and other size moves
        painted on the minute they happened. A multi-day window groups those
        minutes so the map stays readable. History only exists while the desk
        has been running (about 7 days). Informational only.
      operationId: getSpotOrderBookHeatmap
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit, nasdaq, bist], default: binance }
        - name: group
          in: query
          description: Price bucket size (e.g. 0.1). Omit for a suggested default.
          schema: { type: string, example: "0.1" }
        - name: window
          in: query
          description: Lookback in seconds (60–604800, default 600). Above 1800 uses stored book history.
          schema: { type: integer, default: 600, minimum: 60, maximum: 604800, example: 600 }
      responses:
        '200':
          description: Heatmap tape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookHeatmap'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/impact/scan:
    get:
      summary: Rank coins by slippage for the same market order
      description: |
        Walks the same quote-sized market order through each liquid pair's live
        spot book and ranks by slippage versus mid, widest first. Buy consumes
        asks; sell consumes bids. `exchange=all` merges Binance, Coinbase, and
        Bybit. Default order is 100,000 quote (1,000 to 50,000,000). A book
        that cannot fill the whole order is `exhausted`. Simulation only.
      operationId: scanSpotOrderBookImpact
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          description: binance | coinbase | bybit | all (default all)
          schema: { type: string, default: all }
        - name: quote
          in: query
          schema: { type: string, default: USDT }
        - name: side
          in: query
          schema: { type: string, enum: [buy, sell], default: buy }
        - name: notional
          in: query
          description: Shared quote size. Default 100000.
          schema: { type: number, default: 100000 }
        - name: limit
          in: query
          description: How many liquid pairs (default 20, min 5, max 30)
          schema: { type: integer, default: 20, minimum: 5, maximum: 30 }
      responses:
        '200':
          description: Coins ranked by slippage for one order size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookImpactScan'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/walls/scan:
    get:
      summary: Scan suspicious walls and brief flickers across liquid pairs
      description: |
        Lists spot walls the desk has watched on the liquid USDT pairs.
        `kind=suspicious` means the same wall was added and pulled at least
        4 times inside 2 minutes. `kind=flicker` means a large wall rested
        under about 20 seconds and then left. `exchange` is binance, coinbase,
        bybit, or all. The list stays empty until this process has been sampling.
        Not financial advice.
      operationId: scanSuspiciousWalls
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          description: binance | coinbase | bybit | all (default all)
          schema: { type: string, default: all }
        - name: quote
          in: query
          schema: { type: string, default: USDT }
        - name: limit
          in: query
          description: How many walls to return (default 40, max 80)
          schema: { type: integer, default: 40, minimum: 1, maximum: 80 }
      responses:
        '200':
          description: Suspicious walls and brief flickers, suspicious first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WallScan'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/gaps/scan:
    get:
      summary: Rank liquid pairs by which side of the book is thinner
      description: |
        Walks the liquid USDT pairs and compares resting size above and below
        mid. `easier=up` means asks in the band are well below bids, so a move
        up meets less size. `easier=down` is the mirror. The most one-sided
        books come first. One snapshot, not a forecast.
      operationId: scanBookGaps
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          schema: { type: string, default: all }
        - name: quote
          in: query
          schema: { type: string, default: USDT }
        - name: rangePct
          in: query
          schema: { type: number, default: 2 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 5, maximum: 30 }
      responses:
        '200':
          description: Coins ranked by the thinner side of the book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookGapScan'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/spreads/scan:
    get:
      summary: Rank coins whose bid-ask spread opened versus their own typical
      description: |
        Compares the latest top-of-book spread with the median of earlier
        samples of that same book. A coin is listed at 1.5× its own typical.
        Samples collect while this process watches the book. Widest ratio first.
      operationId: scanWideSpreads
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          schema: { type: string, default: all }
        - name: quote
          in: query
          schema: { type: string, default: USDT }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 40 }
      responses:
        '200':
          description: Coins with an unusually wide spread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WideSpreadScan'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/spread:
    get:
      summary: One coin's bid-ask spread versus its own typical
      operationId: getWideSpread
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          schema: { type: string, default: all }
      responses:
        '200':
          description: Spread versus typical
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WideSpread'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/gaps:
    get:
      summary: Find empty areas in the spot order book
      description: |
        Splits ±rangePct of mid into 0.1% steps and joins steps that hold
        under 15% of the typical step on that side. `easier=up` means a move
        up meets less resting size. `exchange=all` sums Binance, Coinbase,
        and Bybit. One snapshot, not a forecast.
      operationId: getBookGaps
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          schema: { type: string, default: all }
        - name: rangePct
          in: query
          description: ±% of mid (0.5–5, default 2)
          schema: { type: number, default: 2 }
      responses:
        '200':
          description: Empty stretches and which way the book is thinner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookGaps'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/impact:
    get:
      summary: Simulate market-order impact and slippage
      description: |
        Walks live resting depth like a market order. Buy consumes asks (lowest first);
        sell consumes bids (highest first). `exchange=all` (default) merges Binance,
        Coinbase, and Bybit and takes the best prices first. Provide **quantity**
        (base, e.g. 5 BTC) **or** **notional** (quote, e.g. 1000000000 USDT).
        Returns average fill, slippage vs mid/best, and price impact as the move
        of the best ask (buy) or best bid (sell) after leftover size. If the touch
        level still has quantity, impact is 0. If it is fully consumed and a new
        best remains, impact is the new best versus the old best. If the visible
        side is wiped, `impactAvailable` is false — the next best is unknown and
        impact is not invented from the last fill. Simulation only — not a quote.
      operationId: estimateSpotOrderBookImpact
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | coinbase | bybit | all (default all = combined walk)
          schema: { type: string, default: all, example: all }
        - name: side
          in: query
          schema: { type: string, enum: [buy, sell], default: buy }
        - name: quantity
          in: query
          description: Base size to fill (e.g. 5 for 5 BTC). Mutually exclusive with notional.
          schema: { type: number, example: 5 }
        - name: notional
          in: query
          description: Quote size to spend/receive (e.g. 1000000000). Mutually exclusive with quantity.
          schema: { type: number, example: 1000000 }
      responses:
        '200':
          description: Simulated fill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookImpact'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidations:
    get:
      summary: Rolling futures liquidation totals
      description: |
        Long/short liquidation notional, count, and the biggest hit for the last
        **5 minutes, 1 hour, 4 hours, and 24 hours**. Fed by Binance USD-M
        (`!forceOrder@arr`) and Bybit linear perpetual (`allLiquidation.{symbol}`)
        websocket streams. After a reconnect, each venue tries its own history
        for the hole; overlapping live+history prints are counted once. Venues
        stay separate. `coverageSeconds` / `complete` count live-socket time plus
        history that filled a disconnect. Combined `all` uses the shorter coverage
        of the venues watching that coin. `feed.gaps` lists still-unfilled holes
        in the last 6h; `missingSeconds` is how much time is still missing. A
        fully filled hole is omitted. Informational only.
      operationId: getMarketLiquidations
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all, example: all }
      responses:
        '200':
          description: Liquidation windows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLiquidations'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidations/overview:
    get:
      summary: Market-wide futures liquidation overview
      description: |
        CoinGlass-style **market desk**: long/short liquidation notional for the last
        **1 hour, 4 hours, 12 hours, and 24 hours**, plus coins ranked by total
        notional in `window` (default 24h) for a treemap. Fed by the same Binance
        USD-M, Bybit linear, and OKX USDT-swap streams as `/liquidations`. `exchange=all` (default)
        sums all three venues. `complete` uses the all-market Binance live clock when
        `exchange` is `all` or `binance`. Informational only.
      operationId: getMarketLiquidationOverview
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all, example: all }
        - name: window
          in: query
          description: Window used to rank `coins` — 1h | 4h | 12h | 24h (default 24h)
          schema: { type: string, default: 24h, enum: [1h, 4h, 12h, 24h], example: 24h }
        - name: limit
          in: query
          description: Max coins in the ranked list (default 50, max 100)
          schema: { type: integer, default: 50, minimum: 1, maximum: 100, example: 50 }
      responses:
        '200':
          description: Market-wide windows plus ranked coins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLiquidationOverview'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/open-interest:
    get:
      summary: Futures open interest and windowed change
      description: |
        Current outstanding futures size plus how much OI **opened or closed**
        over the last **5 minutes, 1 hour, 4 hours, and 24 hours** — USDT
        amount (`openedValue` / `closedValue` / signed `changeValue`) and
        percent (`changeValuePct`), per venue and combined.
        Sources: **Binance USD-M** (`/fapi/v1/openInterest` + 5m hist),
        **Bybit linear perpetual**, and **OKX USDT-swap**.
        `contracts` is venue-published size in the base asset; `value` is USDT
        notional. `exchange=all` (default) sums venues and keeps per-venue
        rows. `complete` is false
        when the historical sample is missing or older than the window slack.
        The `funding` object is the predicted next funding rate plus recent
        settlements (same payload as `/funding-rate`). `longShort` is the
        account long/short ratio (same payload as `/long-short-ratio`).
        Results are cached ~30s. Informational only.
      operationId: getMarketOpenInterest
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all, example: all }
      responses:
        '200':
          description: Current open interest and windowed change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOpenInterest'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/perp-depth:
    get:
      summary: Perpetual bid-below vs ask-above depth
      description: |
        How much **perpetual** liquidity is waiting **below** vs **above**
        the price. Example: **40M bid within 1% below** mid and **15M ask
        above**. `exchange=all` (default) returns **Binance USD-M**,
        **Bybit linear**, and **OKX USDT-swap** separately plus `combined`
        (sum of each venue's own ±% band). OKX contract size is converted
        to base before notional. `rangePct` is the headline band (default **1**,
        max 5). `bands` also include 0.1 / 0.25 / 0.5 / 2. `below` is
        resting bids; `above` is resting asks. `complete` is false when
        the snapshot does not reach that %. This is the **futures** book,
        not spot. Informational only.
      operationId: getMarketPerpDepth
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all }
        - name: rangePct
          in: query
          description: Headline ± percent of mid (default 1, 0.05–5)
          schema: { type: number, default: 1, example: 1 }
      responses:
        '200':
          description: Per-venue and optional combined perp depth
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/perp-depth/overview:
    get:
      summary: Market-wide perpetual bid vs ask liquidity
      description: |
        How much **perpetual** bid and ask liquidity is waiting across the
        **liquid USDT coins** we follow (same universe idea as breadth), plus
        which coins make up the biggest part of that book. Example: **2.4B bid
        vs 1.8B ask within 1% of mid; BTC 48%, ETH 17%**. `windows` compare
        bid vs ask **share of that book** 15m / 1h / 4h ago (e.g. bids 55% →
        65%) and `drivers` name the coins that moved the mix. `bands` show
        how close that book is to mid (e.g. **80M inside 0.1%** is **8% of
        the 1% book**, growing to 1.0B at 1%) and which coins fill each
        distance. `history` is total bid+ask each minute for the last 6 hours,
        with BTC's close on the same minutes. `moves` are the largest jumps
        and drops of at least 5% that finish within 15 minutes, plus BTC
        during that stretch and 15 minutes later. Sampled while the desk runs.
        `exchange=all` (default)
        adds Binance USD-M, Bybit linear, and OKX USDT-swap per coin. `rangePct` default
        **1**. `limit` default **20** (max 40). This is the **futures**
        book, not spot. Informational only.
      operationId: getMarketPerpDepthOverview
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all }
        - name: rangePct
          in: query
          description: Headline ± percent of mid (default 1, 0.05–5)
          schema: { type: number, default: 1, example: 1 }
        - name: limit
          in: query
          description: How many liquid perps to include (default 20, max 40)
          schema: { type: integer, default: 20, example: 20 }
      responses:
        '200':
          description: Total bid/ask plus ranked coin shares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketPerpDepthOverview'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/options:
    get:
      summary: BTC/ETH options overview (open interest, volume, PCR, IV, expiry)
      description: |
        CoinGlass-style **options desk** for **BTC** and **ETH** from **Deribit**
        public REST (no API key). Returns listed inverse-option open interest,
        24h volume, put/call ratios, Deribit DVOL (30-day implied vol index),
        ATM implied vol near the 30-day tenor, IV term structure (ATM IV by
        expiry), call/put skew (ATM put IV minus call IV, plus ~5% OTM wing),
        open-interest by expiry, and per-expiry 1-SD expected move plus max
        pain (strike that minimizes call+put intrinsic payout). `gamma` is
        dealer gamma exposure (USD delta per 1% spot move; short calls /
        long puts) plus the flip level where net GEX crosses zero.
        `history` is
        1h/4h/24h/7d change plus a chart series for open interest, put/call,
        implied vol, and dealer gamma / flip (DVOL from Deribit; OI/PCR/GEX
        sampled while the desk runs). `moves` lists only unusual short-window OI, put/call, IV,
        or a dealer-gamma / flip-side change
        changes versus that series' own typical. When options implied vol or
        put/call lean disagrees with live
        spot range or futures funding / account long-short, `vsMarket.findings`
        lists those disagreements only.
        `asset` accepts `BTC`, `ETH`, or a pair such as `BTCUSDT`.
        `exchange` is `deribit` (default). Cached ~30s. Informational only.
      operationId: getMarketOptions
      tags: [Market]
      parameters:
        - name: asset
          in: query
          description: BTC or ETH (or BTCUSDT / ETHUSDT)
          schema: { type: string, example: BTC }
        - name: symbol
          in: query
          description: Alias of asset (BTCUSDT → BTC)
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: deribit (default)
          schema: { type: string, default: deribit, example: deribit }
      responses:
        '200':
          description: Options overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOptions'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/funding-rate:
    get:
      summary: Perpetual funding rate and recent history
      description: |
        Predicted **next** funding rate plus recent **settled** payments for
        **Binance USD-M**, **Bybit linear**, and **OKX USDT-swap**. `rate` is decimal
        (`0.0001` = 0.01%); `ratePct` is percent. `payer` is who pays at
        settlement (`long` = longs pay shorts). Combined `exchange=all` keeps
        each venue as its own row. `pressure` is **OI-weighted** combined
        predicted funding (USDT open-interest share), so an 8B book at +0.01%
        outweighs a 1B book at −0.01%. `pressureHistory` / `pressureWindows`
        (1h/4h/24h) / `pressureMoves` show how that blend changed. `limit` is
        settled history size (default 12, max 30). Cached ~30s. Informational only.
      operationId: getMarketFundingRate
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all, example: all }
        - name: limit
          in: query
          description: Settled history size (1–30, default 12)
          schema: { type: integer, default: 12, minimum: 1, maximum: 30 }
      responses:
        '200':
          description: Current funding and recent settlements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketFundingRate'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/funding-arb:
    get:
      summary: Cross-exchange funding opportunity for one coin
      description: |
        Compare **Binance USD-M** and **Bybit linear** predicted funding and
        pick which venue to **long** (cheaper) and **short** (richer).
        Funding is paid only at each venue's published settlement clock
        (8h: 00:00/08:00/16:00 UTC; 4h: every four hours from 00:00 UTC).
        `holdHours` counts those clocks in `(now, now+holdHours]`. No clock
        means funding is **0**. `trade` is omitted unless after-fee net is
        positive. Informational only.
      operationId: getMarketFundingArb
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: notional
          in: query
          description: Quote-currency size to hold on each leg (default 10000)
          schema: { type: number, example: 10000 }
        - name: holdHours
          in: query
          description: How long to hold for the horizon payout (default 24)
          schema: { type: number, example: 24 }
        - name: feeBinancePct
          in: query
          description: Binance taker fee percent (default paper 0.10)
          schema: { type: number, example: 0.1 }
        - name: feeBybitPct
          in: query
          description: Bybit taker fee percent (default paper 0.10)
          schema: { type: number, example: 0.1 }
      responses:
        '200':
          description: Long/short venues and sized after-fee funding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketFundingArb'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/funding-arb/scan:
    get:
      summary: Rank coins by after-fee funding spread
      description: |
        Walks top 24h-volume USDT pairs and returns **only after-fee winners**
        (published settlements in `holdHours` beat round-trip taker fees).
        Same fee and size params as `/api/v1/market/funding-arb`. Informational only.
      operationId: scanMarketFundingArb
      tags: [Market]
      parameters:
        - name: notional
          in: query
          schema: { type: number, example: 10000 }
        - name: holdHours
          in: query
          schema: { type: number, example: 24 }
        - name: feeBinancePct
          in: query
          schema: { type: number }
        - name: feeBybitPct
          in: query
          schema: { type: number }
        - name: quote
          in: query
          schema: { type: string, default: USDT }
        - name: limit
          in: query
          description: How many top-volume coins to scan (default 15, max 40)
          schema: { type: integer, default: 15, minimum: 1, maximum: 40 }
      responses:
        '200':
          description: Ranked funding-arb hits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketFundingArbScan'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/funding-arb/history:
    get:
      summary: Past after-fee funding stretches for one coin
      description: |
        Settled Binance USD-M, Bybit linear, and OKX USDT-swap funding prints
        in `[from, to]`. Long is the lowest known rate and short is the highest
        among venues that have printed. Groups consecutive prints with the same
        long/short pair into a run and lists a run only when settled funding
        minus round-trip taker fees is positive. The first clock of a run is
        the entry signal — that payment is not collected (the position was not
        open before it). A run that starts and ends on the same clock is not
        profit. A direction flip at settlement still pays the old sides, then
        starts a new run. OKX uses `feeBybitPct` (there is no separate OKX fee).
        `from`/`to` are RFC3339, YYYY-MM-DD (UTC), or unix ms. Max 30 days.
        Informational only.
      operationId: getMarketFundingArbHistory
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: from
          in: query
          required: true
          schema: { type: string, example: "2026-08-01" }
        - name: to
          in: query
          required: true
          schema: { type: string, example: "2026-08-08" }
        - name: notional
          in: query
          schema: { type: number, example: 10000 }
        - name: feeBinancePct
          in: query
          schema: { type: number }
        - name: feeBybitPct
          in: query
          description: Bybit taker fee percent. Also the OKX leg (default paper 0.10)
          schema: { type: number }
      responses:
        '200':
          description: After-fee winning stretches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketFundingArbHistory'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/funding-arb/watches:
    post:
      summary: Follow a funding-arb opportunity
      description: |
        Omit `symbol` (or set `scan` / `*`) to follow the funding-arb scan:
        every liquid coin is re-quoted on a background interval. When a coin's
        after-fee net first reaches `minProfit`, opens a signal and enqueues
        the client's alert webhook (`type=funding_arb.triggered`). Same coin
        plus same long/short while still above the floor does not re-notify.
        After net falls below the floor the signal closes; a later re-cross
        notifies again. A coin missing from the volume-limited scan is
        re-quoted on its own and closed only when net is really below the
        floor. A direction flip closes the old signal and opens a new one.
        Optional `symbol` follows one pair only. Pause/resume and PATCH
        settings without deleting. One scan follow per client. Max 20
        watches per client. Informational only.
      operationId: createFundingArbWatch
      tags: [FundingArb]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minProfit]
              properties:
                clientId: { type: string }
                symbol:
                  type: string
                  description: Pair to follow, or omit / scan / * for the full scan
                  example: BTCUSDT
                quote: { type: string, example: USDT }
                limit: { type: integer, example: 15 }
                notional: { type: number, example: 10000 }
                holdHours: { type: number, example: 24 }
                durationHours:
                  type: number
                  description: How long the follow should run from now. Omit or 0 to keep running.
                  example: 48
                minProfit:
                  type: number
                  exclusiveMinimum: 0
                  description: Minimum after-fee profit in quote currency
                  example: 10
                feeBinancePct: { type: number, minimum: 0, example: 0.1 }
                feeBybitPct: { type: number, minimum: 0, example: 0.1 }
      responses:
        '201':
          description: Created watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingArbWatch'
        '400':
          $ref: '#/components/responses/Error'
    get:
      summary: List funding-arb follow watches
      operationId: listFundingArbWatches
      tags: [FundingArb]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Watch list
          content:
            application/json:
              schema:
                type: object
                properties:
                  watches:
                    type: array
                    items: { $ref: '#/components/schemas/FundingArbWatch' }
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/funding-arb/watches/{id}:
    get:
      summary: Get a funding-arb follow watch
      operationId: getFundingArbWatch
      tags: [FundingArb]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingArbWatch'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      summary: Update funding-arb follow settings
      description: Change minProfit, notional, holdHours, fees, or scan size. Does not delete signals.
      operationId: updateFundingArbWatch
      tags: [FundingArb]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string }
                minProfit: { type: number, exclusiveMinimum: 0 }
                notional: { type: number }
                holdHours: { type: number }
                durationHours:
                  type: number
                  description: Reset how long the follow should run from now. 0 clears the end time.
                quote: { type: string }
                limit: { type: integer }
                feeBinancePct: { type: number, minimum: 0 }
                feeBybitPct: { type: number, minimum: 0 }
      responses:
        '200':
          description: Updated watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingArbWatch'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete a funding-arb follow watch
      description: Removes the watch and its signals.
      operationId: deleteFundingArbWatch
      tags: [FundingArb]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/funding-arb/watches/{id}/pause:
    post:
      summary: Pause a funding-arb follow
      description: Stops evaluation without deleting the watch or its signals.
