  /api/v1/funding-arb/signals/{id}:
    get:
      summary: Get one funding-arb crossing with predicted-vs-settled review
      description: >
        Returns the stored expected schedule (the quote at open) and, when
        settlement clocks have passed, the actual funding prints versus that
        prediction. Pending clocks are marked pending. Informational only.
      operationId: getFundingArbSignal
      tags: [FundingArb]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Signal with optional review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingArbSignal'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/market/long-short-ratio:
    get:
      summary: Long/short account ratio and recent history
      description: |
        Share of **accounts** that are long vs short on **Binance USD-M**
        (`globalLongShortAccountRatio`) and **Bybit linear**
        (`/v5/market/account-ratio`). On Binance only, also returns
        `topAccounts` (top 20% of traders by margin, account count) and
        `topPositions` (same traders, position size). `gap` is one signed
        value: top long% minus crowd long% in percentage points
        (e.g. top 65% long vs crowd 55% → `+10`). `gapWindows` (1h/4h/24h)
        and `gapMoves` say if that spread widened, narrowed, or flipped.
        `divergence` is when top traders get more long while price falls
        (or more short while price rises), with `since` / `duration`.
        `split.opposite` means the crowd and bigger books lean different
        ways — hunt / squeeze / positioning then treat size as the
        positioned side. 5-minute samples. `ratio` is long/short (1 = even).
        `bias` is `long` if ratio ≥ 1.05, `short` if ≤ 0.95. Combined
        `exchange=all` does not average venues. `limit` default 24
        (~2 hours). Cached ~30s. Informational only.
      operationId: getMarketLongShortRatio
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all, example: all }
        - name: limit
          in: query
          description: History size (1–100, default 24)
          schema: { type: integer, default: 24, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Current long/short ratio and recent 5m history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLongShortRatio'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/futures-history:
    get:
      summary: Durable futures history
      description: |
        Stored open interest, funding, long/short, or liquidation rows for
        Binance USD-M and Bybit linear. Written on a background interval and
        (for liquidations) as events arrive. Duplicates are ignored. One venue
        failing does not drop the other. Survives process restarts.
      operationId: getMarketFuturesHistory
      tags: [Market]
      parameters:
        - name: metric
          in: query
          required: true
          schema: { type: string, enum: [open_interest, funding, long_short, liquidations] }
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          schema: { type: string, default: all }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 200, maximum: 1000 }
      responses:
        '200':
          description: Stored rows newest first
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/basis:
    get:
      summary: Futures vs spot basis (premium or discount)
      description: |
        How far the perpetual is from spot/index on Binance USD-M, Bybit linear, and OKX USDT-swap
        linear. Returns the dollar gap, percent gap, premium/discount, whether
        the gap is expanding or shrinking (5m/1h/4h), a short read with funding
        and open interest, and whether both venues agree. `curve` compares
        listed dated futures: near vs far expiry, contango (far richer / up)
        or backwardation (near richer / down). `curve.history` is that same
        near/far spread over the last hours and days from mark klines;
        `curve.windows` (1h/4h/24h/7d) say if it flipped, got steeper, or
        flattened; `curve.moves` lists those events.
      operationId: getMarketBasis
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all = all futures venues + agreement)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue basis plus optional agreement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBasis'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/correlation:
    get:
      summary: Price correlation vs BTC and ETH
      description: |
        How similarly a coin has been moving with **BTC** and **ETH** over the
        last **1 hour, 4 hours, and 24 hours**. Returns Pearson correlation of
        bar returns, beta, same-direction share, and a short note if the coin
        has been following with a delay. Default venue is Binance spot.
      operationId: getMarketCorrelation
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: SOLUSDT }
        - name: exchange
          in: query
          description: binance | bybit | coinbase (default binance)
          schema: { type: string, default: binance }
      responses:
        '200':
          description: Per-window correlation vs BTC and ETH
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/breadth:
    get:
      summary: Market breadth (how many coins are up or down)
      description: |
        Counts how many of the liquid spot coins we follow are **up** vs
        **down** over the last **1 hour, 4 hours, and 24 hours** (number and
        percent). Also says whether BTC and ETH are moving with the rest of
        the market or a few large coins are carrying it.
      operationId: getMarketBreadth
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          description: binance | bybit | coinbase (default binance)
          schema: { type: string, default: binance }
        - name: limit
          in: query
          description: How many liquid coins to include (default 80, max 150)
          schema: { type: integer, default: 80 }
      responses:
        '200':
          description: Per-window up/down counts plus BTC/ETH read
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/fear-greed:
    get:
      summary: Fear and greed index from our own tape
      description: |
        A **0–100** score for the crypto market, calculated here from data
        Swyngora already collects. It is **not** the Binance or CoinGlass index.

        Inputs, when present: 24h breadth (share of liquid coins that are up),
        BTC's 24h move, BTC 24h range versus its usual range (a wider range
        pulls toward fear), OI-weighted predicted funding, Binance account
        long/short, 24h long versus short liquidations, perp bid share within
        1% of mid, and aggressive taker buy share. Missing inputs are left out
        and the rest are reweighted. At least three inputs are required.

        **Levels:** 0–24 extreme fear, 25–44 fear, 45–55 neutral, 56–74 greed,
        75–100 extreme greed.

        `top` and `factors` say which input moved the score the most
        (`pull` is points away from a neutral 50). `history` and `windows`
        (1h / 4h / 24h / 7d) are scores stored while this process is running
        (about every 15 minutes).
      operationId: getFearGreed
      tags: [Market]
      responses:
        '200':
          description: Current score, the inputs that moved it, and stored past scores
          content:
            application/json:
              schema:
                type: object
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/volatility:
    get:
      summary: Price volatility vs recent history and BTC/ETH
      description: |
        How much a coin moved over the last **1 hour, 4 hours, and 24 hours**:
        net change, high–low range (even if price came back), whether that
        range is higher or lower than normal and expanding or shrinking, and
        whether the coin is more volatile or calmer than BTC and ETH.
      operationId: getMarketVolatility
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: SOLUSDT }
        - name: exchange
          in: query
          description: binance | bybit | coinbase (default binance)
          schema: { type: string, default: binance }
      responses:
        '200':
          description: Per-window volatility vs history and BTC/ETH
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/snapshot:
    get:
      summary: Combined tape snapshot (price, volume, OI, funding, LS, taker)
      description: |
        Current **price, volume, market cap, open interest, funding,
        long/short, and taker buy/sell** for one coin, plus how each changed
        over the last **1 hour, 4 hours, and 24 hours**. Useful when volume
        or OI start to build before price moves. `exchange=all` returns
        Binance and Bybit futures tapes separately (never averaged for the
        lead read).
      operationId: getMarketSnapshot
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: SOLUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Combined snapshot
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/levels:
    get:
      summary: Support and resistance areas
      description: |
        Finds **support** and **resistance** from recent price swings and
        volume, then checks the live order book for buy/sell liquidity around
        each area. Each zone includes distance from last price, how many times
        it was tested, and nearby bid/ask notional. When price is close to or
        through a zone, a **breakout score** uses volume, book thickness, and
        taker buy/sell.
      operationId: getMarketLevels
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | coinbase (default binance)
          schema: { type: string, default: binance }
      responses:
        '200':
          description: Support and resistance zones plus optional breakout
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/whales:
    get:
      summary: Large trades and liquidations
      description: |
        Clusters recent aggressive futures **buys** and **sells** and large
        **liquidations**, then sorts them biggest first. Open interest across
        the print marks a buy as opening longs or closing shorts (a sell is
        the mirror). `priceAfterPct` and `oiAfterPct` are the move 15 minutes
        later when those samples exist.
        Each event includes average price, first/last trade time, total size,
        and whether the notional is large versus circulating market cap
        (small-cap coins with huge prints are flagged). Omit `symbol` to scan
        the top liquid USDT pairs. Tape is the newest ~1000 prints per coin
        (minutes, not 24h). Informational only.
      operationId: getMarketWhales
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: false
          description: Pair e.g. BTCUSDT. Omit to scan top liquid USDT coins.
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all }
        - name: minNotional
          in: query
          description: Minimum USD size (default 100000, clamp 10000–10000000)
          schema: { type: number, default: 100000 }
        - name: limit
          in: query
          description: Max events (default 30, max 100)
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: Whale prints and liquidations, biggest first
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/volume-share:
    get:
      summary: Futures volume share by exchange
      description: |
        How perpetual **quote volume** splits across Binance USD-M, Bybit
        linear, and OKX USDT-swap. Example: Binance 55%, Bybit 30%, OKX 15%.
        Windows **15m / 1h / 4h** also compare to the same length just
        before (`changePct` in percentage points; `gained` / `lost`).
        Informational only.
      operationId: getMarketVolumeShare
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Venue mix and share change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketVolumeShare'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/participation:
    get:
      summary: OI delta versus futures volume
      description: |
        Share of futures **taker volume** that stuck as new (or closed)
        open interest: **OI USDT delta ÷ volume**. 2B volume with OI +300M
        is `ratio` 0.15 (`ratioPct` 15) — that share of volume is new
        positions; `transfer` is the rest. Windows are **15 minutes**,
        **1 hour**, and **4 hours**. Binance USD-M and Bybit linear
        separately plus `combined`. Informational only.
      operationId: getMarketParticipation
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both + combined)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue and optional combined participation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketParticipation'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/print-size/overview:
    get:
      summary: Whole-market average print size
      description: |
        Sums aggressive futures notional and fill counts across the most liquid
        USDT pairs, then divides. The market average is current versus the same
        length just before, so it shows whether prints got larger or smaller.
        A busier coin weighs more. `largerCoins` and `smallerCoins` are one vote
        per pair. Windows are 5m and 15m. Default universe is 20 pairs (5–30).
        Informational only.
      operationId: getMarketPrintSizeOverview
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all }
        - name: quote
          in: query
          schema: { type: string, default: USDT }
        - name: limit
          in: query
          description: How many liquid pairs (default 20, min 5, max 30)
          schema: { type: integer, default: 20, minimum: 5, maximum: 30 }
      responses:
        '200':
          description: Market average print size plus each coin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketPrintSizeOverview'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/print-size:
    get:
      summary: Average aggressive print size
      description: |
        Average **USDT notional per taker fill** on Binance USD-M, Bybit linear, and OKX USDT-swap
        linear, split buy vs sell. Windows are **5 minutes** and **15 minutes**,
        each compared to the same length just before. A jump from 20K to 180K
        means a few large market orders, not many small ones (`read=few_large`).
        `kind` is jumped / faded / stable. Bybit is the newest ~1000 public
        trades (minutes when busy). Informational only.
      operationId: getMarketPrintSize
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both + combined)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue and optional combined print size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketPrintSize'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/bot-tracker:
    get:
      summary: Repeated same-size market orders
      description: |
        Flags aggressive futures prints of about the **same USDT size**
        that hit **4 or more times inside any 60 seconds** during the last
        **5 minutes**. Buy and sell are counted apart. Sizes within about
        **0.2%** share a clip. Prints under **5,000 USDT** are ignored.
        `delta` is flagged buy prints minus flagged sell prints. Binance
        pages aggTrades; Bybit and OKX use the newest public trades. A
        repeated size is a pattern, not proof of a named bot. Informational only.
      operationId: getMarketBotTracker
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Repeated same-size bursts per venue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBotTracker'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/order-count/overview:
    get:
      summary: Whole-market order count ratio
      description: |
        Sums aggressive futures print counts across the most liquid USDT pairs,
        then divides. `ratio` is the same −1…+1 count ratio as one coin. A
        busier coin counts for more of that ratio. `buyCoins`, `sellCoins`,
        `balancedCoins`, and `quietCoins` are one vote per pair. Default
        universe is 20 pairs (5–30). `exchange=all` sums Binance, Bybit, and
        OKX per coin before the market sum. Informational only.
      operationId: getMarketOrderCountOverview
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all }
        - name: quote
          in: query
          schema: { type: string, default: USDT }
        - name: limit
          in: query
          description: How many liquid pairs (default 20, min 5, max 30)
          schema: { type: integer, default: 20, minimum: 5, maximum: 30 }
      responses:
        '200':
          description: Market print-count ratio plus each coin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOrderCountOverview'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/order-count:
    get:
      summary: Market order count ratio
      description: |
        Counts aggressive futures **prints**, not their USDT size, over
        **1m / 5m / 15m**. `ratio` is (buy count − sell count) / (buy count +
        sell count), from **−1** (all sells) to **+1** (all buys). `lean` is
        buy, sell, or balanced (inside ±0.10). Combined sums the counts, then
        divides. Binance pages aggTrades; Bybit and OKX use the newest public
        trades. Informational only.
      operationId: getMarketOrderCount
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Buy vs sell print counts and the −1…+1 ratio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOrderCount'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/taker-flow:
    get:
      summary: Futures taker buy vs sell volume
      description: |
        Aggressive (taker) buy and sell volume on Binance USD-M, Bybit linear, and OKX USDT-swap
        linear for the last **5 minutes, 1 hour, and 4 hours**. Returns buy
        notional, sell notional, delta, and a short read with price / OI /
        funding. This is who is hitting the book now — not the account
        long/short ratio. `exchange=all` adds a combined view.
      operationId: getMarketTakerFlow
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all = all futures venues + combined)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue and optional combined taker flow
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/net-position:
    get:
      summary: Net long and net short from open interest and taker flow
      description: |
        Estimates how much futures exposure **went long** and how much **went
        short** over the last **15 minutes, 1 hour, and 4 hours**.

        An aggressive buy is either a new long or a closed short. An aggressive
        sell is either a new short or a closed long. The open-interest change
        says whether positions were opened or closed. Together:

        `netLong = (taker buy − taker sell + open-interest change) / 2`

        `netShort = (taker sell − taker buy + open-interest change) / 2`

        Positive means that side grew. Negative means it shrank. The two
        numbers add up to the open-interest change. Binance USD-M and Bybit
        linear. This is not the account long/short ratio.
      operationId: getMarketNetPosition
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Net long and net short for 15m, 1h, and 4h
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/pressure:
    get:
      summary: Combined market pressure from book, CVD, and absorption
      description: |
        One **−1…+1** score for which side has more pressure when the
        resting order book, CVD, and absorption disagree. +1 is buy,
        −1 is sell. When the book looks bid-heavy but CVD is selling,
        absorption (bids taking that flow) is weighted more so the net
        is not a wash. `change1h` is this score minus the score ~1h ago.
        Components stay visible. Informational only.
      operationId: getMarketPressure
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Combined −1…+1 pressure and 1h change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketPressure' }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/cvd:
    get:
      summary: Cumulative volume delta versus price
      description: |
        **CVD** is the running sum of aggressive futures **market-buy**
        notional minus **market-sell** notional. Each 5-minute point includes
        price, `priceChangePct`, `vsPrice`, and `divergence`
        (`price_up_cvd_down` / `price_down_cvd_up`) so you can see when
        price and flow disagree. Divergence includes how long the split
        has been running and how far price and CVD moved. **15m / 1h /
        4h / 24h** windows show CVD change (not only the latest total)
        and label `confirms`, `opposite`, or `absorption`. **Anchors**
        reset the sum at a clock instead of a rolling lookback: `day`
        is 00:00 UTC, `4h` is the current 4-hour open (00/04/08/12/16/20
        UTC). Each anchor's `cvd` is buy minus sell since that time, with
        price change and the same confirms / opposite / absorption label.
        `complete` is false when stored bars start after the anchor.
        `exchange=all`
        (default) returns Binance and Bybit separately plus a combined
        series. Combined uses the overlapping **time range** (a missing
        5m slot is 0) and is `complete` when both venues are. Combined
        `venueSplit` flags Binance CVD up / Bybit down (or the reverse).
        `venues` / `combined` are futures; `spotVenues` / `spotCombined`
        are spot. `spotFutures` flags when spot CVD and futures CVD
        disagree. Informational only.
      operationId: getMarketCVD
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all = all futures venues + combined)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue and optional combined CVD vs price
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketCvdReport' }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/volume-surge:
    get:
      summary: Volume versus typical (5m / 15m / 1h)
      description: |
        How much **higher** this coin's quote volume is than **its own
        typical** (median of the prior ~24 hours) over **5 minutes**,
        **15 minutes**, and **1 hour**. Buy and sell are split when the
        venue publishes taker-buy (Binance klines; Bybit is total-only)
        so a spike can be one-sided. `ratio` is current / typical.
        `grade` is typical / elevated / high / extreme. Informational only.
      operationId: getMarketVolumeSurge
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue current vs typical volume
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/volume-surge/scan:
    get:
      summary: Coins with much more volume than typical
      description: |
        Scans top 24h-volume pairs and ranks those whose latest 5m / 15m
        / 1h volume is at least `minRatio` times their own typical
        (default 2x). Use this to see **which coins** are running hot.
        Default venue is Binance (buy/sell split). Informational only.
      operationId: scanMarketVolumeSurges
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          description: binance | bybit | all (default binance)
          schema: { type: string, default: binance }
        - name: quote
          in: query
          schema: { type: string, default: USDT }
        - name: minRatio
          in: query
          description: Minimum current/typical (default 2)
          schema: { type: number, default: 2 }
        - name: limit
          in: query
          description: How many top-volume coins to scan (default 30, max 50)
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: Ranked volume-surge hits
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidity-sweeps:
    get:
      summary: Liquidity sweeps (poke through a prior high or low)
      description: |
        A **liquidity sweep** is when price pokes a little **through a
        prior high or low** that had already turned it back, then comes
        back. Each sweep names the **level**, how far price went through
        (`excursion` / `excursionPct`), how long it stayed beyond
        (`duration`), and **quote volume** (buy/sell when the venue
        publishes taker-buy) during that poke. `tests` is how many times
        the level turned price before the sweep. `status` is `swept`
        (back) or `open` (still beyond). 15-minute spot candles, last
        ~7 days. A poke that stays through for more than 2 hours is a
        breakout, not a sweep. `exchange=all` (default) returns Binance
        and Bybit separately. Informational only.
      operationId: getMarketLiquiditySweeps
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue liquidity sweeps
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/recovery:
    get:
      summary: How long the book took to refill after a liquidity sweep
      description: |
        For each recent sweep that has come back, compares stored 1-minute
        spot ladders near the swept level. `beforeNotional` is the size on
        that side just before the poke. The clock starts at `reclaimedAt`
        and `recoverySeconds` is when that size is at least 80% restored.
        `recovered=false` means it was still thin two hours later. Empty
        until the desk has been sampling that pair. Informational only.
      operationId: getSweepRecovery
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Refill clock for recent sweeps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SweepRecoveryReport'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/absorption:
    get:
      summary: Absorption (large flow, little price)
      description: |
        Detects **absorption**: large aggressive **market buys or sells**
        while price barely moves — someone on the other side is taking
        the flow. Each 15m / 1h / 4h / 24h window (and each 5-minute bar)
        shows buy/sell notional, price change, which side is absorbing
        (`bid` = bids absorbing sells, `ask` = asks absorbing buys),
        `result` (`held` or `pushed` against the aggressive side), and a
        0–100 `score` / `grade`. `current` is the latest consecutive run.
        `exchange=all` (default) returns Binance and Bybit plus combined.
        `venues` / `combined` are futures; `spotVenues` / `spotCombined`
        are spot. Informational only.
      operationId: getMarketAbsorption
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all = all futures venues + combined)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue and optional combined absorption vs price
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/around:
    get:
      summary: What happened around a time (before / during / after)
      description: |
        Pick a coin and a time to see **what changed around that move**.
        Returns three adjacent windows: **before** (`window` ending at `at`),
        **during** (the move starting at `at`, default 15 minutes), and
        **after** (the same `window` after the move). Each phase has price
        (OHLC + %), quote volume, buy/sell when known, VWAP, volume versus
        that coin's own typical, and a compact volume-profile POC / value
        area. Liquidity sweeps that poked in the span are attached.
        Stored order-book and futures history (OI, funding, long/short,
        liquidations) are included when those archives have a sample.
        BTC/ETH listed options (OI, put/call, implied vol, unusual prints)
        attach when the options archive has samples. Options `lead` is the
        real start inside a 1h/4h/24h unusual lookback, not the window open.
        `exchange=all` (default) returns Binance and Bybit separately plus
        `combined`. `venueTiming` says which venue printed first, whether the
        other followed or the move stayed on one venue, and whether OI or
        taker flow had already changed before the laggard's real start (not
        the during-window close). The first signal across price, OI, and
        takers is the leader only if that OI or taker print kept going until
        price. If the last OI sample or taker bar is much earlier than the
        price start, the path is omitted (not continued / faded / reversed).
        The taker bar at the price start is not pre-price tape.
        Continued / faded / reversed also need a continuous pre-price
        taker path at the tape's bar size (no hole longer than one missing
        1m or 5m bar, and tape after the start print).
        Informational only.
      operationId: getMarketAround
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: at
          in: query
          required: true
          description: Event time (RFC3339 or unix ms) — start of the during window
          schema: { type: string, example: "2026-08-20T14:00:00Z" }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all = all futures venues + combined)
          schema: { type: string, default: all }
        - name: window
          in: query
          description: Before/after lookback — 15m | 30m | 1h | 2h | 4h (default 1h)
          schema: { type: string, default: "1h" }
        - name: during
          in: query
          description: Move window starting at `at` — 5m | 15m | 30m | 1h (default 15m)
          schema: { type: string, default: "15m" }
      responses:
        '200':
          description: Before / during / after tape
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/around/compare:
    get:
      summary: Compare two times (two moves of the same coin)
      description: |
        Pick a coin and **two event times** to see how those moves
        differed. Each time is an around-the-move tape (before / during /
        after). The response includes both tapes plus deltas for **price
        level**, the **move** (net %, range, volume, vs typical, takers,
        POC), **order-book** mid and liquidity, and **futures** (OI,
        funding, long %, liquidations) when those archives have samples.
        `from` and `to` are the two event times (RFC3339 or unix ms);
        they do not have to be in chronological order. Same `window` /
        `during` as `/around`. Informational only.
      operationId: compareMarketAround
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: from
          in: query
          required: true
          description: First event time (RFC3339 or unix ms)
          schema: { type: string, example: "2026-08-20T12:00:00Z" }
        - name: to
          in: query
          required: true
          description: Second event time (RFC3339 or unix ms)
          schema: { type: string, example: "2026-08-20T16:00:00Z" }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all = all futures venues + combined)
          schema: { type: string, default: all }
        - name: window
          in: query
          description: Before/after lookback — 15m | 30m | 1h | 2h | 4h (default 1h)
          schema: { type: string, default: "1h" }
        - name: during
          in: query
          description: Move window starting at each time — 5m | 15m | 30m | 1h (default 15m)
          schema: { type: string, default: "15m" }
      responses:
        '200':
          description: Two-move comparison
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/around/moves:
    get:
      summary: Important moves and what happened during them
      description: |
        Finds the strongest **up and down legs** in a coin's recent
        history, then attaches the around-the-move tape (price, volume,
        VWAP, vs typical, POC, sweeps, stored book/futures) for each one.
        Legs are same-direction stretches of 15m or 1h candles, ranked
        by |return|. Default lookback **24h**, default floor **1.5%**
        (15m) or **2.5%** (1h). `direction` is `up`, `down`, or `both`.
        Informational only.
      operationId: findMarketAroundMoves
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all }
        - name: lookback
          in: query
          description: 4h | 12h | 24h | 3d | 7d (default 24h)
          schema: { type: string, default: "24h" }
        - name: interval
          in: query
          description: 15m | 1h (default 15m)
          schema: { type: string, default: "15m" }
        - name: direction
          in: query
          description: up | down | both (default both)
          schema: { type: string, default: both }
        - name: minReturnPct
          in: query
          description: Minimum |return| percent (default 1.5 on 15m, 2.5 on 1h)
          schema: { type: number }
        - name: limit
          in: query
          description: How many moves to keep (default 8, max 15)
          schema: { type: integer, default: 8 }
        - name: window
          in: query
          description: Around lookback 15m | 30m | 1h | 2h | 4h (default 1h)
          schema: { type: string, default: "1h" }
        - name: during
          in: query
          description: Override move window 5m | 15m | 30m | 1h (default from the leg)
          schema: { type: string }
      responses:
        '200':
          description: Ranked important moves with around-the-move tapes
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/around/precursors:
    get:
      summary: Common tape before important moves
      description: |
        Scans historical candles for strong **up and down** legs, then
        compares the market tape in the window **before** each move
        (volume vs typical, takers, price, OI, book, sweeps). Returns
        singles and **combos** — conditions that fired **together** in
        the same before-window. Combos report how often they showed up
        before increases vs drops (`lean`). `common` is the **overall**
        hit rate (not one side only) — at least **60%** of all sampled
        before-windows with **3+** samples. Default lookback **7d**.
        Informational only.
      operationId: findMarketAroundPrecursors
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all }
        - name: lookback
          in: query
          description: 4h | 12h | 24h | 3d | 7d (default 7d)
          schema: { type: string, default: "7d" }
        - name: interval
          in: query
          description: 15m | 1h (default 15m)
          schema: { type: string, default: "15m" }
        - name: direction
          in: query
          description: up | down | both (default both)
          schema: { type: string, default: both }
        - name: minReturnPct
          in: query
          description: Minimum |return| percent (default 1.5 on 15m)
          schema: { type: number }
        - name: limit
          in: query
          description: How many moves to scan (default 15)
          schema: { type: integer, default: 15 }
        - name: window
          in: query
          description: Before-window length 15m | 30m | 1h | 2h | 4h (default 1h)
          schema: { type: string, default: "1h" }
        - name: during
          in: query
