                granteeClientId: { type: string }
                role: { type: string, enum: [viewer, editor] }
      responses:
        '201':
          description: Share created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistShare'
        '400':
          $ref: '#/components/responses/Error'
    patch:
      summary: Update share role (owner only)
      operationId: updateWatchlistShare
      tags: [Watchlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granteeClientId, role]
              properties:
                clientId: { type: string }
                granteeClientId: { type: string }
                role: { type: string, enum: [viewer, editor] }
      responses:
        '200':
          description: Updated share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistShare'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      summary: Revoke share access (owner only)
      operationId: revokeWatchlistShare
      tags: [Watchlist]
      parameters:
        - name: granteeClientId
          in: query
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
                  granteeClientId: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/watchlist/shared:
    get:
      summary: List watchlists shared with the caller
      operationId: listSharedWatchlists
      tags: [Watchlist]
      parameters:
        - name: clientId
          in: query
          schema: { type: string, minLength: 1 }
        - name: X-Client-Id
          in: header
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Incoming shares
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId: { type: string }
                  count: { type: integer }
                  shares:
                    type: array
                    items:
                      $ref: '#/components/schemas/WatchlistShare'
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/watchlist/audit:
    get:
      summary: List watchlist change history (owner only)
      description: |
        Returns audit events (share grant/update/revoke, item add/remove, list replace)
        with actorClientId and createdAt.
      operationId: listWatchlistAudit
      tags: [Watchlist]
      parameters:
        - name: clientId
          in: query
          schema: { type: string, minLength: 1 }
        - name: X-Client-Id
          in: header
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
