                      $ref: '#/components/schemas/WatchlistShare'
        '400':
          $ref: '#/components/responses/Error'
    post:
      summary: Share watchlist with another client (owner only)
      description: |
        Grants viewer (read-only) or editor (add/remove symbols only) access.
        Cannot share with self. Same grantee cannot be shared twice (use PATCH to change role).
        Editors cannot delete the list or change sharing settings.
      operationId: shareWatchlist
      tags: [Watchlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granteeClientId, role]
              properties:
                clientId: { type: string, description: Owner client id }
                granteeClientId: { type: string }
                role: { type: string, enum: [viewer, editor] }
      responses:
        '201':
          description: Share created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistShare'
        '400':
          $ref: '#/components/responses/Error'
    patch:
      summary: Update share role (owner only)
      operationId: updateWatchlistShare
      tags: [Watchlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granteeClientId, role]
              properties:
                clientId: { type: string }
                granteeClientId: { type: string }
                role: { type: string, enum: [viewer, editor] }
      responses:
        '200':
          description: Updated share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistShare'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      summary: Revoke share access (owner only)
      operationId: revokeWatchlistShare
      tags: [Watchlist]
      parameters:
        - name: granteeClientId
          in: query
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
                  granteeClientId: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/watchlist/shared:
    get:
      summary: List watchlists shared with the caller
