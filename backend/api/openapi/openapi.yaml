  /api/v1/portfolio:
    post:
      summary: Create a paper-trading portfolio
      description: |
        Creates a named simulated portfolio with starting cash. A clientId may own up to 20 books
        (e.g. Main vs Risky). Duplicate names are rejected. Paper trading only - not real money.
      operationId: createPortfolio
      tags: [Portfolio]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
