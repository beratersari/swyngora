  /api/v1/portfolio/lots:
    get:
      summary: List paper tax lots
      description: |
        Each buy opens a lot (quantity, unit price, time). Sells consume lots FIFO or LIFO
        and shrink remaining quantity on the same lot. status=open (default), closed, or all.
