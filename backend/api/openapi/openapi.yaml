  /api/v1/portfolio:
    post:
      summary: Create a paper-trading portfolio
      description: |
        Creates a named simulated portfolio with starting cash. A clientId may own up to 20 books
        (e.g. Main vs Risky). Duplicate names are rejected. Paper trading only - not real money.
      operationId: createPortfolio
      tags: [Portfolio]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startingBalance]
              properties:
                clientId: { type: string }
                name: { type: string, maxLength: 64, example: Main, description: Display name; default Main }
                startingBalance: { type: number, exclusiveMinimum: 0, example: 10000 }
                currency: { type: string, default: USDT }
      responses:
        '201':
          description: Created portfolio snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioView'
        '400':
          $ref: '#/components/responses/Error'
    get:
      summary: Get paper portfolio snapshot
      description: |
        Cash, open positions (mark-to-market), realized and unrealized P&L.
        When the client has more than one book, pass portfolioId (or X-Portfolio-Id).
      operationId: getPortfolio
      tags: [Portfolio]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
        - name: portfolioId
          in: query
          description: Book id or name. Required when more than one paper portfolio exists.
          schema: { type: string }
        - name: X-Portfolio-Id
          in: header
          schema: { type: string }
        - name: ownerClientId
          in: query
          description: Book owner's clientId when viewing a shared portfolio
          schema: { type: string }
      responses:
        '200':
          description: Portfolio view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioView'
        '404':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/portfolios:
