        sellExhausted: { type: boolean }
        profitable: { type: boolean }
        executable:
          type: boolean
          description: Full requested size filled on both books and profit after fees > 0
        meetsMinNet: { type: boolean }
        minNetDiffPct: { type: number }
        live: { type: boolean }
        buyLive: { type: boolean }
        sellLive: { type: boolean }
        asOf: { type: string, format: date-time }
        visibleBuyQuantity: { type: string }
        visibleBuyNotional: { type: string }
        visibleSellQuantity: { type: string }
        visibleSellNotional: { type: string }
        maxQuantity:
          type: string
          description: Largest size where every increment still adds after-fee profit
        maxNotional: { type: string, description: Buy-book spend at maxQuantity }
        maxAverageBuyPrice: { type: string }
        maxAverageSellPrice: { type: string }
        maxProfitAfterFees: { type: string }
        maxProfitPct: { type: number }
        maxLimitedBy:
          type: string
          enum: [profit, buy_book, sell_book, both_books, empty_book]
        usedNotional:
          type: string
          description: Buy-book spend that still leaves the whole trade profitable
        unusedNotional:
          type: string
          description: Requested notional minus usedNotional
        usedQuantity: { type: string }
        unusedQuantity: { type: string }
        usedPct:
          type: number
          description: Percent of the entered size that can really be used
        note: { type: string }
    PriceDiffQuoteScan:
      type: object
      properties:
        symbol: { type: string }
        requestedNotional: { type: string }
        requestedQuantity: { type: string }
        bestRoute:
          $ref: '#/components/schemas/PriceDiffQuote'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/PriceDiffQuote'
        minProfitPct: { type: number }
        minProfitAmount: { type: number }
        profitableCount: { type: integer }
        skippedCount: { type: integer, description: Routes hidden because they missed the profit floor }
        venueCount: { type: integer }
        loadedVenueCount: { type: integer }
        unavailable:
          type: array
          description: Venues or routes whose order books could not be loaded (never ranked as best)
          items:
            type: object
            properties:
              exchange: { type: string }
              buyExchange: { type: string }
              sellExchange: { type: string }
              reason: { type: string, enum: [order_book_unavailable, no_asks, no_bids] }
              message: { type: string }
        note: { type: string }
    Watchlist:
      type: object
      properties:
        clientId: { type: string, description: List owner id (same as ownerClientId) }
        ownerClientId: { type: string, description: List owner }
        role:
          type: string
          enum: [owner, viewer, editor]
          description: Caller's access role on this list
        version:
          type: integer
          format: int64
          description: Monotonic revision for multi-device optimistic concurrency (starts at 0)
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              exchange: { type: string }
              symbol: { type: string }
              note: { type: string }
              addedAt: { type: string, format: date-time }
    WatchlistSyncConflict:
      type: object
      description: Returned in 409 responses when a write cannot be auto-merged
      properties:
        baseVersion: { type: integer, format: int64 }
        serverVersion: { type: integer, format: int64 }
        server:
          $ref: '#/components/schemas/Watchlist'
        clientProposed:
          type: array
          items:
            type: object
            properties:
              exchange: { type: string }
              symbol: { type: string }
              note: { type: string }
        autoMerged:
          type: array
          description: Non-conflicting merge preview
          items:
            type: object
            properties:
              exchange: { type: string }
              symbol: { type: string }
              note: { type: string }
        conflicts:
          type: array
          items:
            type: object
            properties:
              exchange: { type: string }
              symbol: { type: string }
              type:
                type: string
                enum: [update_vs_update, delete_vs_update, update_vs_delete]
              serverItem:
                type: object
                nullable: true
              clientItem:
                type: object
                nullable: true
    WatchlistShare:
      type: object
      properties:
        ownerClientId: { type: string }
        granteeClientId: { type: string }
        role: { type: string, enum: [viewer, editor] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WatchlistAuditEvent:
      type: object
      properties:
        id: { type: string }
        ownerClientId: { type: string }
        actorClientId: { type: string }
        action:
          type: string
          enum: [share_granted, share_updated, share_revoked, item_added, item_removed, list_replaced]
        exchange: { type: string }
        symbol: { type: string }
        detail: { type: string }
        createdAt: { type: string, format: date-time }
    ExportJob:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        format: { type: string, enum: [json, csv] }
        sections:
          type: array
          items: { type: string, enum: [watchlist, shares, alerts, backtests, portfolios] }
        status: { type: string, enum: [pending, running, completed, canceled, failed] }
        progressPct: { type: number, description: 0–100 }
        stage: { type: string }
        errorMessage: { type: string }
        fileName: { type: string }
        byteSize: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        downloadUrl: { type: string, description: Relative path when status=completed }
    ImportSectionCounts:
      type: object
      properties:
        valid: { type: integer }
        invalid: { type: integer }
        willAdd: { type: integer }
        duplicates: { type: integer }
    Account:
      type: object
      properties:
        clientId: { type: string }
        status: { type: string, enum: [active, closed, purged] }
        closedAt: { type: string, format: date-time }
        purgeAt: { type: string, format: date-time }
        reopenedAt: { type: string, format: date-time }
        canReopen: { type: boolean }
        graceDays: { type: integer, example: 7 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AccountAPIKey:
      type: object
      description: Named user API key metadata (secret is never listed)
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: Public prefix of the secret (e.g. swy_ab12cd34) }
        permission: { type: string, enum: [read, trade] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        revoked: { type: boolean }
    AccountAPIKeyCreated:
      allOf:
        - $ref: '#/components/schemas/AccountAPIKey'
        - type: object
          properties:
            secret:
              type: string
              description: Full token; shown only at creation. Send as Authorization Bearer or X-API-Key.
    ImportJob:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        format: { type: string, enum: [json, csv] }
        mode: { type: string, enum: [merge, replace] }
        status:
          type: string
          enum: [previewed, pending, running, completed, canceled, failed]
        progressPct: { type: number }
        stage: { type: string }
        errorMessage: { type: string }
        sections:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ImportSectionCounts'
        totals:
          $ref: '#/components/schemas/ImportSectionCounts'
        added:
          type: object
          additionalProperties: { type: integer }
          description: Records actually inserted after completed apply
        fileName: { type: string }
        byteSize: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    PumpEvent:
      type: object
      description: Single mechanical pump/dump window on a candle series
      properties:
        index: { type: integer }
        openTime: { type: string, format: date-time }
        closeTime: { type: string, format: date-time }
        startPrice: { type: number }
        endPrice: { type: number }
        returnPct: { type: number }
        high: { type: number }
        low: { type: number }
        volume: { type: number }
        volumeRatio: { type: number }
        mode: { type: string }
        windowBars: { type: integer }
    PumpEventsResponse:
      type: object
      properties:
        symbol: { type: string }
        exchange: { type: string }
        interval: { type: string }
        lookbackHours: { type: number }
        barsAnalyzed: { type: integer }
        minReturnPct: { type: number }
        windowBars: { type: integer }
        mode: { type: string }
        direction: { type: string }
        eventCount: { type: integer }
        events:
          type: array
          items:
            $ref: '#/components/schemas/PumpEvent'
        note: { type: string }
    PumpScanHit:
      type: object
      properties:
        symbol: { type: string }
        exchange: { type: string }
        interval: { type: string }
        bestReturnPct: { type: number }
        bestVolumeRatio: { type: number }
        bestOpenTime: { type: string, format: date-time }
        events:
          type: array
          items:
            $ref: '#/components/schemas/PumpEvent'
    PumpScanResponse:
      type: object
      properties:
        exchange: { type: string }
        quote: { type: string }
        interval: { type: string }
        lookbackHours: { type: number }
        minReturnPct: { type: number }
        windowBars: { type: integer }
        mode: { type: string }
        direction: { type: string }
        symbolLimit: { type: integer }
        maxTotalEvents: { type: integer }
        hitCount: { type: integer }
        eventCount: { type: integer }
        hits:
          type: array
          items:
            $ref: '#/components/schemas/PumpScanHit'
        note: { type: string }

    FxRates:
      type: object
      properties:
        base:
          type: string
          example: USD
        asOf:
          type: string
          format: date-time
        rates:
          type: object
          additionalProperties:
            type: number
          description: Units of each currency per 1 USD (USDT=1)
          example: { USD: 1, USDT: 1, TRY: 40.5, EUR: 0.92 }
        stale:
          type: boolean
        venueQuotes:
          type: object
          additionalProperties: { type: string }
          description: Native quote of last/open/high/low/quoteVolume per venue
        marketCapQuotes:
          type: object
          additionalProperties: { type: string }
          description: Currency of market-cap fields per venue
        aliases:
          type: object
          additionalProperties: { type: string }
          description: Stablecoin aliases for display FX (USDT→USD)
        note:
          type: string

    RSIHeatmapRow:
      type: object
      properties:
        rank: { type: integer }
        symbol: { type: string, example: BTCUSDT }
        base: { type: string, example: BTC }
        lastPrice: { type: string }
        priceChangePercent: { type: string }
        quoteVolume: { type: string }
        marketCapCirculating: { type: number, nullable: true }
        rsi: { type: number, nullable: true }
        zone: { type: string, enum: [oversold, neutral, overbought] }
        error: { type: string }
    RSIHeatmap:
      type: object
      properties:
        exchange: { type: string }
        quote: { type: string }
        interval: { type: string }
        period: { type: integer }
        oversold: { type: number }
        overbought: { type: number }
        sort: { type: string }
        averageRsi: { type: number, nullable: true }
        oversoldCount: { type: integer }
        neutralCount: { type: integer }
        overboughtCount: { type: integer }
        asOf: { type: string, format: date-time }
        stale: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/RSIHeatmapRow' }
        note: { type: string }
    SpotMarket:
      type: object
      properties:
        symbol:
          type: string
        lastPrice:
          type: string
        priceChange:
          type: string
        priceChangePercent:
          type: string
        highPrice:
          type: string
        lowPrice:
          type: string
        volume:
          type: string
        quoteVolume:
          type: string
        tradeCount:
          type: integer
          format: int64
        tags:
          type: array
          items:
            type: string
          description: Binance product-catalog tags for the base asset
          example: ["Layer1_Layer2", "pos"]
        circulatingSupply:
          type: number
          nullable: true
        totalSupply:
          type: number
          nullable: true
        maxSupply:
          type: number
          nullable: true
        marketCapCirculating:
          type: number
          nullable: true
          description: USD price times circulating supply
        marketCapTotal:
          type: number
          nullable: true
          description: USD price times total supply
        marketCapMax:
          description: USD price times max supply, or infinity when max supply is undefined
          nullable: true
          oneOf:
            - type: number
            - type: string
              enum: ["\u221E"]
        delistTime:
          type: string
          format: date-time
          nullable: true
          description: Scheduled spot delist time (UTC) when known
        announcedAt:
          type: string
          format: date-time
          nullable: true
          description: When the venue published the delist announcement (UTC)

    DelistScheduleResponse:
      type: object
      properties:
        exchange: { type: string }
        enabled:
          type: boolean
          description: False when this venue has no delist feed (Binance needs BINANCE_API_KEY; Bybit is always on)
        items:
          type: array
          items:
            $ref: '#/components/schemas/DelistScheduleItem'
    DelistScheduleItem:
      type: object
      properties:
        symbol: { type: string }
        delistTime: { type: string, format: date-time }
        announcedAt:
          type: string
          format: date-time
          description: When the venue published the delist announcement (UTC)
    PostDelistResponse:
      type: object
      properties:
        exchange: { type: string }
        symbol: { type: string }
        base: { type: string }
        delistTime:
          type: string
          format: date-time
        available:
          type: boolean
          description: True when an off-venue last price was found
        source:
          type: string
          description: Provider id (coingecko, bybit, coinbase, binance)
        sourceLabel:
          type: string
          description: Human label for the source
        note:
          type: string
          description: Why this is not the home venue tape
        lastPrice: { type: string }
        priceChangePercent: { type: string }
        quote:
          type: string
          description: Quote asset of lastPrice (USD or USDT)
        asOf:
          type: string
          format: date-time
        interval: { type: string }
        candles:
          type: array
          items:
            $ref: '#/components/schemas/Candle'
