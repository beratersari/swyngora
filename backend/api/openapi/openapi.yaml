    post:
      summary: Start a historical scanner backtest
      description: |
        Runs a rule over a symbol and date range in the background. Identical jobs
        (same client, rule, symbol, range) return the existing pending/running/completed job.
        Progress and signalCount update while running. Informational only.
      operationId: startScannerBacktest
