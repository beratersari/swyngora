        sellExchange: { type: string, enum: [binance, coinbase, bybit, nasdaq, bist] }
        buyPrice: { type: number }
        sellPrice: { type: number }
        grossDiffPct: { type: number }
        netDiffPct: { type: number, description: Latest after-fee edge percent }
        minNetDiffPct: { type: number }
        status: { type: string, enum: [open, closed] }
        openedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        openNetDiffPct: { type: number, description: After-fee edge when the opportunity opened }
        openProfit: { type: number }
        peakNetDiffPct: { type: number, description: Highest after-fee edge while open }
        peakProfit: { type: number }
        peakAt: { type: string, format: date-time }
        fadeStartedAt: { type: string, format: date-time, description: First sample at least 0.01% below the peak }
        closeReason:
