        meetsMinNet: { type: boolean }
        minNetDiffPct: { type: number }
        live: { type: boolean }
        buyLive: { type: boolean }
        sellLive: { type: boolean }
        asOf: { type: string, format: date-time }
        visibleBuyQuantity: { type: string }
        visibleBuyNotional: { type: string }
        visibleSellQuantity: { type: string }
        visibleSellNotional: { type: string }
        maxQuantity:
          type: string
          description: Largest size where every increment still adds after-fee profit
        maxNotional: { type: string, description: Buy-book spend at maxQuantity }
        maxAverageBuyPrice: { type: string }
        maxAverageSellPrice: { type: string }
        maxProfitAfterFees: { type: string }
        maxProfitPct: { type: number }
        maxLimitedBy:
          type: string
          enum: [profit, buy_book, sell_book, both_books, empty_book]
        usedNotional:
