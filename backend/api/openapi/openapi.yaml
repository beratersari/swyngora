        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Active watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingArbWatch'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/funding-arb/signals:
    get:
      summary: List funding-arb min-profit crossings
      operationId: listFundingArbSignals
      tags: [FundingArb]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
