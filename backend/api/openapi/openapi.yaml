    get:
      summary: Get a price difference opportunity
      description: |
        Returns the opportunity plus a review of what happened after it opened
        (duration, peak edge, when it started fading, why it closed) and the
        sampled book-walk path (`ticks`). Informational only.
      operationId: getPriceDiffOpportunity
      tags: [PriceDiff]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Opportunity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceDiffOpportunity'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/price-diff/opportunities/{id}/quote:
    get:
      summary: Quote an executable size for a stored opportunity
      description: |
        Walks the live buy-venue asks and sell-venue bids for a size using the
        watch fees. Returns average fill prices, slippage versus top of book,
        profit after fees, and the largest size that still has a positive
        after-fee edge. `notional` is quote currency spent on the buy book
        before the buy fee (e.g. 10000 USDT). Provide `notional` or `quantity`,
        not both. Simulated depth walk — not a fill or financial advice.
      operationId: quotePriceDiffOpportunity
      tags: [PriceDiff]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
        - name: notional
          in: query
          schema: { type: number, exclusiveMinimum: 0 }
          description: Quote currency to spend on the buy book before the buy fee
        - name: quantity
          in: query
          schema: { type: number, exclusiveMinimum: 0 }
          description: Base size to buy and sell (use instead of notional)
      responses:
        '200':
          description: Executable quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceDiffQuote'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/price-diff/quote/scan:
    get:
      summary: Compare every venue pair at one size
      description: |
        Walks live Binance, Coinbase, and Bybit books for every buy/sell route
        at the same notional or quantity. Includes fees, visible depth, after-fee
        profit, and how much of the entered money can actually be used.
        Ranked by profit after fees. Informational only.
      operationId: scanPriceDiffQuotes
      tags: [PriceDiff]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: notional
          in: query
          schema: { type: number, exclusiveMinimum: 0, example: 10000 }
        - name: quantity
          in: query
          schema: { type: number, exclusiveMinimum: 0 }
        - name: feeBinancePct
          in: query
          schema: { type: number, minimum: 0, example: 0.1 }
        - name: feeCoinbasePct
          in: query
          schema: { type: number, minimum: 0, example: 0.6 }
        - name: feeBybitPct
          in: query
          schema: { type: number, minimum: 0, example: 0.1 }
        - name: minNetDiffPct
          in: query
          schema: { type: number, minimum: 0 }
        - name: minProfitPct
          in: query
          schema: { type: number, minimum: 0, example: 0.5 }
          description: Only include routes whose after-fee profit percent is at least this
        - name: minProfitAmount
          in: query
          schema: { type: number, minimum: 0, example: 10 }
          description: Only include routes whose after-fee profit (quote currency) is at least this
      responses:
        '200':
          description: Ranked routes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceDiffQuoteScan'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/price-diff/quote:
    get:
      summary: Quote a buy-on-A / sell-on-B size from live books
      description: |
        Same walk as the opportunity quote, without a stored opportunity.
        Provide `notional` or `quantity`, not both. Informational only.
      operationId: quotePriceDiff
      tags: [PriceDiff]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: buyExchange
          in: query
          required: true
          schema: { type: string, enum: [binance, coinbase, bybit] }
        - name: sellExchange
          in: query
          required: true
          schema: { type: string, enum: [binance, coinbase, bybit] }
        - name: notional
          in: query
          schema: { type: number, exclusiveMinimum: 0, example: 10000 }
        - name: quantity
          in: query
          schema: { type: number, exclusiveMinimum: 0 }
        - name: feeBuyPct
          in: query
          schema: { type: number, minimum: 0, example: 0.1 }
        - name: feeSellPct
          in: query
          schema: { type: number, minimum: 0, example: 0.1 }
        - name: minNetDiffPct
          in: query
          schema: { type: number, minimum: 0 }
          description: Optional threshold used only to set meetsMinNet
      responses:
        '200':
          description: Executable quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceDiffQuote'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/scanner/rules:
    post:
      summary: Create a technical scanner rule
      description: |
        Creates a rule evaluated against the client's watchlist symbols.
        Send `conditions` as one or more of rsi, ma_crossover, volume_increase
        and `matchMode` `all` (every selected condition) or `any` (one is enough).
        Legacy `type` of a single condition still works. Informational only.
      operationId: createScannerRule
      tags: [Scanner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string }
                type: { type: string, enum: [rsi, ma_crossover, volume_increase, combo] }
                conditions:
                  type: array
                  items: { type: string, enum: [rsi, ma_crossover, volume_increase] }
                  description: Selected conditions. If omitted, `type` is used as the single condition.
                matchMode:
                  type: string
                  enum: [all, any]
                  default: all
                  description: all = every selected condition; any = one is enough
                interval: { type: string, default: 1h }
                rsiPeriod: { type: integer, default: 14 }
                rsiCondition: { type: string, enum: [above, below] }
                rsiThreshold: { type: number }
                maFastPeriod: { type: integer, default: 12 }
                maSlowPeriod: { type: integer, default: 26 }
                maDirection: { type: string, enum: [golden_cross, death_cross] }
                volumeLookback: { type: integer, default: 20 }
                volumeMinRatio: { type: number, default: 2 }
      responses:
        '201':
          description: Created rule
        '400':
          $ref: '#/components/responses/Error'
    get:
      summary: List scanner rules
      operationId: listScannerRules
      tags: [Scanner]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Rule list
  /api/v1/scanner/rules/{id}:
    get:
      summary: Get a scanner rule
      operationId: getScannerRule
      tags: [Scanner]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Rule
        '404':
          $ref: '#/components/responses/Error'
    patch:
      summary: Update a scanner rule
      description: |
        Enable or disable a rule without deleting it, or edit interval,
        conditions, matchMode, and indicator settings (periods, thresholds).
        Omitted fields stay unchanged.
      operationId: updateScannerRule
      tags: [Scanner]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string }
                enabled: { type: boolean }
                interval: { type: string }
                conditions:
                  type: array
                  items: { type: string, enum: [rsi, ma_crossover, volume_increase] }
                matchMode: { type: string, enum: [all, any] }
                rsiPeriod: { type: integer }
                rsiCondition: { type: string, enum: [above, below] }
                rsiThreshold: { type: number }
                maFastPeriod: { type: integer }
                maSlowPeriod: { type: integer }
                maDirection: { type: string, enum: [golden_cross, death_cross] }
                volumeLookback: { type: integer }
                volumeMinRatio: { type: number }
      responses:
        '200':
          description: Updated rule
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete a scanner rule
      operationId: deleteScannerRule
      tags: [Scanner]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/scanner/results:
    get:
      summary: List scanner match history
      description: |
        Saved matches for watchlist symbols. A row is written when the rule becomes
        true (previous bar false). A condition that stays true on later bars does not
        add another row. Also unique on ruleId + exchange + symbol + marketDataKey.
      operationId: listScannerResults
      tags: [Scanner]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Result list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScannerResultList'
  /api/v1/scanner/backtests:
    post:
      summary: Start a historical scanner or custom-signal backtest
      description: |
        Runs a scanner rule or a custom signal profile over a date range
        in the background. Send `ruleId` or `profileId` (not both). `profileId=built_in`
        uses the built-in swing mix. The source is snapshotted at queue time; later
        edits do not change this job. Custom-mix jobs replay 4h swing factors only —
        hunt and tape add 0. A signal fires when the mix first crosses 62 (onset).
        `scope=watchlist` (or `symbol=watchlist`) with `profileId` replays every
        coin on the client's watchlist in one job; the list is snapshotted when queued.
        Identical jobs return the existing pending/running/completed job.
        Each hit stores side, leverage, entry, TP1, TP2, and SL. Lab can close part
        of the fill at TP1 and leave a runner for TP2; after TP1 the stop can stay
        or move to entry. Progress and signalCount update while running. Informational only.
      operationId: startScannerBacktest
      tags: [Scanner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rangeStart, rangeEnd]
              properties:
                clientId: { type: string }
                ruleId: { type: string, description: Scanner rule id (omit when profileId is set) }
                profileId: { type: string, description: Custom signal profile id, or built_in }
                exchange: { type: string, enum: [binance, coinbase, bybit, nasdaq, bist], default: binance }
                symbol: { type: string, description: Pair for a one-coin job. Use watchlist or omit when scope is watchlist }
                scope: { type: string, enum: [symbol, watchlist], description: watchlist runs a custom mix on every watchlist coin }
                startingBalance: { type: number, description: Shared cash pot for a watchlist job (default 10000) }
                riskPct: { type: number, description: Share of current equity lost on a full stop (default 1). Size follows the stop distance and the live pot }
                maxOpenRiskPct: { type: number, description: Max combined stop risk of open fills (default 3). A new signal is skipped until a fill closes }
                useTp2: { type: boolean, description: Close part of the fill at TP1 and leave the rest for TP2 }
                tp1ClosePct: { type: number, description: Share of the position closed at TP1 when useTp2 is true (default 50) }
                stopAfterTp1: { type: string, enum: [keep, entry, trail], description: After TP1, keep the original stop, move it to the fill, or trail it with price (default entry) }
                feePct: { type: number, description: Taker fee percent on each fill including TP1 slices (0.10 = 0.10%). Default 0 }
                slipPct: { type: number, description: Adverse slippage percent used only when that minute has no stored order book (0.05 = 0.05%). When a ladder exists, the fill walks that size instead. Default 0 }
                rangeStart: { type: string, format: date-time }
                rangeEnd: { type: string, format: date-time }
      responses:
        '202':
          description: Job accepted or existing job returned
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      summary: List scanner backtests
      operationId: listScannerBacktests
      tags: [Scanner]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Backtest list
  /api/v1/scanner/backtests/{id}:
    get:
      summary: Get scanner backtest progress and summary
      operationId: getScannerBacktest
      tags: [Scanner]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Job with progressPct, signalCount, status
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/scanner/backtests/{id}/cancel:
    post:
      summary: Cancel a pending or running backtest
      operationId: cancelScannerBacktest
      tags: [Scanner]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Canceled job
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/scanner/backtests/{id}/signals:
    get:
      summary: List backtest signals with forward returns and first-touch trades
      description: |
        Each signal includes signalAt, closePrice, optional return1d/return5d/return20d
        (percent price change after 1/5/20 calendar days when data exists), and `trade`
        when a long/short plan exists: leverage, entry, stopLoss, takeProfit, first-touch
        outcome (tp|sl|open), and leveraged pnlPct. If one bar tags both TP and SL, a
        smaller interval decides which printed first (outcome and pnlPct follow that
        print). Watchlist jobs include exchange/symbol on each signal.
        `performance` adds horizon stats plus trade TP/SL counts, win rate,
        average/median leveraged PnL, per-coin `markets` (including zero-signal and
        data-error coins), and `book` (shared starting/ending balance) on watchlist jobs.
      operationId: listScannerBacktestSignals
      tags: [Scanner]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Signals list
          content:
            application/json:
              schema:
                type: object
                properties:
                  backtestId: { type: string }
                  count: { type: integer }
                  total: { type: integer }
                  signalCount: { type: integer }
                  signals:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScannerBacktestSignal'
                  performance:
                    $ref: '#/components/schemas/BacktestPerformance'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/export:
    post:
      summary: Start a user data export
      description: |
        Queues an export of the caller's own data as JSON or CSV.
        Sections default to all of: watchlist, shares, alerts, backtests, portfolios, customSignals.
        The portfolios section includes allocation baskets, stored rebalance runs, and risk limits.
        Only one pending/running export is allowed per clientId (409 conflict otherwise).
        Jobs run in the background; poll GET /api/v1/export/{id} for progressPct and status.
      operationId: startExport
      tags: [Export]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string }
                format: { type: string, enum: [json, csv], default: json }
                sections:
                  type: array
                  items: { type: string, enum: [watchlist, shares, alerts, backtests, portfolios, customSignals] }
                  description: Omit for all sections
      responses:
        '202':
          description: Export job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      summary: List export jobs for a client
      operationId: listExports
      tags: [Export]
      parameters:
        - name: clientId
          in: query
          schema: { type: string, minLength: 1 }
        - name: X-Client-Id
          in: header
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Export list
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId: { type: string }
                  count: { type: integer }
                  exports:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExportJob'
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/export/{id}:
    get:
      summary: Get export job status and progress
      operationId: getExport
      tags: [Export]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Job with progressPct, status, downloadUrl when ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/export/{id}/cancel:
    post:
      summary: Cancel a pending or running export
      operationId: cancelExport
      tags: [Export]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Canceled (or already terminal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/export/{id}/download:
    get:
      summary: Download a completed export file
      description: |
        Only the owning clientId may download. Returns 400 if not completed, 404 if expired
        or missing. Files are deleted automatically after EXPORT_FILE_TTL (default 1h).
      operationId: downloadExport
      tags: [Export]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Export file body (JSON or CSV)
          content:
            application/json:
              schema: { type: object }
            text/csv:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/account:
    get:
      summary: Get account close/reopen status for a clientId
      operationId: getAccount
      tags: [Account]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Account status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/account/close:
    post:
      summary: Close account (7-day grace period)
      description: |
        Marks the clientId closed. Product APIs return 403 for that clientId.
        Shared watchlists owned by this client become inaccessible to grantees.
        Data is retained until purgeAt (closedAt + 7 days). Active jobs are canceled.
      operationId: closeAccount
      tags: [Account]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string }
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/account/reopen:
    post:
      summary: Reopen a closed account within the grace period
      operationId: reopenAccount
      tags: [Account]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string }
      responses:
        '200':
          description: Reopened (active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/account/api-keys:
    get:
      summary: List API keys for this account
      description: |
        Named keys for bots/apps. Secrets are never listed. Manage keys with the
        main account (`X-Client-Id` plus optional process `API_AUTH_TOKEN`).
        User-issued keys cannot list or create other keys.
      operationId: listAccountAPIKeys
      tags: [Account]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Key metadata (no secrets)
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId: { type: string }
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountAPIKey'
                  count: { type: integer }
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      summary: Create a named API key
      description: |
        permission=read → GET only. permission=trade → can place/cancel paper trades
        and other mutations except account close and key management.
        The full secret is returned once.
      operationId: createAccountAPIKey
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                clientId: { type: string }
                name: { type: string, example: Trading bot }
                permission: { type: string, enum: [read, trade], default: read }
      responses:
        '201':
          description: Created key including one-time secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAPIKeyCreated'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/account/api-keys/{id}:
    delete:
      summary: Revoke an API key
      description: Immediate; the secret stops working. Idempotent if already revoked.
      operationId: revokeAccountAPIKey
      tags: [Account]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Revoked key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAPIKey'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/import/preview:
    post:
      summary: Upload an export file and get a restore preview
      description: |
        Accepts multipart form field `file` (or raw JSON/CSV body).
        Parses watchlist, shares, alerts, backtests, paper portfolios (including allocation baskets, rebalance history, and risk limits), and custom signal profiles; returns counts of valid, invalid,
        willAdd, willUpdate, willConflict, and duplicates. customSignals includes addNames (new mixes),
        updateNames (exactly one saved mix), and conflicts (more than one file row or saved mix with
        the same name). Confirm with customSignalResolutions to pick which saved mix to update;
        omitted conflicts are not imported. Does not apply data until confirm.
        Ownership is always the uploading clientId (file clientId is ignored).
      operationId: previewImport
      tags: [Import]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
        - name: format
          in: query
          schema: { type: string, enum: [json, csv] }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                clientId: { type: string }
                format: { type: string, enum: [json, csv] }
                file: { type: string, format: binary }
          application/json:
            schema: { type: object }
          text/csv:
            schema: { type: string }
      responses:
        '200':
          description: Preview with section counts (status=previewed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/import:
    get:
      summary: List import jobs for a client
      operationId: listImports
      tags: [Import]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Import list
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/import/{id}:
    get:
      summary: Get import job status, progress, and preview counts
      operationId: getImport
      tags: [Import]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Import job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/import/{id}/confirm:
    post:
      summary: Start applying a previewed import
      description: |
        mode=merge adds only missing records (no duplicate symbols/shares/ids). Same-name custom
        signal profiles with exactly one saved mix are updated in place. Names that match more than
        one file row or more than one saved mix are conflicts — pass customSignalResolutions
        (name + incomingIndex and/or profileId). Omitted conflicts are skipped.
        If saved mixes that intersect the file changed after preview (conflict candidates or a
        selected profile), confirm returns 409 import_preview_stale and does not start the job.
        mode=replace clears existing section data for the client then imports from the file.
        Only one pending/running import per client (409 otherwise). Runs in the background.
      operationId: confirmImport
      tags: [Import]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                clientId: { type: string }
                mode: { type: string, enum: [merge, replace] }
                customSignalResolutions:
                  type: array
                  description: Picks for same-name custom signal conflicts. Omit a name to skip it.
                  items:
                    $ref: '#/components/schemas/CustomSignalResolution'
      responses:
        '202':
          description: Import queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          description: Another import is running, or custom signal profiles changed since preview (code import_preview_stale)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/import/{id}/cancel:
    post:
      summary: Cancel a previewed, pending, or running import
      operationId: cancelImport
      tags: [Import]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/ai/chat:
    post:
      summary: Chat with the multi-agent AI assistant
      description: |
        Proxies to the Python multi-agent service (`AI_SERVICE_URL`).
        Market figures must come from tools on the assistant side.
        Returns 503 when AI is not configured; 502 on upstream failure.
        Informational only - not financial advice.
      operationId: postAiChat
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiChatRequest'
            example:
              message: "What is BTC RSI on binance 1h?"
              sessionId: "mobile-ai-example"
      responses:
        '200':
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiChatResponse'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/ai/chat/stream:
    post:
      summary: Stream AI chat thinking and tools (NDJSON)
      description: |
        Same request as POST /api/v1/ai/chat. Response is NDJSON lines:
        `{type:status|thinking|tool|tool_result|final|error|done, text?, reply?, tools?}`.
        Informational only — not financial advice.
      operationId: postAiChatStream
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiChatRequest'
      responses:
        '200':
          description: NDJSON event stream
          content:
            application/x-ndjson:
              schema:
                type: object
                properties:
                  type: { type: string }
                  text: { type: string }
                  reply: { type: string }
                  tools:
                    type: array
                    items: { type: string }
                  thinking:
                    type: array
                    items: { type: string }
                  message: { type: string }
                  sessionId: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'


components:
  responses:
    Error:
      description: Error payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    RealtimeTicket:
      type: object
      properties:
        ticket:
          type: string
        expiresAt:
          type: string
          format: date-time
        clientId:
          type: string
    RealtimeInfo:
      type: object
      properties:
        path:
          type: string
          example: /api/v1/ws
        protocol:
          type: integer
          example: 1
        maxSymbols:
          type: integer
          example: 100
        auth:
          type: string
        reconnect:
          type: string
        channels:
          type: array
          items: { type: string }
        clientTypes:
          type: array
          items: { type: string }
        serverTypes:
          type: array
          items: { type: string }
        access:
          type: string

    AiChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          description: User message (non-empty after trim)
        sessionId:
          type: string
          description: |
            Optional multi-turn session key. Defaults to the authenticated clientId
            (never a shared name) when omitted. Clients should send a stable device session id.
    AiChatResponse:
      type: object
      required: [reply, sessionId]
      properties:
        reply:
          type: string
          description: Assistant text
        sessionId:
          type: string
        tools:
          type: array
          items: { type: string }
          description: Tool names invoked during the turn (optional)
        thinking:
          type: array
          items: { type: string }
          description: High-level plan lines (optional)
        references:
          type: array
          items:
            $ref: '#/components/schemas/AiChatReference'
          description: Public web/X/news URLs gathered by research tools (optional)
        note:
          type: string
          description: Disclaimer (e.g. not financial advice)
    AiChatReference:
      type: object
      required: [url]
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
        source:
          type: string
          enum: [web, news, x, hn]
          description: Origin bucket for the UI chip
        snippet:
          type: string
    CandlesResponse:
      type: object
      properties:
        symbol:
          type: string
        interval:
          type: string
        exchange:
          type: string
        candles:
          type: array
          items:
            $ref: '#/components/schemas/Candle'
    Candle:
      type: object
      properties:
        openTime:
          type: string
          format: date-time
        open:
          type: string
        high:
          type: string
        low:
          type: string
        close:
          type: string
        volume:
          type: string
        closeTime:
          type: string
          format: date-time
        quoteVolume:
          type: string
        tradeCount:
          type: integer
          format: int64
    Ticker24h:
      type: object
      properties:
        exchange:
          type: string
        symbol:
          type: string
        priceChange:
          type: string
        priceChangePercent:
          type: string
        lastPrice:
          type: string
        openPrice:
          type: string
        highPrice:
          type: string
        lowPrice:
          type: string
        volume:
          type: string
          description: Base asset volume (24h)
        quoteVolume:
          type: string
          description: Quote asset volume (24h)
        openTime:
          type: string
          format: date-time
        closeTime:
          type: string
          format: date-time
        tradeCount:
          type: integer
          format: int64
        halted:
          type: boolean
          description: True when this is a last print before a delist halt, not a live 24h window
    OrderBookLevel:
      type: object
      properties:
        price: { type: string }
        quantity: { type: string, description: Base size at this grouped price }
        notional: { type: string, description: Quote notional (price * quantity) }
        cumulative: { type: string, description: Running base size from the spread }
        cumulativeNotional: { type: string }
        rawCount: { type: integer, description: Raw venue levels merged into this bucket }
        isWall: { type: boolean, description: Unusually large rest size on this side }
    OrderBookHeatmapLevel:
      type: object
      properties:
        price: { type: string }
        notional: { type: string, description: Quote notional resting at this price }
        isWall: { type: boolean }
    OrderBookHeatmapColumn:
      type: object
      properties:
        t: { type: string, format: date-time }
        mid: { type: string }
        bids:
          type: array
          items: { $ref: '#/components/schemas/OrderBookHeatmapLevel' }
        asks:
          type: array
          items: { $ref: '#/components/schemas/OrderBookHeatmapLevel' }
    OrderBookHeatmap:
      type: object
      properties:
        exchange: { type: string }
        symbol: { type: string }
        groupSize: { type: string }
        windowSeconds: { type: integer }
        sampleEveryMs: { type: integer }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        columns:
          type: array
          items: { $ref: '#/components/schemas/OrderBookHeatmapColumn' }
        live: { type: boolean }
        source: { type: string, enum: [live, history], description: live tape or stored ladders }
        note: { type: string }
    SpotOrderBook:
      type: object
      properties:
        exchange: { type: string }
        symbol: { type: string }
        lastPrice: { type: string, description: Mid of best bid/ask }
        bestBid: { type: string }
        bestAsk: { type: string }
        spread: { type: string }
        spreadPct: { type: string }
        groupSize: { type: string, description: Applied price bucket (e.g. 0.1) }
        suggestedGroupSizes:
          type: array
          items: { type: string }
          description: Ready-made grouping steps for the UI
        levels: { type: integer }
        bids:
          type: array
          items: { $ref: '#/components/schemas/OrderBookLevel' }
          description: Best bid first (highest price)
        asks:
          type: array
          items: { $ref: '#/components/schemas/OrderBookLevel' }
          description: Best ask first (lowest price)
        bidVolume: { type: string }
        askVolume: { type: string }
        imbalance:
          type: number
          description: (bidVol-askVol)/(bidVol+askVol); positive = more resting bids
        bidWalls: { type: integer }
        askWalls: { type: integer }
        analysis: { $ref: '#/components/schemas/OrderBookAnalysis' }
        updatedAt: { type: string, format: date-time }
        live: { type: boolean, description: True when the book is a live local websocket copy }
        source: { type: string, enum: [websocket, rest], description: websocket when served from a live local book }
        note: { type: string }
    OrderBookWall:
      type: object
      properties:
        side: { type: string, enum: [bid, ask] }
        price: { type: string }
        quantity: { type: string }
        notional: { type: string }
        distancePct: { type: string, description: Distance from mid as a percent }
        share: { type: number, description: Fraction of that side's band notional }
        behavior:
          type: string
          enum: [short, persistent, suspicious]
          description: |
            short = seen briefly; persistent = stayed near this price (~2+ min);
            suspicious = added and pulled many times in a short window
        ageSeconds: { type: number, description: Seconds since this wall zone was first seen }
        presentForSeconds: { type: number, description: Current uninterrupted present streak }
        visibleSeconds: { type: number, description: Total time the wall was present }
        appearCount: { type: integer, description: How many times it appeared (absent → present) }
    OrderBookBand:
      type: object
      properties:
        rangePct: { type: number }
        bidNotional: { type: string }
        askNotional: { type: string }
        bidQuantity: { type: string }
        askQuantity: { type: string }
        imbalance: { type: number }
        bidLevels: { type: integer }
        askLevels: { type: integer }
    OrderBookAnalysis:
      type: object
      description: |
        Buy/sell pressure from live depth within ±rangePct of mid. Uses all resting
        levels in that band (Binance/Coinbase/Bybit local books), not only the first rows.
      properties:
        rangePct: { type: number, description: Primary ±% band used for pressure and walls }
        midPrice: { type: string }
        bidNotional: { type: string }
        askNotional: { type: string }
        bidQuantity: { type: string }
        askQuantity: { type: string }
        imbalance:
          type: number
          description: (bidNotional-askNotional)/(sum); positive = more resting bids
        pressure: { type: string, enum: [buy, sell, balanced] }
        bidLevels: { type: integer }
        askLevels: { type: integer }
        coveredBidPct: { type: string, description: How far the deepest included bid is from mid }
        coveredAskPct: { type: string }
        walls:
          type: array
          items: { $ref: '#/components/schemas/OrderBookWall' }
        bands:
          type: array
          items: { $ref: '#/components/schemas/OrderBookBand' }
          description: Nested 0.5 / 1 / 2 / 5 percent bands for near vs farther depth
    CombinedOrderBookWall:
      type: object
      properties:
        exchange: { type: string }
        side: { type: string, enum: [bid, ask] }
        price: { type: string }
        quantity: { type: string }
        notional: { type: string }
        distancePct: { type: string }
        share: { type: number, description: Fraction of combined side notional }
        behavior: { type: string, enum: [short, persistent, suspicious] }
        ageSeconds: { type: number }
        presentForSeconds: { type: number }
        visibleSeconds: { type: number }
        appearCount: { type: integer }
    CombinedOrderBookVenue:
      type: object
      properties:
        exchange: { type: string }
        symbol: { type: string }
        live: { type: boolean }
        source: { type: string }
        bidNotional: { type: string }
        askNotional: { type: string }
        bidQuantity: { type: string }
        askQuantity: { type: string }
        imbalance: { type: number }
        pressure: { type: string, enum: [buy, sell, balanced] }
        bidLevels: { type: integer }
        askLevels: { type: integer }
        error: { type: string }
    CombinedOrderBook:
      type: object
      description: Market-wide pressure from summed venue depth in one price band
      properties:
        symbol: { type: string }
        rangePct: { type: number, description: Requested ±% of mid }
        midPrice: { type: string, description: Shared mid (median of venue mids) }
        usedLow: { type: string, description: Low price of the symmetric band actually summed }
        usedHigh: { type: string, description: High price of the symmetric band actually summed }
        usedRangePct: { type: number, description: Symmetric ±% actually used (min of the two sides) }
        requestedReached: { type: boolean, description: True when every venue covers ±rangePct on both sides }
        bidNotional: { type: string }
        askNotional: { type: string }
        bidQuantity: { type: string }
        askQuantity: { type: string }
        imbalance: { type: number }
        pressure: { type: string, enum: [buy, sell, balanced] }
        bidLevels: { type: integer }
        askLevels: { type: integer }
        coveredBidPct: { type: string }
        coveredAskPct: { type: string }
        walls:
          type: array
          items: { $ref: '#/components/schemas/CombinedOrderBookWall' }
        bands:
          type: array
          items: { $ref: '#/components/schemas/OrderBookBand' }
        venues:
          type: array
          items: { $ref: '#/components/schemas/CombinedOrderBookVenue' }
        venueCount: { type: integer }
        note: { type: string }
    LiquidityBand:
      type: object
      properties:
        rangePct: { type: number }
        bidNotional: { type: string }
        askNotional: { type: string }
        bidQuantity: { type: string }
        askQuantity: { type: string }
        totalNotional: { type: string }
        imbalance: { type: number }
        score: { type: number, description: 0–100 depth score for this band alone }
    LiquidityScore:
      type: object
      properties:
        midPrice: { type: string }
        usedRangePct: { type: number, description: Symmetric ±% both sides actually reach }
        score: { type: number, description: 0–100 overall (near included bands weighted more; lopsided books penalized) }
        grade: { type: string, enum: [very_low, low, medium, high, very_high] }
        weakerSide: { type: string, enum: [buy, sell, balanced], description: Thinner side in the widest included band }
        weakness: { type: number, description: 0–1 how lopsided the widest included band is }
        bands:
          type: array
          items: { $ref: '#/components/schemas/LiquidityBand' }
    VenueLiquidity:
      allOf:
        - $ref: '#/components/schemas/LiquidityScore'
        - type: object
          properties:
            exchange: { type: string }
            symbol: { type: string }
            live: { type: boolean }
            error: { type: string }
    MarketLiquidity:
      type: object
      description: Per-venue and market-wide liquidity from live books
      properties:
        symbol: { type: string }
        venueCount: { type: integer }
        market: { $ref: '#/components/schemas/LiquidityScore' }
        venues:
          type: array
          items: { $ref: '#/components/schemas/VenueLiquidity' }
        note: { type: string }
    SpotPerpBook:
      type: object
      properties:
        bidNotional: { type: string }
        askNotional: { type: string }
        total: { type: string }
        thinnerSide: { type: string, enum: [bid, ask, balanced] }
        strongerSide: { type: string, enum: [bid, ask, balanced] }
        mid: { type: string }
        coverPct: { type: string }
        venueCount: { type: integer }
        complete: { type: boolean }
    SpotPerpBand:
      type: object
      properties:
        rangePct: { type: string }
        spotBid: { type: string }
        spotAsk: { type: string }
        perpBid: { type: string }
        perpAsk: { type: string }
        thinnerBook: { type: string, enum: [spot, perp, even] }
        strongerBook: { type: string, enum: [spot, perp, even] }
        spotThinnerSide: { type: string, enum: [bid, ask, balanced] }
        perpThinnerSide: { type: string, enum: [bid, ask, balanced] }
        complete: { type: boolean }
    SpotPerpVenue:
      type: object
      properties:
        exchange: { type: string }
        spotBid: { type: string }
        spotAsk: { type: string }
        perpBid: { type: string }
        perpAsk: { type: string }
        thinnerBook: { type: string, enum: [spot, perp, even] }
        spotThinnerSide: { type: string }
        perpThinnerSide: { type: string }
        complete: { type: boolean }
        error: { type: string }
    SpotPerpLiquidity:
      type: object
      description: Spot versus perpetual resting size at the same percent of mid
      properties:
        symbol: { type: string }
        rangePct: { type: string }
        asOf: { type: string, format: date-time }
        spot: { $ref: '#/components/schemas/SpotPerpBook' }
        perp: { $ref: '#/components/schemas/SpotPerpBook' }
        thinnerBook: { type: string, enum: [spot, perp, even] }
        strongerBook: { type: string, enum: [spot, perp, even] }
        ratio: { type: string, description: Perp total divided by spot total at the headline band }
        bands:
          type: array
          items: { $ref: '#/components/schemas/SpotPerpBand' }
        venues:
          type: array
          items: { $ref: '#/components/schemas/SpotPerpVenue' }
        summary: { type: string }
        note: { type: string }
    LiquidationHit:
      type: object
      properties:
        exchange: { type: string }
        side: { type: string, enum: [long, short] }
        price: { type: string }
        quantity: { type: string }
        notional: { type: string }
        time: { type: string, format: date-time }
    LiquidationWindow:
      type: object
      properties:
        window: { type: string, enum: [5m, 1h, 4h, 12h, 24h] }
        longNotional: { type: string, description: Quote value of liquidated longs }
        shortNotional: { type: string, description: Quote value of liquidated shorts }
        totalNotional: { type: string }
        count: { type: integer }
        biggest: { $ref: '#/components/schemas/LiquidationHit' }
        coverageSeconds: { type: integer, description: Seconds the websocket was actually live for this coin+venue, plus history that filled a disconnect (capped at the window). Does not grow while a hole is still unfilled. }
        complete: { type: boolean, description: False until this coin+venue has had live or backfilled coverage for the full window. Combined is false unless both venues were covered for the whole window. }
    LiquidationGap:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, description: Omitted while the gap is still open }
        seconds: { type: integer, description: Remaining unfilled duration of this hole }
        missingSeconds: { type: integer, description: Same as seconds — how much of this hole is still missing }
    LiquidationVenueHealth:
      type: object
      properties:
        exchange: { type: string }
        live: { type: boolean }
        lastEventAt: { type: string, format: date-time, description: Last liquidation print on this venue }
        lastSeenAt: { type: string, format: date-time, description: Last websocket payload from this venue }
        coverageSeconds: { type: integer }
        missingSeconds: { type: integer, description: Sum of still-unfilled disconnect time in the last 6h }
        gaps:
          type: array
          items: { $ref: '#/components/schemas/LiquidationGap' }
    LiquidationFeed:
      type: object
      description: Per-venue last print, last socket message, and disconnects. Combined never substitutes one venue for the other.
      properties:
        venues:
          type: array
          items: { $ref: '#/components/schemas/LiquidationVenueHealth' }
        missing:
          type: array
          items: { type: string }
          description: Venues that are down, stalled, or never started
    MarketLiquidations:
      type: object
      description: Rolling futures liquidation totals from live streams
      properties:
        symbol: { type: string }
