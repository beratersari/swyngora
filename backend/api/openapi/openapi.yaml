        lotFills:
          type: array
          items: { $ref: '#/components/schemas/TaxLotFill' }
        fee: { type: number, description: Quote-currency taker fee }
        lastPrice: { type: number, description: Last/mark before slippage (0 if not stored) }
        createdAt: { type: string, format: date-time }
    PaperTradingCost:
      type: object
      properties:
        exchange: { type: string, enum: [binance, coinbase, bybit, nasdaq, bist] }
        feeRate: { type: number, description: Taker fee as a fraction (0.001 = 0.10%) }
        slippageRate: { type: number, description: Adverse slippage as a fraction }
        feePct: { type: number, description: Fee in percent }
        slippagePct: { type: number, description: Slippage in percent }
    PaperTradingCostsResponse:
      type: object
      properties:
        exchange: { type: string }
        feeRate: { type: number }
        slippageRate: { type: number }
        feePct: { type: number }
        slippagePct: { type: number }
        items:
          type: array
          items: { $ref: '#/components/schemas/PaperTradingCost' }
        note: { type: string }
    PortfolioCashMovement:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [deposit, withdrawal, transfer_out, transfer_in] }
        amount: { type: number }
        cashAfter: { type: number }
        netDepositsAfter: { type: number }
        note: { type: string }
        counterpartyPortfolioId: { type: string, description: Other book on an internal transfer }
        counterpartyPortfolioName: { type: string, description: Other book name at transfer time }
        peerMovementId: { type: string, description: Matching ledger row on the other book }
        createdAt: { type: string, format: date-time }
    PortfolioCashMoveResponse:
      type: object
      properties:
        movement:
          $ref: '#/components/schemas/PortfolioCashMovement'
        portfolio:
          $ref: '#/components/schemas/PortfolioView'
    PortfolioTransferResponse:
      type: object
      properties:
        from:
          $ref: '#/components/schemas/PortfolioCashMoveResponse'
        to:
          $ref: '#/components/schemas/PortfolioCashMoveResponse'
        replayed:
          type: boolean
          description: True when this POST reused a prior idempotency key and did not move cash again
        attempt: { type: integer }
        idempotencyKey: { type: string }
        note: { type: string }
    TransferAttempt:
      type: object
      properties:
        id: { type: string }
        idempotencyKey: { type: string }
        fromPortfolioId: { type: string }
        toPortfolioId: { type: string }
        fromPortfolioName: { type: string }
        toPortfolioName: { type: string }
        amount: { type: number }
        note: { type: string }
        status:
          type: string
          enum: [completed, replayed, conflict]
        attempt: { type: integer }
        outMovementId: { type: string }
        inMovementId: { type: string }
        createdAt: { type: string, format: date-time }
    PortfolioPerformance:
      type: object
      description: Period P&L plus equity time series for a paper portfolio chart
      properties:
        clientId: { type: string }
        currency: { type: string }
        period: { type: string, enum: [1d, 1w, 1m, 3m] }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        startEquity: { type: number }
        endEquity: { type: number }
        changeAmount:
          type: number
          description: endEquity minus startEquity (portfolio currency)
        changePct:
          type: number
          nullable: true
          description: Percent change vs startEquity; null when startEquity is ~0
        partial:
          type: boolean
          description: True when the portfolio is younger than the requested period
        maxDrawdown:
          type: number
          description: Largest peak-to-trough equity drop in the window (portfolio currency, 0 when equity never fell)
        maxDrawdownPct:
          type: number
          nullable: true
          description: That drop as a percent of the peak; null when the peak is ~0 or there was no drop
        drawdownFrom:
          type: string
          format: date-time
          description: When the peak before the max drawdown was printed
        drawdownTo:
          type: string
          format: date-time
          description: When equity reached the trough of the max drawdown
        pointCount: { type: integer }
        points:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioEquityPoint'
        note: { type: string }
    PortfolioEquityPoint:
      type: object
      properties:
        t: { type: string, format: date-time }
        equity: { type: number }
        cashBalance: { type: number }
        positionsValue: { type: number }
        marginEquity: { type: number }
    MarginPosition:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        exchange: { type: string }
        symbol: { type: string }
        side: { type: string, enum: [long, short] }
        mode: { type: string, enum: [isolated, cross] }
        quantity: { type: number }
        entryPrice: { type: number }
        leverage: { type: integer }
        margin: { type: number }
        debtPrincipal:
          type: number
          description: Main borrowed amount (quote cash for long, base coins for short)
        debtInterest:
          type: number
          description: Accrued interest in the same unit as debtPrincipal
        debtAsset: { type: string, enum: [quote, base] }
        debtNotional:
          type: number
          description: Principal+interest valued in quote (short uses mark)
        lastInterestAt: { type: string, format: date-time }
        liquidationPrice: { type: number }
        stopLoss: { type: number, nullable: true }
        takeProfit: { type: number, nullable: true }
        status: { type: string, enum: [open, closed] }
        markPrice: { type: number }
        unrealizedPnL: { type: number }
        realizedPnL: { type: number }
        closeReason: { type: string }
        openedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
    PendingOrder:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        exchange: { type: string }
        symbol: { type: string }
        type: { type: string, enum: [limit_buy, limit_sell, stop_loss, trailing_stop] }
        side: { type: string, enum: [buy, sell] }
        quantity: { type: number, description: Original order size }
        filledQuantity: { type: number }
        remainingQuantity: { type: number }
        triggerPrice: { type: number, description: Limit/stop level; for trailing_stop the current ratcheted stop }
        reservedCash:
          type: number
          description: Cash reserved for remaining buy size (remaining × slipped trigger × (1+fee))
        reservedQuantity:
          type: number
          description: Position quantity reserved for remaining sell size
        timeInForce: { type: string, enum: [gtc, ioc, fok] }
        expiresAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [open, filled, canceled, rejected, pending] }
        ocoGroupId: { type: string, description: Shared id for OCO take-profit + stop-loss pair }
        ocoPeerId: { type: string, description: Id of the other OCO leg }
        bracketId: { type: string, description: Shared id for bracket entry + exits }
        bracketRole: { type: string, enum: [entry, take_profit, stop_loss] }
        trailType: { type: string, enum: [percent, offset], description: Trailing distance mode }
        trailValue: { type: number, description: Trail distance (fraction or price offset) }
        trailPeak: { type: number, description: High-water mark for trailing stop (sell) }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        filledAt: { type: string, format: date-time, nullable: true }
        canceledAt: { type: string, format: date-time, nullable: true }
        fillTradeId: { type: string, description: Latest fill trade id }
        fillPrice: { type: number, description: Latest fill price }
        rejectReason: { type: string }
        cancelReason:
          type: string
          description: user | expired | ioc_remainder | ioc_no_fill | fok_unfilled | oco_peer_filled | oco_group_canceled
        lotMethod: { type: string, enum: [fifo, lifo], description: Lot matching used when this sell fills }
    AmendPendingOrderRequest:
      type: object
      description: At least one of triggerPrice or remainingQuantity is required.
      properties:
        triggerPrice:
          type: number
          exclusiveMinimum: 0
          description: New limit or stop price
        remainingQuantity:
          type: number
          exclusiveMinimum: 0
          description: New remaining size (must stay above zero; original quantity becomes filled + remaining)
    PendingOrderAmendHints:
      type: object
      properties:
        availableCashForOrder:
          type: number
          description: Available cash plus this order's current cash reservation (buy)
        availableQuantityForOrder:
          type: number
          description: Available position plus this order's current qty reservation (sell)
        maxRemainingQuantity:
          type: number
          description: Max remaining at the order's current triggerPrice
        minRemainingQuantity:
          type: number
          description: Minimum remaining size (MinTradeQuantity)
    PendingOrderDetail:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/PendingOrder'
        lastPrice:
          type: number
          description: Last market price for the pair (0 if unavailable)
        editable:
          type: boolean
          description: True when PATCH amend is allowed
        amend:
          $ref: '#/components/schemas/PendingOrderAmendHints'
        note: { type: string }
    RecurringBuyPlan:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        exchange: { type: string }
        symbol: { type: string }
        name:
          type: string
          description: User label e.g. Salary Day Buy
        amount:
          type: number
          description: Cash notional spent each successful run
        frequency:
          type: string
          enum: [daily, weekly, monthly, interval]
        weekday:
          type: string
          enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        dayOfMonth:
          type: integer
          description: Monthly calendar day 1-31
        intervalHours:
          type: integer
          description: Hours between interval buys
        timeZone:
          type: string
          description: IANA timezone e.g. Europe/Istanbul
        hour:
          type: integer
          description: Local hour when a local clock is set
        minute:
          type: integer
        maxPrice:
          type: number
          description: Skip when last or fee+slippage unit cost would exceed this; 0 = none
        budget:
          type: number
          description: Total cash cap across succeeded runs; 0 = none
        spent:
          type: number
          description: Cash spent on succeeded runs
        remainingBudget:
          type: number
          description: budget minus spent when budget is set
        endsAt:
          type: string
          format: date-time
          description: Inclusive last allowed scheduled instant
        endDate:
          type: string
          description: Local YYYY-MM-DD of endsAt
        status:
          type: string
          enum: [active, paused, ended]
        nextRunAt: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastPeriodKey:
          type: string
          description: Last claimed period key (idempotency)
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RecurringBuyRun:
      type: object
      properties:
        id: { type: string }
        planId: { type: string }
        periodKey:
          type: string
          description: Calendar period key e.g. 2024-06-15 | 2024-W24 | 2024-06
        status:
          type: string
          enum: [succeeded, failed, missed]
        amount: { type: number }
        quantity: { type: number }
        price: { type: number }
        tradeId: { type: string }
        failReason:
          type: string
          description: e.g. insufficient cash balance, market price unavailable, last price above maxPrice, fill would exceed maxPrice after fee and slippage, budget exhausted, plan ended, missed while offline. Temporary reasons are retried on the same period without a second debit.
        scheduledFor: { type: string, format: date-time }
        executedAt: { type: string, format: date-time }
        timing:
          type: string
          enum: [on_time, late]
          description: Set on succeeded fills. on_time means the buy landed near the scheduled slot; late means it ran after downtime or was completed later.
        canComplete:
          type: boolean
          description: True when the user may buy this missed slot now
    AllocationTarget:
      type: object
      required: [asset, weightPct]
      properties:
        asset:
          type: string
          description: Coin ticker or portfolio cash currency (e.g. BTC, ETH, USDT)
          example: BTC
        exchange:
          type: string
          enum: [binance, coinbase, bybit, nasdaq, bist]
          description: Venue used to trade this asset (ignored for cash)
        weightPct:
          type: number
          description: Target percent of spot equity (0.01–100); all targets must sum to 100
          example: 50
    AllocationBasket:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        name: { type: string }
        targets:
          type: array
          items: { $ref: '#/components/schemas/AllocationTarget' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RebalanceResult:
      type: object
      description: Stored paper rebalance run — fills, failures, leftover mix
      properties:
        id: { type: string }
        clientId: { type: string }
        basketId: { type: string }
        basketName: { type: string }
        currency: { type: string }
        status: { type: string, enum: [completed, partial, failed, no_trades, running, interrupted] }
        plannedLegs: { type: integer }
        filledLegs: { type: integer }
        failedLegs: { type: integer }
        beforeEquity: { type: number }
        afterEquity: { type: number }
        beforeCash: { type: number }
        afterCash: { type: number }
        remainingAbsDriftPct: { type: number, description: Sum of |afterPct − targetPct| }
        maxSleeveDriftPct: { type: number }
        remainingNotional: { type: number, description: Sum of leftover |target − after| value }
        totalFee: { type: number, description: Sum of paper taker fees (quote) }
        totalSlippage: { type: number, description: Sum of adverse fill vs last (quote) }
        totalCost: { type: number, description: totalFee + totalSlippage }
        summary: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        attemptCount: { type: integer }
        canContinue: { type: boolean }
        attempts:
          type: array
          items: { $ref: '#/components/schemas/RebalanceAttempt' }
        legs:
          type: array
          items: { $ref: '#/components/schemas/RebalanceLegOutcome' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/RebalanceLineSnapshot' }
    RebalanceLegOutcome:
      type: object
      properties:
        side: { type: string, enum: [buy, sell] }
        asset: { type: string }
        exchange: { type: string }
        symbol: { type: string }
        reason: { type: string }
        plannedQuantity: { type: number }
        plannedPrice: { type: number }
        plannedNotional: { type: number }
        status: { type: string, enum: [filled, failed] }
        tradeId: { type: string }
        filledQuantity: { type: number }
        fillPrice: { type: number }
        fillNotional: { type: number }
        lastPrice: { type: number, description: Venue last before paper slippage }
        fee: { type: number, description: Quote-currency taker fee }
        slippage: { type: number, description: Adverse quote impact vs last }
        error: { type: string }
        attempt: { type: integer }
    RebalanceAttempt:
      type: object
      properties:
        seq: { type: integer }
        status: { type: string }
        plannedLegs: { type: integer }
        filledLegs: { type: integer }
        failedLegs: { type: integer }
        totalFee: { type: number }
        totalSlippage: { type: number }
        totalCost: { type: number }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
    RebalanceLineSnapshot:
      type: object
      properties:
        asset: { type: string }
        exchange: { type: string }
        symbol: { type: string }
        isCash: { type: boolean }
        targetPct: { type: number }
        beforePct: { type: number }
        afterPct: { type: number }
        beforeValue: { type: number }
        afterValue: { type: number }
        targetValue: { type: number }
        afterDelta: { type: number, description: targetValue − afterValue }
    RiskLimitsView:
      type: object
      description: Settings screen DTO — current rules plus live daily PnL and per-asset weights
      properties:
        clientId: { type: string }
        limits:
          type: object
          properties:
            maxDailyLossPct: { type: number, nullable: true }
            maxAssetWeightPct: { type: number, nullable: true }
            updatedAt: { type: string, format: date-time }
        status:
          type: object
          properties:
            dayKey: { type: string, description: UTC calendar day YYYY-MM-DD }
            timezone: { type: string, example: UTC }
            startOfDayEquity: { type: number }
            equity: { type: number }
            dailyPnl: { type: number }
            dailyPnlPct: { type: number }
            dailyLossLimitHit: { type: boolean }
            assets:
              type: array
              items:
                type: object
                properties:
                  asset: { type: string }
                  value: { type: number }
                  weightPct: { type: number }
                  atOrOverLimit: { type: boolean }
            canOpenSpotBuy:
              type: boolean
              description: False when daily-loss rule is currently hit (concentration is per-coin on each order)
            canOpenMargin: { type: boolean }
            blockReasons:
              type: array
              items: { type: string }
        note: { type: string }
    PriceDiffWatch:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        symbol: { type: string }
        notional: { type: number, description: Quote size walked on live books }
        minProfit: { type: number, description: Minimum after-fee profit in quote currency }
        minDurationSec: { type: number, description: Seconds the fill must stay qualifying before opening }
        minNetDiffPct:
          type: number
          description: Optional extra profit % floor
        feeBinancePct: { type: number }
        feeCoinbasePct: { type: number }
        feeBybitPct: { type: number }
        exchanges:
          type: array
          items:
            type: string
            enum: [binance, coinbase, bybit]
          description: Venues this watch walks
        status: { type: string, enum: [active, paused] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PriceDiffOpportunity:
      type: object
