        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/around/similar:
    get:
      summary: Past important moves similar to the current tape
      description: |
        Compares the **current** market (last `window`, default 1h) to the
        setup **before** past important moves — volume vs typical, order
        book, open interest, listed options (BTC/ETH), takers, and price.
        `fields` selects which pieces to use (e.g. `volume,book,oi` skips
        price). `weights` sets importance (`book:3,oi:3,volume:1`; defaults
        book and OI 3, options 2, takers 1.5, volume and price 1).
        Options is only scored when both sides have samples. Uncompared fields have no score.
        Similarity uses only fields that actually had data. `minCoverage`
        (default 60) sends cases that lack enough selected data to
        `skipped` (with `missing` and `coverage`), not `matches`.
        Two matches are one past event only when their **price-move
        ranges overlap**. Shared setup windows do not merge different
        moves.
        Each past match uses only tape available before that move
        (`dataFrom` / `dataTo`) and includes `whySimilar` plus per-field
        `compared` scores. `horizons` picks the after-windows
        (default `15m,1h,4h`; e.g. `5m,30m,2h`). Each horizon is
        measured on matching candle size (5m uses 5m bars) and reports
        up/down, average, median, `sample`, plus the same stats in
        similarity bands 40–60 / 60–80 / 80–100. A case is left out of
        a horizon when that tape is not long enough. Default lookback
        **7d**. Informational only.
      operationId: findMarketAroundSimilar
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all)
          schema: { type: string, default: all }
        - name: lookback
          in: query
          description: 4h | 12h | 24h | 3d | 7d (default 7d)
          schema: { type: string, default: "7d" }
        - name: interval
          in: query
          description: 15m | 1h (default 15m)
          schema: { type: string, default: "15m" }
        - name: direction
          in: query
          description: up | down | both (default both)
          schema: { type: string, default: both }
        - name: minReturnPct
          in: query
          description: Minimum |return| percent for past moves
          schema: { type: number }
        - name: limit
          in: query
          description: How many nearest cases (default 5, max 10)
          schema: { type: integer, default: 5 }
        - name: window
          in: query
          description: Current/before window 15m | 30m | 1h | 2h | 4h (default 1h)
          schema: { type: string, default: "1h" }
        - name: during
          in: query
          description: Override past move window
          schema: { type: string }
        - name: fields
          in: query
          description: Tape to compare — price,volume,takers,oi,book,options (default all). Example volume,book,oi
          schema: { type: string, example: "volume,book,oi" }
        - name: weights
          in: query
          description: Importance per field — book:3,oi:3,volume:1 (defaults book and oi 3, options 2, takers 1.5, volume and price 1)
          schema: { type: string, example: "book:3,oi:3,volume:1" }
        - name: minCoverage
          in: query
          description: Minimum percent of selected data that must be present (default 60). Below that goes to skipped. 0 disables the floor.
          schema: { type: number, default: 60, minimum: 0, maximum: 100 }
        - name: horizons
          in: query
          description: After-windows CSV (default 15m,1h,4h). Example 5m,30m,2h. Matching candle size; each reports avg, median, up, down, sample, and similarity bands.
          schema: { type: string, example: "30m,2h,6h" }
        - name: at
          in: query
          description: Optional event time (RFC3339 or unix ms). When set, compares the tape before this time instead of the current last window.
          schema: { type: string, example: "2026-08-20T14:00:00Z" }
      responses:
        '200':
          description: Similar past setups, afterHorizons, thin coverage in skipped
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/forensics:
    get:
      summary: Market forensics (before / during / after + similar past moves)
      description: |
        One report for a coin and a chosen time. Combines the around-the-move
        tape (**before** / **during** / **after** — price, volume, takers,
        VWAP, vs typical, POC, sweeps, stored book/futures, and BTC/ETH
        listed options when sampled) with past
        important-move setups that looked like the **before** window, and
        how price moved after those (`afterHorizons`). `at` is required
        (RFC3339 or unix ms). Same `window` / `during` as `/around`. Same
        similar-move knobs as `/around/similar` (`lookback`, `fields`,
        `weights`, `minCoverage`, `horizons`). If similar-move search
        fails, `tape` is still returned and `similarError` explains why.
        `why` is a plain-language read of why the move may have happened
        (before / during / after plus similar past cases), not a metric
        dump. `timeline` is one clock of those prints in time order
        (OI, takers, venue price, follow-through, liquidations, options,
        sweeps). The timeline only includes prints known by `asOf`
        (`timeline.knownUntil`). Omit `asOf` to use now — an old event
        keeps later prints that have already happened. Pass `asOf` to
        replay (for example 14:10 on a 14:00 move). A venue whose tape
        is missing until later is not treated as following at that first
        sample. Same `venueTiming` path rule as `/around`: last
        OI/taker print much earlier than price omits continued / faded /
        reversed. Informational only.
      operationId: getMarketForensics
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: at
          in: query
          required: true
          description: Event time (RFC3339 or unix ms) — start of the during window
          schema: { type: string, example: "2026-08-20T14:00:00Z" }
        - name: asOf
          in: query
          description: >
            Observer clock (RFC3339 or unix ms). Tape and timeline only include
            prints at or before this time. Must be at or after `at` and not in
            the future. Omit to use now (old events keep later prints that
            have already happened).
          schema: { type: string, example: "2026-08-20T14:10:00Z" }
        - name: exchange
          in: query
          description: binance | bybit | okx | all (default all = all futures venues + combined)
          schema: { type: string, default: all }
        - name: window
          in: query
          description: Before/after lookback — 15m | 30m | 1h | 2h | 4h (default 1h)
          schema: { type: string, default: "1h" }
        - name: during
          in: query
          description: Move window starting at `at` — 5m | 15m | 30m | 1h (default 15m)
          schema: { type: string, default: "15m" }
        - name: lookback
          in: query
          description: How far back to search similar moves — 4h | 12h | 24h | 3d | 7d (default 7d)
          schema: { type: string, default: "7d" }
        - name: interval
          in: query
          description: 15m | 1h (default 15m)
          schema: { type: string, default: "15m" }
        - name: direction
          in: query
          description: up | down | both (default both)
          schema: { type: string, default: both }
        - name: minReturnPct
          in: query
          description: Minimum |return| percent for past moves
          schema: { type: number }
        - name: limit
          in: query
          description: How many nearest similar cases (default 5, max 10)
          schema: { type: integer, default: 5 }
        - name: fields
          in: query
          description: Tape to compare — price,volume,takers,oi,book,options (default all)
          schema: { type: string, example: "volume,book,oi" }
        - name: weights
          in: query
          description: Importance per field — book:3,oi:3,volume:1
          schema: { type: string, example: "book:3,oi:3,volume:1" }
        - name: minCoverage
          in: query
          description: Minimum percent of selected data that must be present (default 60)
          schema: { type: number, default: 60, minimum: 0, maximum: 100 }
        - name: horizons
          in: query
          description: After-windows CSV (default 15m,1h,4h)
          schema: { type: string, example: "15m,1h,4h" }
      responses:
        '200':
          description: Forensics tape plus similar past moves
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketForensics' }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/forensics/scan:
    get:
      summary: Coins whose current tape looks like past pre-move setups
      description: |
        Scans top quote-volume coins and compares each coin's **current**
        tape (last `window`) to the setup **before** that coin's own
        important past moves. Returns coins that look similar, ranked by
        closeness, plus what usually happened after those past cases
        (`afterStory`, `afterHorizons`, `lean`). Default lookback **3d**,
        default 12 coins (max 20). Informational only.
      operationId: scanMarketForensics
      tags: [Market]
