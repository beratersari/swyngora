  /api/v1/portfolio/recurring-buys:
    post:
      summary: Create a paper recurring buy plan
      description: |
        Schedules named cash buys of a symbol at market (last) price.
        frequency: daily | weekly | monthly | interval.
        weekly + weekday (monday..sunday); monthly + dayOfMonth (1-31, salary day);
        interval + intervalHours (1-168, e.g. 12 = every 12 hours).
        Optional timeZone (IANA, e.g. Europe/Istanbul) plus hour/minute for a DST-aware
        local clock (Monday 09:00; spring-forward snaps to the next valid local time,
        fall-back uses the first occurrence). Optional maxPrice skips a run when last,
        slipped fill, or fee-inclusive unit cost would exceed it (re-read after the
        worker starts so a PATCH applies to an in-flight tick).
        Optional budget is a total cash cap across succeeded runs (last buy may be partial).
        Optional endDate (YYYY-MM-DD in timeZone, inclusive last local day) or endsAt (RFC3339)
        stops further buys and marks the plan ended.
        Optional name (e.g. "Salary Day Buy"); default is "<symbol> <frequency>".
        Amount is cash notional spent each run. Insufficient cash fails that run only; the plan stays active.
        Missed periods execute only the latest due slot (no backlog of intermediate buys).
        Unique period keys prevent double execution across restarts or concurrent workers.
        Paper trading only — not real money.
      operationId: createRecurringBuyPlan
      tags: [Portfolio]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, amount, frequency]
              properties:
                clientId: { type: string }
                exchange: { type: string, enum: [binance, coinbase, bybit, nasdaq, bist], default: binance }
                symbol: { type: string, example: BTCUSDT }
                name:
                  type: string
                  maxLength: 80
                  description: User label e.g. Salary Day Buy; default is symbol + frequency
                  example: Salary Day Buy
                amount:
                  type: number
                  exclusiveMinimum: 0
                  description: Cash notional spent each run
                  example: 500
                frequency:
                  type: string
                  enum: [daily, weekly, monthly, interval]
                weekday:
                  type: string
                  enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
                  description: Weekly — buy on this weekday in timeZone (UTC if omitted)
                dayOfMonth:
                  type: integer
                  minimum: 1
                  maximum: 31
                  description: Monthly — calendar day (clamped to last day of short months)
                intervalHours:
                  type: integer
                  minimum: 1
                  maximum: 168
                  description: Interval frequency — hours between buys (e.g. 12)
                timeZone:
                  type: string
                  description: IANA timezone e.g. Europe/Istanbul. Empty is UTC and keeps the startAt clock.
                  example: Europe/Istanbul
                hour:
                  type: integer
                  minimum: 0
                  maximum: 23
                  description: Local hour to run (use with timeZone or UTC)
                  example: 9
                minute:
                  type: integer
                  minimum: 0
                  maximum: 59
                  description: Local minute to run
                  example: 0
                maxPrice:
                  type: number
                  minimum: 0
                  description: Skip the run if last, slipped fill, or fee-inclusive unit cost exceeds this. 0 = no cap.
                  example: 65000
                budget:
                  type: number
                  minimum: 0
                  description: Total cash cap across succeeded runs (slipped fill + taker fee). 0 = no cap. Last buy may spend leftover.
                  example: 10000
                endDate:
                  type: string
                  description: Last inclusive local calendar day (YYYY-MM-DD) in timeZone
                  example: "2026-12-31"
                endsAt:
                  type: string
                  format: date-time
                  description: Inclusive last allowed scheduled instant (RFC3339)
                startAt:
                  type: string
                  format: date-time
                  description: First scheduled run (RFC3339); default is now (next worker tick)
      responses:
        '201':
          description: Created plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringBuyPlan'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      summary: List paper recurring buy plans
      operationId: listRecurringBuyPlans
      tags: [Portfolio]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Plan list
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId: { type: string }
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecurringBuyPlan'
                  count: { type: integer }
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/portfolio/recurring-buys/{id}:
    get:
      summary: Get a paper recurring buy plan
      operationId: getRecurringBuyPlan
      tags: [Portfolio]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringBuyPlan'
        '404':
