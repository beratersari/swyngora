          type: array
          description: Sampled path (GET one opportunity only)
          items:
            $ref: '#/components/schemas/PriceDiffOppTick'
    PriceDiffOppReview:
      type: object
      description: How the gap moved after it opened
      properties:
        openDurationSec: { type: number }
        openNetDiffPct: { type: number }
        openProfit: { type: number }
        peakNetDiffPct: { type: number }
        peakProfit: { type: number }
        peakAt: { type: string, format: date-time }
        peakDeltaPct: { type: number, description: peak minus open net % }
        fadeStartedAt: { type: string, format: date-time }
        fadeFromPeakSec: { type: number }
        lastNetDiffPct: { type: number }
        lastProfit: { type: number }
        closeReason:
          type: string
          enum: [below_min_profit, below_min_net, thin_book, paused, venues_changed]
        summary: { type: string }
    PriceDiffOppTick:
      type: object
      properties:
        at: { type: string, format: date-time }
