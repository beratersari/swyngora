openapi: 3.0.3
info:
  title: Swyngora Market API
  description: |
    Public market data for Swyngora (v0.1).

    - Candles, 24h volume/ticker, and spot/equity listing support **binance**, **coinbase**,
      **bybit**, **nasdaq**, and **bist** (select with `?exchange=`). Nasdaq/BIST are cash
      equities (USD/TRY) via public Yahoo quotes; no live order book.
    - Circulating / total / max supply is sourced from the **Binance** public marketing
      symbol list (asset-level, used for all venues' mcap enrichment), refreshed daily.
      Max supply is null when undefined.
    - Watchlist is unauthenticated state keyed by client-supplied `clientId`
      (must be non-empty; not for multi-tenant production without real auth).
      Data is persisted in SQLite on the server (survives restarts). Each list has a monotonic
      `version` for multi-device sync: send `baseVersion` on writes; concurrent adds of different
      symbols auto-merge; delete-vs-update on the same symbol returns 409 with both sides.
    - Price alerts support `one_time` (default) or `repeating` modes for above/below targets.
      Order-book alerts (`kind=imbalance` or `kind=wall`) use the live local book and default
      to repeating with edge re-arm so the same wall/imbalance does not re-fire until it clears.
      One-time alerts become `triggered` after the first fire; repeating alerts stay `active`
      and re-fire only after the price returns to the safe side and crosses again.
    - Clients may register a webhook URL with deliveryMode `immediate` or `hourly_digest`,
      plus optional quiet hours (IANA timeZone + local start/end). Delivery is deferred until
      quiet hours end; pending notifications survive restarts.
    - Realtime WebSocket (`GET /api/v1/ws`): subscribe/unsubscribe selected coin prices
      and one paper portfolio for order/position/cash events. Reconnect by resubscribing;
      access is checked per book. See `GET /api/v1/realtime`.
    - Paper trading: one or more named virtual portfolios per client (own cash, positions,
      orders, and performance), market buy/sell at last price,
      pending limit buy/sell and stop-loss orders with balance/position reservations and
      partial fills (auto-fill on price), open positions, realized/unrealized P&amp;L,
      trade history, recurring buy (DCA) plans, and isolated margin long/short (1x–10x)
      with market/limit opens, liquidation, partial close, and stop-loss/take-profit
      (SQLite; not real money).
    - Cross-exchange price difference tracking: watch a coin across Binance, Coinbase, and
      Bybit; when net edge after fees exceeds a threshold, store a buy/sell opportunity.
      Open opportunities persist across restarts; no duplicate while open; re-open after
      the edge falls below the limit and rises again. Stale or missing prices skip signals.
    - Funding-arb follows: watch Binance vs Bybit after-fee funding; notify via the
      alert webhook when horizon net is at least `minProfit`. The first clock of a
      history run is the entry signal (not collected profit).
    - Technical indicator scanner: RSI, EMA crossover, and volume-increase rules over the
      client's watchlist; background evaluation; match history deduped by rule/symbol/bar.
    - Swing engine: 4h+1d pattern detection (Wilder RSI/ADX/ATR, SuperTrend, MACD), BTC regime
      and R:R quality gates, ATR/structure trade levels. Informational only.
    - Historical scanner backtests: run a rule over a date range for one symbol, track progress,
      cancel jobs, and view signals with 1/5/20-day forward returns.
    - User data export: download watchlist, shares, price-alert history, and backtest results as
      JSON or CSV. Large exports run in the background with progress and cancel; one active export
      per client; files are owner-only downloads and expire after a TTL.
    - User data import: upload a prior JSON/CSV export, preview valid/invalid/willAdd counts, then
      confirm with merge or replace mode. Dedupes symbols/shares/ids; large applies run in the
      background with progress and cancel.
    - Account close: close a clientId for 7 days (reopen allowed); product APIs and shared-list
      access stop; after grace, user data and jobs are purged.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  time:
                    type: string
                    format: date-time
  /api/v1/realtime:
    get:
      summary: Realtime WebSocket protocol description
      description: |
        Returns how to connect to `GET /api/v1/ws` (JSON messages).
        Subscribe/unsubscribe selected coins for price ticks and one paper portfolio
        for order/position/cash events. Resubscribe after reconnect; access is
        enforced per book (owner, trader, or viewer). Paper trading only.
      operationId: getRealtimeInfo
      tags: [Realtime]
      responses:
        '200':
          description: Connection and message protocol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeInfo'
  /api/v1/realtime/ticket:
    post:
      summary: Mint a one-time WebSocket ticket
      description: |
        Returns a 60-second, single-use ticket bound to the caller. Browsers
        send this as `?ticket=` on `GET /api/v1/ws` instead of the long-lived
        API secret. Requires the same header auth as other tenant routes.
      operationId: createRealtimeTicket
      tags: [Realtime]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Ticket minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicket'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/ws:
    get:
      summary: WebSocket realtime stream
      description: |
        Upgrade to WebSocket. REST uses `Authorization` / `X-API-Key`.
        Browsers mint a one-time ticket (`POST /api/v1/realtime/ticket`) and
        pass `?ticket=` plus `?clientId=`. Long-lived secrets are not accepted
        on the query string.

        Client JSON: `{ "type": "subscribe_prices", "symbols": [{ "exchange", "symbol" }] }`,
        `unsubscribe_prices`, `subscribe_portfolio` (`portfolioId`), `unsubscribe_portfolio`, `ping`.

        Server JSON: `hello`, `ack`, `price`, `portfolio` (snapshot / order / position / fill),
        `error`, `pong`. After reconnect, resend subscriptions; the server snapshots current state.
        Portfolio events are sent only if this clientId can view the book.
      operationId: realtimeWebSocket
      tags: [Realtime]
      parameters:
        - in: query
          name: clientId
          required: true
          schema: { type: string }
        - in: query
          name: ticket
          schema: { type: string }
          description: One-time ticket from POST /api/v1/realtime/ticket (60s, single use)
        - in: query
          name: portfolioId
          schema: { type: string }
          description: Optional initial book (still send subscribe_portfolio)
      responses:
        '101':
          description: Switching Protocols (WebSocket)
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/market/exchanges:
    get:
      summary: List supported spot exchanges
      operationId: listExchanges
      tags: [Market]
      responses:
        '200':
          description: Configured venues
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchanges:
                    type: array
                    items:
                      type: string
                    example: ["binance", "coinbase", "bybit"]
                  default:
                    type: string
                    example: binance
                  venueQuotes:
                    type: object
                    additionalProperties: { type: string }
                    description: Native quote of last/open/high/low/quoteVolume per venue
                  marketCapQuotes:
                    type: object
                    additionalProperties: { type: string }
                    description: Currency of market-cap fields per venue

  /api/v1/market/fx:
    get:
      summary: Spot FX rates for display conversion
      description: |
        USD-based spot rates (units of each currency per 1 USD) for converting
        BIST TRY, Nasdaq/Coinbase USD, and crypto USDT quotes in the UI.
        USDT is treated as USD. Rates are cached; `stale` is true when serving
        last-good after an upstream miss. Display only — not settlement FX.
      operationId: getFxRates
      tags: [Market]
      responses:
        '200':
          description: USD-based FX snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxRates'

  /api/v1/market/intervals:
    get:
      summary: List supported candle intervals
      operationId: listIntervals
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          description: Venue id (binance | coinbase | bybit | nasdaq | bist). Default binance. Interval sets differ per venue.
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit, nasdaq, bist]
      responses:
        '200':
          description: Supported intervals for the selected exchange
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchange:
                    type: string
                    example: binance
                  intervals:
                    type: array
                    items:
                      type: string
                    example: ["1m", "5m", "1h", "1d"]

  /api/v1/market/tags:
    get:
      summary: List Binance product-catalog tags
      description: |
        Unique crypto product tags from Binance product catalog (e.g. Meme, defi, Layer1_Layer2).
        Used to power spot list tag filters. Non-crypto tags (bStocks, tCommodities) are excluded.
        Tags are only populated for Binance; other exchanges return an empty list.
      operationId: listProductTags
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          description: Venue id (binance | coinbase | bybit | nasdaq | bist). Default binance.
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit, nasdaq, bist]
      responses:
        '200':
          description: Sorted unique tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchange:
                    type: string
                    example: binance
                  tags:
                    type: array
                    items:
                      type: string
                    example: ["AI", "Layer1_Layer2", "Meme", "defi"]
        '502':
          $ref: '#/components/responses/Error'


  /api/v1/market/delist-schedule:
    get:
      summary: List scheduled spot delistings
      description: |
        Cached spot delist schedule per venue. Binance uses the official
        wallet schedule when BINANCE_API_KEY is set. Bybit is parsed from
        public delisting announcements (no key). Coinbase / Nasdaq / BIST
        have no free future calendar. Each item includes `delistTime` (halt)
        and `announcedAt` when the venue published the notice (Binance CMS
        `releaseDate`, Bybit `publishTime`). Pairs that delist in the next
        ~31 days or in the last 30 days stay on the default TRADING markets
        list with a Delist tag.
      operationId: listDelistSchedule
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit, nasdaq, bist]
      responses:
        '200':
          description: Delist schedule snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelistScheduleResponse'
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/market/post-delist:
    get:
      summary: Off-venue price after this exchange delisted the pair
      description: |
        After a venue has halted a pair, Binance (or that venue) has no new
        trades. This returns a labeled public reference: another listed venue
        if the pair still trades there, otherwise CoinGecko USD last + OHLC.
        Informational only — not this venue's book, not financial advice.
        Listed and upcoming pairs return `available: false`.
      operationId: getPostDelist
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit, nasdaq, bist]
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: VICUSDT
        - name: interval
          in: query
          required: false
          description: Hint for other-venue candles. CoinGecko OHLC is daily (7d or 30d).
          schema:
            type: string
            default: 1d
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Post-delist off-venue snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDelistResponse'
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/market/spot:
    get:
      summary: List Binance spot markets with search and sort
      description: |
        Returns spot-tradable pairs from Binance `exchangeInfo`, joined with
        24h ticker metrics. Supports substring search (`q`), quote/base/status
        filters, sorting by volume and other metrics, and offset pagination.
      operationId: listSpotMarkets
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          description: Venue id (binance | coinbase | bybit | nasdaq | bist). Default binance.
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit, nasdaq, bist]
        - name: q
          in: query
          required: false
          description: Case-insensitive search on symbol, baseAsset, or quoteAsset
          schema:
            type: string
            example: btc
        - name: quote
          in: query
          required: false
          description: Filter by quote asset (e.g. USDT)
          schema:
            type: string
            example: USDT
        - name: base
          in: query
          required: false
          description: Filter by base asset (e.g. BTC)
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by exchange status (e.g. TRADING)
          schema:
            type: string
            example: TRADING
        - name: tag
          in: query
          required: false
          description: |
            Filter by Binance product-catalog tag (case-insensitive).
            Comma-separated or repeated `tag` params use OR semantics (has any).
            Examples: `Meme`, `defi,AI`, `Layer1_Layer2`.
          schema:
            type: string
            example: Meme
        - name: tags
          in: query
          required: false
          description: Alias of `tag` (comma-separated product tags, OR match)
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort field (default quoteVolume)
          schema:
            type: string
            default: quoteVolume
            enum: [quoteVolume, volume, priceChangePercent, lastPrice, tradeCount, symbol, baseAsset, marketCapCirculating, marketCapTotal, marketCapMax, tags]
        - name: order
          in: query
          required: false
          description: Sort direction (default desc for metrics, asc for symbol/baseAsset)
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          required: false
          description: Page size (1-500, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          required: false
          description: Rows to skip after filter+sort (default 0)
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Paged spot market list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotListResponse'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/candles:
    get:
      summary: Fetch OHLCV candlesticks
      operationId: getCandles
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          schema:
            type: string
            enum: [binance, coinbase, bybit, nasdaq, bist]
            default: binance
        - name: symbol
          in: query
          required: true
          description: Trading pair (Binance/Bybit BTCUSDT; Coinbase BTC-USD)
          schema:
            type: string
            example: BTCUSDT
        - name: interval
          in: query
          required: false
          description: |
            Candle interval (default 1h). Supported values are exchange-specific -
            call GET /api/v1/market/intervals?exchange=... for the authoritative list.
            Coinbase/Bybit reject many Binance-only intervals with 400.
          schema:
            type: string
            default: 1h
            example: 1h
        - name: limit
          in: query
          required: false
          description: Number of candles (1-1000, default 100)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: startTime
          in: query
          required: false
          description: RFC3339 or Unix milliseconds
          schema:
            type: string
        - name: endTime
          in: query
          required: false
          description: RFC3339 or Unix milliseconds
          schema:
            type: string
      responses:
        '200':
          description: Candle series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandlesResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/ticker/24h:
    get:
      summary: 24-hour rolling ticker including volume
      operationId: getTicker24h
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          required: false
          description: Venue id (binance | coinbase | bybit | nasdaq | bist). Default binance.
          schema:
            type: string
            default: binance
            enum: [binance, coinbase, bybit, nasdaq, bist]
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: BTCUSDT
      responses:
        '200':
          description: 24h statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticker24h'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook:
    get:
      summary: Grouped spot order book
      description: |
        Live spot bid/ask depth with **backend price grouping** (e.g. 0.01, 0.1, 1).
        Each row is a merged price bucket with quantity, quote notional, running totals,
        and `isWall` when that bucket is unusually large versus the rest of the visible
        side (buy/sell walls). `suggestedGroupSizes` are ready-made steps for the UI.
        Spot only. Binance, Coinbase, and Bybit each keep a **live local book** on their
        public depth websocket. A dropped stream or missed update invalidates the copy and
        resyncs; stale depth is not returned.
        `analysis` scores buy/sell pressure, notional imbalance, and large walls using
        every resting level within ±`rangePct` of mid (default 2%) — not only the first
        few ladder rows. Informational — not financial advice.
      operationId: getSpotOrderBook
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit, nasdaq, bist], default: binance }
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: group
          in: query
          description: Price bucket size (e.g. 0.1). Omit to use a suggested default.
          schema: { type: string, example: "0.1" }
        - name: limit
          in: query
          description: Grouped rows per side (5–100, default 20)
          schema: { type: integer, default: 20, minimum: 5, maximum: 100 }
        - name: rangePct
          in: query
          description: Analyze resting depth within this ± percent of mid (0.25–10, default 2)
          schema: { type: number, default: 2, minimum: 0.25, maximum: 10, example: 2 }
      responses:
        '200':
          description: Grouped book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotOrderBook'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/history:
    get:
      summary: Stored order-book snapshots
      description: |
        Regular samples of the live spot book: grouped **bid/ask levels**,
        **spread**, **total liquidity**, **imbalance**, and **large walls**.
        Pass `at` for the snapshot nearest that time. Omit `at` to list
        recent samples (`from` / `to` optional). 1-minute samples, not a
        24h tape. Informational only.
      operationId: getOrderBookHistory
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit], default: binance }
        - name: at
          in: query
          description: Point in time (RFC3339 or unix ms)
          schema: { type: string, example: "2026-08-16T12:00:00Z" }
        - name: from
          in: query
          description: List window start (RFC3339 or unix ms)
          schema: { type: string }
        - name: to
          in: query
          description: List window end (RFC3339 or unix ms)
          schema: { type: string }
        - name: limit
          in: query
          description: Max list rows (default 60, max 500)
          schema: { type: integer, default: 60 }
      responses:
        '200':
          description: One snapshot or a newest-first list
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/history/compare:
    get:
      summary: Compare two stored order books
      description: |
        Loads the stored books nearest to `from` and `to` and shows which
        **price levels gained or lost liquidity**, plus mid / spread /
        imbalance change and walls that appeared or were pulled.
        Use this to see what changed before and after a price move.
        Informational only.
      operationId: compareOrderBookHistory
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit], default: binance }
        - name: from
          in: query
          required: true
          description: Earlier time (RFC3339 or unix ms)
          schema: { type: string, example: "2026-08-16T12:00:00Z" }
        - name: to
          in: query
          required: true
          description: Later time (RFC3339 or unix ms)
          schema: { type: string, example: "2026-08-16T12:15:00Z" }
      responses:
        '200':
          description: Before/after liquidity diff
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/icebergs:
    get:
      summary: Iceberg-style refill at the same price
      description: |
        Detects when visible **buy or sell** size at one price is eaten
        (hit at the touch or confirmed by trades) and then a similar clip
        comes back, repeatedly. This is the “10k sells, gets filled, 10k
        appears again” pattern — not a one-shot wall. Both sides.
        Walls on the live book also get `iceberg` / `behavior=iceberg`
        when this pattern is seen. Informational only — not proof of a
        hidden exchange order.
      operationId: getOrderBookIcebergs
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | coinbase | bybit | all (default all)
          schema: { type: string, default: all }
        - name: minNotional
          in: query
          description: Minimum visible clip in USD (default 25000)
          schema: { type: number, default: 25000 }
      responses:
        '200':
          description: Bid and ask icebergs, biggest clip first
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/combined:
    get:
      summary: Market-wide spot order book analysis
      description: |
        Combines live local books from Binance, Coinbase, and Bybit for one coin.
        Totals use only a **symmetric ±% band** every contributing venue can
        reach on **both** sides (the smaller of common bid reach and common ask
        reach). If all venues cover the requested ±`rangePct` both ways, that
        band is used (`requestedReached`, `usedRangePct`, `usedLow`, `usedHigh`).
        USD and USDT are treated as 1:1. Partial results if a venue is down.
        Informational only.
      operationId: getCombinedSpotOrderBook
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
          description: Pair on any venue (BTCUSDT or BTC-USD)
        - name: rangePct
          in: query
          description: ± percent of shared mid (0.25–10, default 2)
          schema: { type: number, default: 2, minimum: 0.25, maximum: 10, example: 2 }
      responses:
        '200':
          description: Combined analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedOrderBook'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/liquidity:
    get:
      summary: Liquidity score from live order-book depth
      description: |
        Scores how easy a pair is to trade from resting bid/ask notional.
        Only ±0.1 / ±0.5 / ±1% bands the book actually reaches on **both**
        sides are included (`usedRangePct`). Market-wide uses the symmetric
        ±% Binance, Coinbase, and Bybit can all reach. Near included depth
        is weighted more. Informational only.
      operationId: getMarketLiquidity
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | coinbase | bybit | all (default all)
          schema: { type: string, default: all, example: all }
      responses:
        '200':
          description: Liquidity scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLiquidity'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/heatmap:
    get:
      summary: Resting order-book heatmap over time
      description: |
        Recent **resting** bid/ask notional at each grouped price, sampled from
        the live local book (not executed volume / footprint). Each column is
        one snapshot. The tape fills while the pair is watched (detail page or
        this endpoint) and is kept by the wall sampler. First response seeds
        one column. Informational only.
      operationId: getSpotOrderBookHeatmap
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit, nasdaq, bist], default: binance }
        - name: group
          in: query
          description: Price bucket size (e.g. 0.1). Omit for a suggested default.
          schema: { type: string, example: "0.1" }
        - name: window
          in: query
          description: Lookback in seconds (60–1800, default 600)
          schema: { type: integer, default: 600, minimum: 60, maximum: 1800, example: 600 }
      responses:
        '200':
          description: Heatmap tape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookHeatmap'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/orderbook/impact:
    get:
      summary: Simulate market-order impact and slippage
      description: |
        Walks live resting depth like a market order. Buy consumes asks (lowest first);
        sell consumes bids (highest first). `exchange=all` (default) merges Binance,
        Coinbase, and Bybit and takes the best prices first. Provide **quantity**
        (base, e.g. 5 BTC) **or** **notional** (quote, e.g. 1000000000 USDT).
        Returns average fill, slippage vs mid/best, and price impact as the move
        of the best ask (buy) or best bid (sell) after leftover size. If the touch
        level still has quantity, impact is 0. If it is fully consumed and a new
        best remains, impact is the new best versus the old best. If the visible
        side is wiped, `impactAvailable` is false — the next best is unknown and
        impact is not invented from the last fill. Simulation only — not a quote.
      operationId: estimateSpotOrderBookImpact
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | coinbase | bybit | all (default all = combined walk)
          schema: { type: string, default: all, example: all }
        - name: side
          in: query
          schema: { type: string, enum: [buy, sell], default: buy }
        - name: quantity
          in: query
          description: Base size to fill (e.g. 5 for 5 BTC). Mutually exclusive with notional.
          schema: { type: number, example: 5 }
        - name: notional
          in: query
          description: Quote size to spend/receive (e.g. 1000000000). Mutually exclusive with quantity.
          schema: { type: number, example: 1000000 }
      responses:
        '200':
          description: Simulated fill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookImpact'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidations:
    get:
      summary: Rolling futures liquidation totals
      description: |
        Long/short liquidation notional, count, and the biggest hit for the last
        **5 minutes, 1 hour, 4 hours, and 24 hours**. Fed by Binance USD-M
        (`!forceOrder@arr`) and Bybit linear perpetual (`allLiquidation.{symbol}`)
        websocket streams. After a reconnect, each venue tries its own history
        for the hole; overlapping live+history prints are counted once. Venues
        stay separate. `coverageSeconds` / `complete` count live-socket time plus
        history that filled a disconnect. Combined `all` uses the shorter coverage
        of the venues watching that coin. `feed.gaps` lists still-unfilled holes
        in the last 6h; `missingSeconds` is how much time is still missing. A
        fully filled hole is omitted. Informational only.
      operationId: getMarketLiquidations
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all, example: all }
      responses:
        '200':
          description: Liquidation windows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLiquidations'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidations/overview:
    get:
      summary: Market-wide futures liquidation overview
      description: |
        CoinGlass-style **market desk**: long/short liquidation notional for the last
        **1 hour, 4 hours, 12 hours, and 24 hours**, plus coins ranked by total
        notional in `window` (default 24h) for a treemap. Fed by the same Binance
        USD-M and Bybit linear streams as `/liquidations`. `exchange=all` (default)
        sums both venues. `complete` uses the all-market Binance live clock when
        `exchange` is `all` or `binance`. Informational only.
      operationId: getMarketLiquidationOverview
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all, example: all }
        - name: window
          in: query
          description: Window used to rank `coins` — 1h | 4h | 12h | 24h (default 24h)
          schema: { type: string, default: 24h, enum: [1h, 4h, 12h, 24h], example: 24h }
        - name: limit
          in: query
          description: Max coins in the ranked list (default 50, max 100)
          schema: { type: integer, default: 50, minimum: 1, maximum: 100, example: 50 }
      responses:
        '200':
          description: Market-wide windows plus ranked coins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLiquidationOverview'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/open-interest:
    get:
      summary: Futures open interest and windowed change
      description: |
        Current outstanding futures size plus how much it increased or decreased
        over the last **5 minutes, 1 hour, 4 hours, and 24 hours**.
        Sources: **Binance USD-M** (`/fapi/v1/openInterest` + 5m hist) and
        **Bybit linear perpetual** (`/v5/market/tickers` + `/v5/market/open-interest`).
        `contracts` is venue-published size in the base asset; `value` is USDT
        notional. `exchange=all` (default) sums both venues. `complete` is false
        when the historical sample is missing or older than the window slack.
        The `funding` object is the predicted next funding rate plus recent
        settlements (same payload as `/funding-rate`). `longShort` is the
        account long/short ratio (same payload as `/long-short-ratio`).
        Results are cached ~30s. Informational only.
      operationId: getMarketOpenInterest
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all, example: all }
      responses:
        '200':
          description: Current open interest and windowed change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOpenInterest'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/funding-rate:
    get:
      summary: Perpetual funding rate and recent history
      description: |
        Predicted **next** funding rate plus recent **settled** payments for
        **Binance USD-M** and **Bybit linear perpetual**. `rate` is decimal
        (`0.0001` = 0.01%); `ratePct` is percent. `payer` is who pays at
        settlement (`long` = longs pay shorts). Combined `exchange=all` returns
        each venue separately — rates are not averaged. `limit` is settled
        history size (default 12, max 30). Cached ~30s. Informational only.
      operationId: getMarketFundingRate
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all, example: all }
        - name: limit
          in: query
          description: Settled history size (1–30, default 12)
          schema: { type: integer, default: 12, minimum: 1, maximum: 30 }
      responses:
        '200':
          description: Current funding and recent settlements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketFundingRate'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/funding-arb:
    get:
      summary: Cross-exchange funding opportunity for one coin
      description: |
        Compare **Binance USD-M** and **Bybit linear** predicted funding and
        pick which venue to **long** (cheaper) and **short** (richer).
        Funding is paid only at each venue's published settlement clock
        (8h: 00:00/08:00/16:00 UTC; 4h: every four hours from 00:00 UTC).
        `holdHours` counts those clocks in `(now, now+holdHours]`. No clock
        means funding is **0**. `trade` is omitted unless after-fee net is
        positive. Informational only.
      operationId: getMarketFundingArb
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: notional
          in: query
          description: Quote-currency size to hold on each leg (default 10000)
          schema: { type: number, example: 10000 }
        - name: holdHours
          in: query
          description: How long to hold for the horizon payout (default 24)
          schema: { type: number, example: 24 }
        - name: feeBinancePct
          in: query
          description: Binance taker fee percent (default paper 0.10)
          schema: { type: number, example: 0.1 }
        - name: feeBybitPct
          in: query
          description: Bybit taker fee percent (default paper 0.10)
          schema: { type: number, example: 0.1 }
      responses:
        '200':
          description: Long/short venues and sized after-fee funding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketFundingArb'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/funding-arb/scan:
    get:
      summary: Rank coins by after-fee funding spread
      description: |
        Walks top 24h-volume USDT pairs and returns **only after-fee winners**
        (published settlements in `holdHours` beat round-trip taker fees).
        Same fee and size params as `/api/v1/market/funding-arb`. Informational only.
      operationId: scanMarketFundingArb
      tags: [Market]
      parameters:
        - name: notional
          in: query
          schema: { type: number, example: 10000 }
        - name: holdHours
          in: query
          schema: { type: number, example: 24 }
        - name: feeBinancePct
          in: query
          schema: { type: number }
        - name: feeBybitPct
          in: query
          schema: { type: number }
        - name: quote
          in: query
          schema: { type: string, default: USDT }
        - name: limit
          in: query
          description: How many top-volume coins to scan (default 15, max 40)
          schema: { type: integer, default: 15, minimum: 1, maximum: 40 }
      responses:
        '200':
          description: Ranked funding-arb hits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketFundingArbScan'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/funding-arb/history:
    get:
      summary: Past after-fee funding stretches for one coin
      description: |
        Settled Binance USD-M and Bybit linear funding prints in `[from, to]`.
        Groups consecutive prints with the same long/short pair into a run and
        lists a run only when settled funding minus round-trip taker fees is
        positive. The first clock of a run is the entry signal — that payment
        is not collected (the position was not open before it). A run that
        starts and ends on the same clock is not profit. A direction flip at
        settlement still pays the old sides, then starts a new run. `from`/`to`
        are RFC3339, YYYY-MM-DD (UTC), or unix ms. Max 30 days. Informational only.
      operationId: getMarketFundingArbHistory
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: from
          in: query
          required: true
          schema: { type: string, example: "2026-08-01" }
        - name: to
          in: query
          required: true
          schema: { type: string, example: "2026-08-08" }
        - name: notional
          in: query
          schema: { type: number, example: 10000 }
        - name: feeBinancePct
          in: query
          schema: { type: number }
        - name: feeBybitPct
          in: query
          schema: { type: number }
      responses:
        '200':
          description: After-fee winning stretches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketFundingArbHistory'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/funding-arb/watches:
    post:
      summary: Follow a funding-arb opportunity
      description: |
        Omit `symbol` (or set `scan` / `*`) to follow the funding-arb scan:
        every liquid coin is re-quoted on a background interval. When a coin's
        after-fee net first reaches `minProfit`, opens a signal and enqueues
        the client's alert webhook (`type=funding_arb.triggered`). Same coin
        plus same long/short while still above the floor does not re-notify.
        After net falls below the floor the signal closes; a later re-cross
        notifies again. A coin missing from the volume-limited scan is
        re-quoted on its own and closed only when net is really below the
        floor. A direction flip closes the old signal and opens a new one.
        Optional `symbol` follows one pair only. Pause/resume and PATCH
        settings without deleting. One scan follow per client. Max 20
        watches per client. Informational only.
      operationId: createFundingArbWatch
      tags: [FundingArb]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minProfit]
              properties:
                clientId: { type: string }
                symbol:
                  type: string
                  description: Pair to follow, or omit / scan / * for the full scan
                  example: BTCUSDT
                quote: { type: string, example: USDT }
                limit: { type: integer, example: 15 }
                notional: { type: number, example: 10000 }
                holdHours: { type: number, example: 24 }
                durationHours:
                  type: number
                  description: How long the follow should run from now. Omit or 0 to keep running.
                  example: 48
                minProfit:
                  type: number
                  exclusiveMinimum: 0
                  description: Minimum after-fee profit in quote currency
                  example: 10
                feeBinancePct: { type: number, minimum: 0, example: 0.1 }
                feeBybitPct: { type: number, minimum: 0, example: 0.1 }
      responses:
        '201':
          description: Created watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingArbWatch'
        '400':
          $ref: '#/components/responses/Error'
    get:
      summary: List funding-arb follow watches
      operationId: listFundingArbWatches
      tags: [FundingArb]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Watch list
          content:
            application/json:
              schema:
                type: object
                properties:
                  watches:
                    type: array
                    items: { $ref: '#/components/schemas/FundingArbWatch' }
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/funding-arb/watches/{id}:
    get:
      summary: Get a funding-arb follow watch
      operationId: getFundingArbWatch
      tags: [FundingArb]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingArbWatch'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      summary: Update funding-arb follow settings
      description: Change minProfit, notional, holdHours, fees, or scan size. Does not delete signals.
      operationId: updateFundingArbWatch
      tags: [FundingArb]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string }
                minProfit: { type: number, exclusiveMinimum: 0 }
                notional: { type: number }
                holdHours: { type: number }
                durationHours:
                  type: number
                  description: Reset how long the follow should run from now. 0 clears the end time.
                quote: { type: string }
                limit: { type: integer }
                feeBinancePct: { type: number, minimum: 0 }
                feeBybitPct: { type: number, minimum: 0 }
      responses:
        '200':
          description: Updated watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingArbWatch'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete a funding-arb follow watch
      description: Removes the watch and its signals.
      operationId: deleteFundingArbWatch
      tags: [FundingArb]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/funding-arb/watches/{id}/pause:
    post:
      summary: Pause a funding-arb follow
      description: Stops evaluation without deleting the watch or its signals.
      operationId: pauseFundingArbWatch
      tags: [FundingArb]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Paused watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingArbWatch'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/funding-arb/watches/{id}/resume:
    post:
      summary: Resume a funding-arb follow
      operationId: resumeFundingArbWatch
      tags: [FundingArb]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Active watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingArbWatch'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/funding-arb/signals:
    get:
      summary: List funding-arb min-profit crossings
      operationId: listFundingArbSignals
      tags: [FundingArb]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [open, closed, all] }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Signal list
          content:
            application/json:
              schema:
                type: object
                properties:
                  signals:
                    type: array
                    items: { $ref: '#/components/schemas/FundingArbSignal' }
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/long-short-ratio:
    get:
      summary: Long/short account ratio and recent history
      description: |
        Share of **accounts** that are long vs short (not position size) on
        **Binance USD-M** (`globalLongShortAccountRatio`) and **Bybit linear**
        (`/v5/market/account-ratio`). 5-minute samples. `ratio` is long/short
        (1 = even). `bias` is `long` if ratio ≥ 1.05, `short` if ≤ 0.95.
        Combined `exchange=all` does not average venues. `limit` default 24
        (~2 hours). Cached ~30s. Informational only.
      operationId: getMarketLongShortRatio
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all, example: all }
        - name: limit
          in: query
          description: History size (1–100, default 24)
          schema: { type: integer, default: 24, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Current long/short ratio and recent 5m history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLongShortRatio'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/futures-history:
    get:
      summary: Durable futures history
      description: |
        Stored open interest, funding, long/short, or liquidation rows for
        Binance USD-M and Bybit linear. Written on a background interval and
        (for liquidations) as events arrive. Duplicates are ignored. One venue
        failing does not drop the other. Survives process restarts.
      operationId: getMarketFuturesHistory
      tags: [Market]
      parameters:
        - name: metric
          in: query
          required: true
          schema: { type: string, enum: [open_interest, funding, long_short, liquidations] }
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          schema: { type: string, default: all }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 200, maximum: 1000 }
      responses:
        '200':
          description: Stored rows newest first
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/basis:
    get:
      summary: Futures vs spot basis (premium or discount)
      description: |
        How far the perpetual is from spot/index on Binance USD-M and Bybit
        linear. Returns the dollar gap, percent gap, premium/discount, whether
        the gap is expanding or shrinking (5m/1h/4h), a short read with funding
        and open interest, and whether both venues agree.
      operationId: getMarketBasis
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both + agreement)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue basis plus optional agreement
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/correlation:
    get:
      summary: Price correlation vs BTC and ETH
      description: |
        How similarly a coin has been moving with **BTC** and **ETH** over the
        last **1 hour, 4 hours, and 24 hours**. Returns Pearson correlation of
        bar returns, beta, same-direction share, and a short note if the coin
        has been following with a delay. Default venue is Binance spot.
      operationId: getMarketCorrelation
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: SOLUSDT }
        - name: exchange
          in: query
          description: binance | bybit | coinbase (default binance)
          schema: { type: string, default: binance }
      responses:
        '200':
          description: Per-window correlation vs BTC and ETH
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/breadth:
    get:
      summary: Market breadth (how many coins are up or down)
      description: |
        Counts how many of the liquid spot coins we follow are **up** vs
        **down** over the last **1 hour, 4 hours, and 24 hours** (number and
        percent). Also says whether BTC and ETH are moving with the rest of
        the market or a few large coins are carrying it.
      operationId: getMarketBreadth
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          description: binance | bybit | coinbase (default binance)
          schema: { type: string, default: binance }
        - name: limit
          in: query
          description: How many liquid coins to include (default 80, max 150)
          schema: { type: integer, default: 80 }
      responses:
        '200':
          description: Per-window up/down counts plus BTC/ETH read
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/volatility:
    get:
      summary: Price volatility vs recent history and BTC/ETH
      description: |
        How much a coin moved over the last **1 hour, 4 hours, and 24 hours**:
        net change, high–low range (even if price came back), whether that
        range is higher or lower than normal and expanding or shrinking, and
        whether the coin is more volatile or calmer than BTC and ETH.
      operationId: getMarketVolatility
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: SOLUSDT }
        - name: exchange
          in: query
          description: binance | bybit | coinbase (default binance)
          schema: { type: string, default: binance }
      responses:
        '200':
          description: Per-window volatility vs history and BTC/ETH
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/snapshot:
    get:
      summary: Combined tape snapshot (price, volume, OI, funding, LS, taker)
      description: |
        Current **price, volume, market cap, open interest, funding,
        long/short, and taker buy/sell** for one coin, plus how each changed
        over the last **1 hour, 4 hours, and 24 hours**. Useful when volume
        or OI start to build before price moves. `exchange=all` returns
        Binance and Bybit futures tapes separately (never averaged for the
        lead read).
      operationId: getMarketSnapshot
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: SOLUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Combined snapshot
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/levels:
    get:
      summary: Support and resistance areas
      description: |
        Finds **support** and **resistance** from recent price swings and
        volume, then checks the live order book for buy/sell liquidity around
        each area. Each zone includes distance from last price, how many times
        it was tested, and nearby bid/ask notional. When price is close to or
        through a zone, a **breakout score** uses volume, book thickness, and
        taker buy/sell.
      operationId: getMarketLevels
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | coinbase (default binance)
          schema: { type: string, default: binance }
      responses:
        '200':
          description: Support and resistance zones plus optional breakout
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/whales:
    get:
      summary: Large trades and liquidations
      description: |
        Clusters recent aggressive futures **buys** and **sells** (taker long /
        short) and large **liquidations**, then sorts them biggest first.
        Each event includes average price, first/last trade time, total size,
        and whether the notional is large versus circulating market cap
        (small-cap coins with huge prints are flagged). Omit `symbol` to scan
        the top liquid USDT pairs. Tape is the newest ~1000 prints per coin
        (minutes, not 24h). Informational only.
      operationId: getMarketWhales
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: false
          description: Pair e.g. BTCUSDT. Omit to scan top liquid USDT coins.
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all }
        - name: minNotional
          in: query
          description: Minimum USD size (default 100000, clamp 10000–10000000)
          schema: { type: number, default: 100000 }
        - name: limit
          in: query
          description: Max events (default 30, max 100)
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: Whale prints and liquidations, biggest first
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/taker-flow:
    get:
      summary: Futures taker buy vs sell volume
      description: |
        Aggressive (taker) buy and sell volume on Binance USD-M and Bybit
        linear for the last **5 minutes, 1 hour, and 4 hours**. Returns buy
        notional, sell notional, delta, and a short read with price / OI /
        funding. This is who is hitting the book now — not the account
        long/short ratio. `exchange=all` adds a combined view.
      operationId: getMarketTakerFlow
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both + combined)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue and optional combined taker flow
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/cvd:
    get:
      summary: Cumulative volume delta versus price
      description: |
        **CVD** is the running sum of aggressive futures **market-buy**
        notional minus **market-sell** notional. Each 5-minute point includes
        price, `priceChangePct`, `vsPrice`, and `divergence`
        (`price_up_cvd_down` / `price_down_cvd_up`) so you can see when
        price and flow disagree. Divergence includes how long the split
        has been running and how far price and CVD moved. **15m / 1h /
        4h / 24h** windows show CVD change (not only the latest total)
        and label `confirms`, `opposite`, or `absorption`. `exchange=all`
        (default) returns Binance and Bybit separately plus a combined
        series. Combined uses the overlapping **time range** (a missing
        5m slot is 0) and is `complete` when both venues are. Combined
        `venueSplit` flags Binance CVD up / Bybit down (or the reverse).
        `venues` / `combined` are futures; `spotVenues` / `spotCombined`
        are spot. `spotFutures` flags when spot CVD and futures CVD
        disagree. Informational only.
      operationId: getMarketCVD
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both + combined)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue and optional combined CVD vs price
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/volume-surge:
    get:
      summary: Volume versus typical (5m / 15m / 1h)
      description: |
        How much **higher** this coin's quote volume is than **its own
        typical** (median of the prior ~24 hours) over **5 minutes**,
        **15 minutes**, and **1 hour**. Buy and sell are split when the
        venue publishes taker-buy (Binance klines; Bybit is total-only)
        so a spike can be one-sided. `ratio` is current / typical.
        `grade` is typical / elevated / high / extreme. Informational only.
      operationId: getMarketVolumeSurge
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue current vs typical volume
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/volume-surge/scan:
    get:
      summary: Coins with much more volume than typical
      description: |
        Scans top 24h-volume pairs and ranks those whose latest 5m / 15m
        / 1h volume is at least `minRatio` times their own typical
        (default 2x). Use this to see **which coins** are running hot.
        Default venue is Binance (buy/sell split). Informational only.
      operationId: scanMarketVolumeSurges
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          description: binance | bybit | all (default binance)
          schema: { type: string, default: binance }
        - name: quote
          in: query
          schema: { type: string, default: USDT }
        - name: minRatio
          in: query
          description: Minimum current/typical (default 2)
          schema: { type: number, default: 2 }
        - name: limit
          in: query
          description: How many top-volume coins to scan (default 30, max 50)
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: Ranked volume-surge hits
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidity-sweeps:
    get:
      summary: Liquidity sweeps (poke through a prior high or low)
      description: |
        A **liquidity sweep** is when price pokes a little **through a
        prior high or low** that had already turned it back, then comes
        back. Each sweep names the **level**, how far price went through
        (`excursion` / `excursionPct`), how long it stayed beyond
        (`duration`), and **quote volume** (buy/sell when the venue
        publishes taker-buy) during that poke. `tests` is how many times
        the level turned price before the sweep. `status` is `swept`
        (back) or `open` (still beyond). 15-minute spot candles, last
        ~7 days. A poke that stays through for more than 2 hours is a
        breakout, not a sweep. `exchange=all` (default) returns Binance
        and Bybit separately. Informational only.
      operationId: getMarketLiquiditySweeps
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue liquidity sweeps
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/absorption:
    get:
      summary: Absorption (large flow, little price)
      description: |
        Detects **absorption**: large aggressive **market buys or sells**
        while price barely moves — someone on the other side is taking
        the flow. Each 15m / 1h / 4h / 24h window (and each 5-minute bar)
        shows buy/sell notional, price change, which side is absorbing
        (`bid` = bids absorbing sells, `ask` = asks absorbing buys),
        `result` (`held` or `pushed` against the aggressive side), and a
        0–100 `score` / `grade`. `current` is the latest consecutive run.
        `exchange=all` (default) returns Binance and Bybit plus combined.
        `venues` / `combined` are futures; `spotVenues` / `spotCombined`
        are spot. Informational only.
      operationId: getMarketAbsorption
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both + combined)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue and optional combined absorption vs price
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/around:
    get:
      summary: What happened around a time (before / during / after)
      description: |
        Pick a coin and a time to see **what changed around that move**.
        Returns three adjacent windows: **before** (`window` ending at `at`),
        **during** (the move starting at `at`, default 15 minutes), and
        **after** (the same `window` after the move). Each phase has price
        (OHLC + %), quote volume, buy/sell when known, VWAP, volume versus
        that coin's own typical, and a compact volume-profile POC / value
        area. Liquidity sweeps that poked in the span are attached.
        Stored order-book and futures history (OI, funding, long/short,
        liquidations) are included when those archives have a sample.
        `exchange=all` (default) returns Binance and Bybit separately plus
        `combined`. Informational only.
      operationId: getMarketAround
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: at
          in: query
          required: true
          description: Event time (RFC3339 or unix ms) — start of the during window
          schema: { type: string, example: "2026-08-20T14:00:00Z" }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both + combined)
          schema: { type: string, default: all }
        - name: window
          in: query
          description: Before/after lookback — 15m | 30m | 1h | 2h | 4h (default 1h)
          schema: { type: string, default: "1h" }
        - name: during
          in: query
          description: Move window starting at `at` — 5m | 15m | 30m | 1h (default 15m)
          schema: { type: string, default: "15m" }
      responses:
        '200':
          description: Before / during / after tape
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/around/compare:
    get:
      summary: Compare two times (two moves of the same coin)
      description: |
        Pick a coin and **two event times** to see how those moves
        differed. Each time is an around-the-move tape (before / during /
        after). The response includes both tapes plus deltas for **price
        level**, the **move** (net %, range, volume, vs typical, takers,
        POC), **order-book** mid and liquidity, and **futures** (OI,
        funding, long %, liquidations) when those archives have samples.
        `from` and `to` are the two event times (RFC3339 or unix ms);
        they do not have to be in chronological order. Same `window` /
        `during` as `/around`. Informational only.
      operationId: compareMarketAround
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: from
          in: query
          required: true
          description: First event time (RFC3339 or unix ms)
          schema: { type: string, example: "2026-08-20T12:00:00Z" }
        - name: to
          in: query
          required: true
          description: Second event time (RFC3339 or unix ms)
          schema: { type: string, example: "2026-08-20T16:00:00Z" }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both + combined)
          schema: { type: string, default: all }
        - name: window
          in: query
          description: Before/after lookback — 15m | 30m | 1h | 2h | 4h (default 1h)
          schema: { type: string, default: "1h" }
        - name: during
          in: query
          description: Move window starting at each time — 5m | 15m | 30m | 1h (default 15m)
          schema: { type: string, default: "15m" }
      responses:
        '200':
          description: Two-move comparison
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/around/moves:
    get:
      summary: Important moves and what happened during them
      description: |
        Finds the strongest **up and down legs** in a coin's recent
        history, then attaches the around-the-move tape (price, volume,
        VWAP, vs typical, POC, sweeps, stored book/futures) for each one.
        Legs are same-direction stretches of 15m or 1h candles, ranked
        by |return|. Default lookback **24h**, default floor **1.5%**
        (15m) or **2.5%** (1h). `direction` is `up`, `down`, or `both`.
        Informational only.
      operationId: findMarketAroundMoves
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all }
        - name: lookback
          in: query
          description: 4h | 12h | 24h | 3d | 7d (default 24h)
          schema: { type: string, default: "24h" }
        - name: interval
          in: query
          description: 15m | 1h (default 15m)
          schema: { type: string, default: "15m" }
        - name: direction
          in: query
          description: up | down | both (default both)
          schema: { type: string, default: both }
        - name: minReturnPct
          in: query
          description: Minimum |return| percent (default 1.5 on 15m, 2.5 on 1h)
          schema: { type: number }
        - name: limit
          in: query
          description: How many moves to keep (default 8, max 15)
          schema: { type: integer, default: 8 }
        - name: window
          in: query
          description: Around lookback 15m | 30m | 1h | 2h | 4h (default 1h)
          schema: { type: string, default: "1h" }
        - name: during
          in: query
          description: Override move window 5m | 15m | 30m | 1h (default from the leg)
          schema: { type: string }
      responses:
        '200':
          description: Ranked important moves with around-the-move tapes
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/around/precursors:
    get:
      summary: Common tape before important moves
      description: |
        Scans historical candles for strong **up and down** legs, then
        compares the market tape in the window **before** each move
        (volume vs typical, takers, price, OI, book, sweeps). Returns
        singles and **combos** — conditions that fired **together** in
        the same before-window. Combos report how often they showed up
        before increases vs drops (`lean`). `common` is the **overall**
        hit rate (not one side only) — at least **60%** of all sampled
        before-windows with **3+** samples. Default lookback **7d**.
        Informational only.
      operationId: findMarketAroundPrecursors
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all }
        - name: lookback
          in: query
          description: 4h | 12h | 24h | 3d | 7d (default 7d)
          schema: { type: string, default: "7d" }
        - name: interval
          in: query
          description: 15m | 1h (default 15m)
          schema: { type: string, default: "15m" }
        - name: direction
          in: query
          description: up | down | both (default both)
          schema: { type: string, default: both }
        - name: minReturnPct
          in: query
          description: Minimum |return| percent (default 1.5 on 15m)
          schema: { type: number }
        - name: limit
          in: query
          description: How many moves to scan (default 15)
          schema: { type: integer, default: 15 }
        - name: window
          in: query
          description: Before-window length 15m | 30m | 1h | 2h | 4h (default 1h)
          schema: { type: string, default: "1h" }
        - name: during
          in: query
          description: Override move window 5m | 15m | 30m | 1h
          schema: { type: string }
      responses:
        '200':
          description: Common before-move patterns
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/around/similar:
    get:
      summary: Past important moves similar to the current tape
      description: |
        Compares the **current** market (last `window`, default 1h) to the
        setup **before** past important moves — volume vs typical, order
        book, open interest, takers, and price. `fields` selects which
        pieces to use (e.g. `volume,book,oi` skips price). `weights` sets
        importance (`book:3,oi:3,volume:1`; defaults book and OI 3, takers
        1.5, volume and price 1). Uncompared fields have no score.
        Similarity uses only fields that actually had data. `minCoverage`
        (default 60) sends cases that lack enough selected data to
        `skipped` (with `missing` and `coverage`), not `matches`.
        Two matches are one past event only when their **price-move
        ranges overlap**. Shared setup windows do not merge different
        moves.
        Each past match uses only tape available before that move
        (`dataFrom` / `dataTo`). `horizons` picks the after-windows
        (default `15m,1h,4h`; e.g. `5m,30m,2h`). Each horizon is
        measured on matching candle size (5m uses 5m bars) and reports
        up/down, average, median, `sample`, plus the same stats in
        similarity bands 40–60 / 60–80 / 80–100. A case is left out of
        a horizon when that tape is not long enough. Default lookback
        **7d**. Informational only.
      operationId: findMarketAroundSimilar
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all }
        - name: lookback
          in: query
          description: 4h | 12h | 24h | 3d | 7d (default 7d)
          schema: { type: string, default: "7d" }
        - name: interval
          in: query
          description: 15m | 1h (default 15m)
          schema: { type: string, default: "15m" }
        - name: direction
          in: query
          description: up | down | both (default both)
          schema: { type: string, default: both }
        - name: minReturnPct
          in: query
          description: Minimum |return| percent for past moves
          schema: { type: number }
        - name: limit
          in: query
          description: How many nearest cases (default 5, max 10)
          schema: { type: integer, default: 5 }
        - name: window
          in: query
          description: Current/before window 15m | 30m | 1h | 2h | 4h (default 1h)
          schema: { type: string, default: "1h" }
        - name: during
          in: query
          description: Override past move window
          schema: { type: string }
        - name: fields
          in: query
          description: Tape to compare — price,volume,takers,oi,book (default all). Example volume,book,oi
          schema: { type: string, example: "volume,book,oi" }
        - name: weights
          in: query
          description: Importance per field — book:3,oi:3,volume:1 (defaults book and oi 3, takers 1.5, volume and price 1)
          schema: { type: string, example: "book:3,oi:3,volume:1" }
        - name: minCoverage
          in: query
          description: Minimum percent of selected data that must be present (default 60). Below that goes to skipped. 0 disables the floor.
          schema: { type: number, default: 60, minimum: 0, maximum: 100 }
        - name: horizons
          in: query
          description: After-windows CSV (default 15m,1h,4h). Example 5m,30m,2h. Matching candle size; each reports avg, median, up, down, sample, and similarity bands.
          schema: { type: string, example: "30m,2h,6h" }
      responses:
        '200':
          description: Similar past setups, afterHorizons, thin coverage in skipped
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/vwap:
    get:
      summary: Volume-weighted average price
      description: |
        **VWAP** from a start time (or named `window`) until now.
        Each candle's typical price (high+low+close)/3 is weighted by
        **quote volume**, so prices with more trading pull the average
        more. Returns `vwap`, last vs VWAP (`distance`, `distancePct`,
        `side`), and total volume. `exchange=all` (default) returns
        Binance and Bybit separately plus `combined` (volume-weighted
        across both). Use `window` (`1h` / `4h` / `24h` / `7d` / `30d`,
        default `24h`) or `startTime` (+ optional `endTime`).
        Informational only.
      operationId: getMarketVWAP
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both + combined)
          schema: { type: string, default: all }
        - name: window
          in: query
          description: 1h | 4h | 24h | 7d | 30d (default 24h). Ignored when startTime is set.
          schema: { type: string, default: "24h" }
        - name: startTime
          in: query
          description: Range start (RFC3339 or unix ms)
          schema: { type: string }
        - name: endTime
          in: query
          description: Range end (RFC3339 or unix ms). Default now.
          schema: { type: string }
      responses:
        '200':
          description: Per-venue and optional combined VWAP
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/volume-profile:
    get:
      summary: Volume profile (volume by price)
      description: |
        **Volume profile** shows **where** trading happened by **price**
        over a time range you choose — not just how much traded over time.
        Each row is quote (USDT) volume in a price band, with **buy** and
        **sell** when the venue publishes taker-buy (Binance klines; Bybit
        is total-only). `poc` is the price with the most volume. `valueArea`
        is the contiguous block around the POC that holds about **70%** of
        volume. `exchange=all` (default) returns Binance and Bybit separately
        plus `combined`. Combined adds both venues at the same price levels.
        Use `window` (`1h` / `4h` / `24h` / `7d` / `30d`, default `24h`) or
        `startTime` + `endTime`. Optional `tickSize` sets the row width.
        Built from spot candles (volume spread across each bar's high–low),
        not individual prints. Informational only.
      operationId: getMarketVolumeProfile
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both + combined)
          schema: { type: string, default: all }
        - name: window
          in: query
          description: 1h | 4h | 24h | 7d | 30d (default 24h). Ignored when startTime/endTime are set.
          schema: { type: string, default: "24h" }
        - name: startTime
          in: query
          description: Range start (RFC3339 or unix ms)
          schema: { type: string }
        - name: endTime
          in: query
          description: Range end (RFC3339 or unix ms)
          schema: { type: string }
        - name: tickSize
          in: query
          description: Price row width (e.g. 50). Omit to pick one automatically.
          schema: { type: number, example: 50 }
      responses:
        '200':
          description: Per-venue and optional combined volume profile
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/venue-divergence:
    get:
      summary: Binance vs Bybit signal split
      description: |
        Compares **Binance USD-M** and **Bybit linear** for one coin using
        open-interest change, funding payer, account long/short crowding, and
        price+OI positioning. Returns `same`, `opposite`, or `mixed`, lists
        which metrics differ, and a short note on why a split can matter.
        Informational only.
      operationId: getMarketVenueDivergence
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
      responses:
        '200':
          description: Venue comparison
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/positioning:
    get:
      summary: Price and open-interest positioning
      description: |
        Classifies **long buildup**, **short buildup**, **long unwinding**, or
        **short covering** from price change vs open-interest change (classic
        futures matrix) on Binance USD-M and Bybit linear. Short summary and
        reasons use funding and account long/short as corroboration. When
        `exchange=all`, also returns a **combined** general market direction
        (OI-weighted). Informational only — not financial advice.
      operationId: getMarketPositioning
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both + combined)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue and optional combined positioning
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/squeeze-risk:
    get:
      summary: Long and short squeeze risk
      description: |
        Scores **long-squeeze** and **short-squeeze** risk (0–100) for a coin
        on **Binance USD-M** and **Bybit linear** separately, and (when
        `exchange=all`) an **OI-weighted combined** view. Drivers: account
        long/short crowding, funding, open-interest build, recent liquidation
        heat, and nearby high-leverage pockets. Explains which side is crowded
        and why risk is high or low. Model only — not a prediction or financial
        advice.
      operationId: getMarketSqueezeRisk
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both + combined)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue and optional combined squeeze risk
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidation-hunt:
    get:
      summary: Hypothetical liquidation hunt (per venue)
      description: |
        **Hypothetical model only** — not evidence that any exchange moves
        price, and not financial advice.

        For Binance USD-M and Bybit linear separately: estimate where long/short
        liquidation pressure sits if price moves up or down, how much **spot**
        buying or selling the visible book needs to reach those areas, and a
        rough desk result (unwind on the current opposite side vs assuming
        part of estimated liquidations become exit flow). Also scores which
        direction looks easier or more likely (`upScore` / `downScore` plus
        `bias`) from zone distance, visible book cost, price+OI trend,
        crowding/funding, and recent taker / liquidation flow. `upCascade` /
        `downCascade` list zones in price order and whether earlier estimated
        liquidations cheapen the next hop. Uses live spot book, open interest,
        account long/short (blended toward 50/50), funding, and recent
        liquidation prints. Leverage mix is assumed. Direction scores and
        cascade paths do not change the zone or P&L numbers.
      operationId: getMarketLiquidationHunt
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both, never averaged)
          schema: { type: string, default: all }
        - name: weightProximity
          in: query
          description: Custom mix percent for distance to zone. If any weight* is sent, omitted factors are 0 and the six must sum to 100. Percents stay as given — a missing factor keeps its percent and adds 0 (neutral 50); remaining factors are not increased.
          schema: { type: number }
        - name: weightBook
          in: query
          schema: { type: number }
        - name: weightEfficiency
          in: query
          schema: { type: number }
        - name: weightTrend
          in: query
          schema: { type: number }
        - name: weightCrowding
          in: query
          schema: { type: number }
        - name: weightFlow
          in: query
          schema: { type: number }
      responses:
        '200':
          description: Per-venue hunt report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidationHunt'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidation-max-pain:
    get:
      summary: Largest liquidation pockets above and below last price
      description: |
        CoinGlass-style **max pain** for one coin: the price with the biggest
        estimated liquidation size above last (shorts) and below last (longs).
        This is **not** the hunt target (which also weighs spot-walk cost).
        Size is modeled OI at an assumed leverage mix plus 24h observed
        clusters. Venues stay separate; report-level above/below is the single
        largest pocket on that side (prices are never averaged).
      operationId: getMarketLiquidationMaxPain
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both, never averaged)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Per-venue max-pain pockets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidationMaxPain'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidation-hunt/heatmap:
    get:
      summary: Liquidation intensity heatmap (price × time)
      description: |
        CoinGlass-style grid of estimated liquidation intensity at each price
        for each time column. Built from historical open interest, mark price,
        the hunt leverage mix (tilted by funding), blended account long/short,
        and observed liquidation prints in that column.

        `range` is 12h, 24h, 3d, or 7d. Binance and Bybit are modeled
        separately and each venue uses only its own candles (never the
        other exchange's price). `combined` is the sum of their cells.
        `review` scores whether later price reached the hot zones within
        1h / 4h / 12h, time-to-hit, hit rate / false signals, and whether
        observed liquidations in that zone rose. Not a live book and not
        financial advice.
      operationId: getMarketLiquidationHuntHeatmap
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: range
          in: query
          description: 12h | 24h | 3d | 7d
          schema: { type: string, default: 24h, enum: [12h, 24h, 3d, 7d] }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = both + combined)
          schema: { type: string, default: all }
      responses:
        '200':
          description: Price × time intensity grids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidationHuntHeatmap'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidation-levels:
    get:
      summary: Liquidation level bar chart
      description: |
        CoinGlass-style **liquidation map** as bars.

        - `symbol=BTCUSDT` (or ETHUSDT, …): estimated **price levels** —
          long/short notional at each price bin (hunt model summed over `range`).
        - `symbol=all`: **total** observed liquidations for every tracked coin
          as time bars (last 24h max). `exchange=binance|bybit|all`.

        Informational only.
      operationId: getMarketLiquidationLevels
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          description: Pair (BTCUSDT) or all
          schema: { type: string, default: all, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all = combined)
          schema: { type: string, default: all, example: all }
        - name: range
          in: query
          description: 12h | 24h | 3d | 7d (totals clamp to 24h)
          schema: { type: string, default: 24h, enum: [12h, 24h, 3d, 7d] }
      responses:
        '200':
          description: Price-level bars or time-total bars
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLiquidationLevels'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidation-cascade:
    get:
      summary: Liquidation cascade risk (one coin or whole market)
      description: |
        Detects a **liquidation cascade**: a short burst of long or short
        liquidations far above that stream's own typical rate.

        Compares the last **1 minute**, **5 minutes**, and **15 minutes** to
        the median of prior blocks over ~6 hours. `grade` is quiet / elevated
        / cascade / extreme. Binance and Bybit are scored **separately**.
        `both.agree` is true only when the **same side** is cascading on both
        venues. `episodes` lists each wave in the last 24h (start, duration,
        long/short notional, price move). Overlapping same-side waves on both
        venues are one `combined` episode. `symbol=all` pools every tracked
        coin (market-wide risk; no price). Informational only.
      operationId: getMarketLiquidationCascade
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          description: Pair (BTCUSDT) or all for the pooled market
          schema: { type: string, default: all, example: BTCUSDT }
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all, example: all }
      responses:
        '200':
          description: Per-venue cascade scores plus both-venues flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLiquidationCascade'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/liquidation-cascade/scan:
    get:
      summary: Market liquidation cascade scan
      description: |
        Scores **market-wide** cascade risk (pooled liquidations) and ranks
        coins that are currently elevated or cascading. Binance and Bybit stay
        separate; a hit's `both` flag means the same side is cascading on both
        venues. Informational only.
      operationId: scanMarketLiquidationCascades
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          description: binance | bybit | all (default all)
          schema: { type: string, default: all, example: all }
      responses:
        '200':
          description: Market cascade plus ranked bursting coins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLiquidationCascadeScan'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/supply:
    get:
      summary: Asset circulating / total / max supply (Binance)
      description: |
        Supply metrics from the Binance marketing symbol list snapshot (cache-only
        on the request path). Accepts base asset (`BTC`) or a pair (`BTCUSDT`);
        USD-stable quote suffixes are stripped for convenience. `maxSupply` is null
        when Binance does not publish a hard cap.
      operationId: getSupply
      tags: [Market]
      parameters:
        - name: asset
          in: query
          required: false
          description: Base asset ticker (preferred). Provide asset or symbol (at least one required).
          schema:
            type: string
            example: BTC
        - name: symbol
          in: query
          required: false
          description: Alias for asset; may be a pair like BTCUSDT. Provide asset or symbol (at least one required).
          schema:
            type: string
            example: BTCUSDT
      responses:
        '200':
          description: Supply snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supply'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/asset-profile:
    get:
      summary: Logo, listing date, and published contracts
      description: |
        Identity for a crypto base asset. Logo is CoinMarketCap's public static
        icon from the Binance marketing `cmcUniqueId`. Listing date and
        contracts come from the same public CMC detail payload as holders when
        published. `404` `catalog_unmapped` when there is no CMC id.
      operationId: getAssetProfile
      tags: [Market]
      parameters:
        - name: asset
          in: query
          schema: { type: string, example: BTC }
        - name: symbol
          in: query
          schema: { type: string, example: BTCUSDT }
      responses:
        '200':
          description: Asset identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetProfile'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/holders:
    get:
      summary: Crypto holder count and top wallets
      description: |
        On-chain holder snapshot for a crypto base asset (or pair). Sources are
        tried in order (no paid plans): CoinMarketCap public detail by Binance
        `cmcUniqueId` or marketing `slug`, then Coin Metrics `AdrBalCnt`, then
        GeckoTerminal token info, then Ethplorer ERC-20, then Routescan EVM
        (including Chiliz), then Tronscan TRC-20. UTXO coins such as PIVX may
        fall back to Chainz CryptoID. Cache TTL default 1h; 429 / upstream blips
        may serve last-good with `stale: true`. `404` `catalog_unmapped` /
        `holders_unpublished` only after every source misses. Informational only.
      operationId: getHolders
      tags: [Market]
      parameters:
        - name: asset
          in: query
          required: false
          description: Base asset ticker (preferred). Provide asset or symbol (at least one required).
          schema:
            type: string
            example: BTC
        - name: symbol
          in: query
          required: false
          description: Alias for asset; may be a pair like BTCUSDT. Provide asset or symbol (at least one required).
          schema:
            type: string
            example: BTCUSDT
      responses:
        '200':
          description: Holder snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetHolders'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/market/swing:
    get:
      summary: Analyze one symbol with the swing engine
      description: |
        Closed 4h + 1d candles, Wilder RSI/ADX/ATR, SuperTrend, MACD, volume/BB patterns,
        BTC regime filter, min R:R 1.8 for triggers, ATR+structure stop.
        Informational only — not financial advice.
      operationId: analyzeSwing
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit, nasdaq, bist], default: binance }
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: ETHUSDT }
      responses:
        '200':
          description: Swing decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwingDecision'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/v1/swing/setups:
    get:
      summary: Scan watchlist for swing setups
      operationId: listSwingSetups
      tags: [Scanner]
      parameters:
        - name: X-Client-Id
          in: header
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit, nasdaq, bist] }
        - name: limit
          in: query
          schema: { type: integer, default: 25, maximum: 25 }
      responses:
        '200':
          description: Watchlist scan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwingSetupList'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/market/indicators:
    get:
      summary: RSI and EMA indicators for a symbol
      description: |
        Fetches OHLCV candles from the selected exchange and computes:
        - RSI (Wilder's smoothing, default period 14)
        - EMA (default periods 12 and 26; seed = SMA of first period)
        Informational only - not financial advice.
      operationId: getIndicators
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit, nasdaq, bist], default: binance }
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
        - name: interval
          in: query
          schema: { type: string, default: 1h }
        - name: limit
          in: query
          description: Number of output bars (extra history is fetched for warm-up)
          schema: { type: integer, default: 100, minimum: 1, maximum: 1000 }
        - name: rsiPeriod
          in: query
          schema: { type: integer, default: 14, minimum: 2, maximum: 500 }
        - name: emaPeriods
          in: query
          description: Comma-separated EMA periods
          schema: { type: string, default: "12,26", example: "12,26" }
        - name: endTime
          in: query
          description: Exclusive end of the candle window (RFC3339). Used to page older EMA/RSI bars.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Indicator series
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchange: { type: string }
                  symbol: { type: string }
                  interval: { type: string }
                  rsiPeriod: { type: integer }
                  emaPeriods:
                    type: array
                    items: { type: integer }
                  latest:
                    type: object
                    properties:
                      rsi: { type: number, nullable: true }
                      zone: { type: string, enum: [oversold, neutral, overbought, ''] }
                      ema:
                        type: object
                        additionalProperties: { type: number }
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        openTime: { type: string, format: date-time }
                        close: { type: number }
                        rsi: { type: number, nullable: true }
                        ema:
                          type: object
                          additionalProperties: { type: number }
                  note: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /api/v1/market/pumps:
    get:
      summary: Detect pump/dump events on one symbol
      description: |
        Mechanical threshold detection over OHLCV candles (close-to-close, candle body, or high-from-low).
        Configure minReturnPct, windowBars, interval, lookbackHours or limit, mode, direction, minVolumeRatio.
        Informational only - not financial advice.
      operationId: getPumpEvents
      tags: [Market]
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string }
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit, nasdaq, bist], default: binance }
        - name: interval
          in: query
          schema: { type: string, default: 1h }
        - name: lookbackHours
          in: query
          schema: { type: number }
        - name: limit
          in: query
          schema: { type: integer }
        - name: minReturnPct
          in: query
          schema: { type: number, default: 5 }
        - name: windowBars
          in: query
          schema: { type: integer, default: 1 }
        - name: mode
          in: query
          schema: { type: string, enum: [close_return, candle_body, high_from_low], default: close_return }
        - name: direction
          in: query
          schema: { type: string, enum: [up, down, both], default: up }
        - name: minVolumeRatio
          in: query
          schema: { type: number }
        - name: maxEvents
          in: query
          schema: { type: integer }
        - name: startTime
          in: query
          schema: { type: string, format: date-time }
        - name: endTime
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Pump events for the symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PumpEventsResponse'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /api/v1/market/pumps/scan:
    get:
      summary: Scan top-volume symbols for recent pumps
      description: |
        Scans top quote-volume spot symbols with the same mechanical thresholds as /pumps.
        Omitted optional parameters use documented defaults; the response metadata echoes the
        resolved values (not zeros/empty strings).
        maxTotalEvents caps the aggregate number of events across all hits (not the hit count).
        Informational only - not financial advice.
      operationId: scanPumpEvents
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit, nasdaq, bist], default: binance }
        - name: quote
          in: query
          schema: { type: string, default: USDT }
        - name: interval
          in: query
          schema: { type: string, default: 15m }
        - name: lookbackHours
          in: query
          schema: { type: number, default: 24 }
        - name: minReturnPct
          in: query
          schema: { type: number, default: 8 }
        - name: windowBars
          in: query
          schema: { type: integer, default: 1 }
        - name: mode
          in: query
          schema: { type: string, enum: [close_return, candle_body, high_from_low], default: close_return }
        - name: direction
          in: query
          schema: { type: string, enum: [up, down, both], default: up }
        - name: minVolumeRatio
          in: query
          schema: { type: number }
        - name: symbolLimit
          in: query
          schema: { type: integer, default: 15, maximum: 40 }
        - name: maxTotalEvents
          in: query
          description: Maximum total events across all symbols (default 30). Hits are ranked by |return|; excess events/hits are dropped.
          schema: { type: integer, default: 30, minimum: 1 }
      responses:
        '200':
          description: Ranked pump hits with resolved scan parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PumpScanResponse'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /api/v1/market/indicators/batch:
    post:
      summary: Latest RSI/EMA for many symbols (one exchange)
      description: |
        Computes latest RSI and EMA for up to 50 symbols on a single exchange/interval.
        Per-symbol failures return `error: unavailable` on that item rather than failing the batch.
        Upstream concurrency is bounded process-wide. Informational only - not financial advice.
      operationId: postIndicatorsBatch
      tags: [Market]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbols]
              properties:
                exchange:
                  type: string
                  enum: [binance, coinbase, bybit, nasdaq, bist]
                  default: binance
                interval:
                  type: string
                  default: 1h
                  description: Exchange-specific; use /intervals?exchange=
                symbols:
                  type: array
                  items: { type: string }
                  maxItems: 50
                  example: [BTCUSDT, ETHUSDT]
                rsiPeriod:
                  type: integer
                  default: 14
                  minimum: 2
                  maximum: 500
                emaPeriods:
                  type: string
                  default: "12,26"
                  description: Comma-separated EMA periods
      responses:
        '200':
          description: Per-symbol indicator snapshots
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchange: { type: string }
                  interval: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol: { type: string }
                        rsi: { type: number, nullable: true }
                        ema:
                          type: object
                          additionalProperties: { type: number }
                        error: { type: string, description: Present when symbol failed (redacted) }
                  note: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /api/v1/market/rsi-heatmap:
    get:
      summary: Ranked RSI scatter (CoinGlass-style)
      description: |
        Wilder RSI(14) for the top listed pairs on one venue, ranked left to
        right (market cap by default). Stables (USDC, USDT, …) are omitted.
        One interval (default 1h). Seeded from ~120 closed candles (the
        unfinished venue bar is dropped) so the number tracks TradingView-style
        charts. Cached 60s; default Binance 1h map is warmed in the background.
        Informational only.
      operationId: getRSIHeatmap
      tags: [Market]
      parameters:
        - name: exchange
          in: query
          schema: { type: string, enum: [binance, coinbase, bybit, nasdaq, bist], default: binance }
        - name: quote
          in: query
          schema: { type: string, default: USDT }
        - name: interval
          in: query
          description: Candle interval (default 1h). `intervals` is accepted as an alias (first value).
          schema: { type: string, default: 1h, example: 1h }
        - name: intervals
          in: query
          description: Deprecated alias of interval (first value only)
          schema: { type: string }
        - name: limit
          in: query
          description: How many top pairs to plot (default 100, max 200)
          schema: { type: integer, default: 100, maximum: 200 }
        - name: period
          in: query
          description: Wilder RSI period (default 14)
          schema: { type: integer, default: 14, minimum: 2, maximum: 500 }
        - name: sort
          in: query
          description: How to rank dots left to right
          schema: { type: string, enum: [quoteVolume, marketCapCirculating], default: marketCapCirculating }
      responses:
        '200':
          description: RSI grid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RSIHeatmap'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /api/v1/watchlist:
    get:
      summary: Get watchlist for a client id
      description: |
        Returns the actor's own list, or a list shared with them when `ownerClientId` is set.
        Response includes `role` (owner|viewer|editor) and `ownerClientId`.
      operationId: getWatchlist
      tags: [Watchlist]
      parameters:
        - name: clientId
          in: query
          description: Actor client tenancy key (not the shared name "default")
          schema: { type: string, minLength: 1 }
        - name: ownerClientId
          in: query
          description: List owner when viewing a shared watchlist; omit for own list
          schema: { type: string, minLength: 1 }
        - name: X-Client-Id
          in: header
          description: Preferred alternative to clientId query
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Watchlist with access role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
    put:
      summary: Replace entire watchlist (owner only)
      description: |
        Full replace of items. Editors and viewers receive 403.
        Multi-device: send `baseVersion` from the last GET. Different symbols added on two
        devices auto-merge. Same-symbol delete vs update returns 409 with `conflict` details;
        re-PUT with `baseVersion` = `serverVersion` and your resolved `items` to finish.
        Optional `baseItems` improves 3-way merge accuracy.
      operationId: putWatchlist
      tags: [Watchlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string }
                ownerClientId: { type: string, description: Must be the actor (owner only) }
                baseVersion:
                  type: integer
                  format: int64
                  description: Version from last GET; omit for unconditional write (legacy)
                baseItems:
                  type: array
                  description: Snapshot from last GET (recommended for accurate delete detection)
                  items:
                    type: object
                    properties:
                      exchange: { type: string }
                      symbol: { type: string }
                      note: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [symbol]
                    properties:
                      exchange: { type: string }
                      symbol: { type: string }
                      note: { type: string }
      responses:
        '200':
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          description: Version conflict — resolve and retry
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
                  conflict:
                    $ref: '#/components/schemas/WatchlistSyncConflict'

  /api/v1/alerts/webhook:
    get:
      summary: Get price-alert webhook URL for a client
      operationId: getAlertWebhook
      tags: [Alerts]
      parameters:
        - name: clientId
          in: query
          schema: { type: string, minLength: 1 }
        - name: X-Client-Id
          in: header
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Webhook settings (url may be empty if not configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertWebhook'
        '400':
          $ref: '#/components/responses/Error'
    put:
      summary: Set price-alert webhook URL and notification preferences
      description: |
        Stores an absolute http(s) URL and preferences:
        - deliveryMode immediate (default) or hourly_digest
        - timeZone (IANA) and quietHours local start/end (HH:MM); ranges may cross midnight
        Notifications created during quiet hours wait until quiet hours end.
        Pending deliveries survive restarts and retry on failure.
      operationId: putAlertWebhook
      tags: [Alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                clientId: { type: string }
                url: { type: string, format: uri, example: https://hooks.example.com/swyngora }
                deliveryMode:
                  type: string
                  enum: [immediate, hourly_digest]
                  default: immediate
                timeZone:
                  type: string
                  default: UTC
                  example: Europe/Istanbul
                quietHours:
                  type: object
                  properties:
                    enabled: { type: boolean, default: false }
                    start: { type: string, example: "22:00", description: Local HH:MM }
                    end: { type: string, example: "08:00", description: Local HH:MM; may be earlier than start }
      responses:
        '200':
          description: Saved webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertWebhook'
        '400':
          $ref: '#/components/responses/Error'
    delete:
      summary: Clear price-alert webhook URL
      operationId: deleteAlertWebhook
      tags: [Alerts]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Webhook cleared
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/alerts:
    get:
      summary: List price alerts for a client
      operationId: listPriceAlerts
      tags: [Alerts]
      parameters:
        - name: clientId
          in: query
          schema: { type: string, minLength: 1 }
        - name: X-Client-Id
          in: header
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Alert list
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId: { type: string }
                  count: { type: integer }
                  alerts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PriceAlert'
        '400':
          $ref: '#/components/responses/Error'
    post:
      summary: Create a price or order-book alert
      description: |
        Creates an active alert.
        kind=price (default): last price above/below targetPrice. mode defaults to one_time.
        kind=imbalance: live book imbalance (buy=above, sell=below) vs targetPrice in 0.05–0.95.
        kind=wall: a large bid/ask/any wall appears (targetPrice is optional min share 0–1).
        kind=liquidation_feed: Binance/Bybit liquidation socket down or stalled longer than
        targetPrice seconds (default 300). symbol is ignored. exchange=binance|bybit|all.
        kind=liquidation_cascade: a coin's cascade grade reaches condition (cascade default,
        or extreme/elevated). symbol=BTCUSDT or all. exchange=binance|bybit|all.
        kind=liquidation_notional: a coin's long/short/total notional in window (1m|5m|15m|1h,
        default 5m via window or rangePct minutes) reaches targetPrice USDT. condition=long|short|both.
        Repeating fires once when the wave crosses, stays quiet while that window stays above,
        re-arms when it drops so a new wave can fire. Informational only.
      operationId: createPriceAlert
      tags: [Alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, condition]
              properties:
                clientId: { type: string }
                exchange: { type: string, default: binance, description: Spot venues, or binance|bybit|all for liquidation kinds }
                symbol: { type: string }
                kind: { type: string, enum: [price, imbalance, wall, liquidation_feed, liquidation_cascade, liquidation_notional], default: price }
                condition:
                  type: string
                  description: price/imbalance above|below; wall bid|ask|any; liquidation_cascade cascade|extreme|elevated; liquidation_notional long|short|both
                targetPrice:
                  type: number
                  description: Price target, |imbalance| threshold, wall min share, liquidation_feed min down seconds (0 = 300), or liquidation_notional USDT amount
                window:
                  type: string
                  description: liquidation_notional lookback 1m|5m|15m|1h (default 5m)
                rangePct:
                  type: number
                  description: ±% of mid for live book analysis (0.25–10, default 2; book kinds only)
                mode:
                  type: string
                  enum: [one_time, repeating]
                  description: one_time fires once; repeating fires on each re-cross (default one_time for price, repeating for book)
      responses:
        '201':
          description: Created alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlert'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/alerts/{id}:
    get:
      summary: Get one price alert
      operationId: getPriceAlert
      tags: [Alerts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlert'
        '404':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete a price alert
      operationId: deletePriceAlert
      tags: [Alerts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  id: { type: string }
        '404':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/watchlist/items:
    post:
      summary: Add or update a watchlist item
      description: |
        Owner or editor may add/update symbols. Send `baseVersion` from last GET for multi-device
        safety. Adding a symbol missing on the server auto-merges even if versions differ.
        Conflicting notes on the same symbol return 409.
      operationId: addWatchlistItem
      tags: [Watchlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol]
              properties:
                clientId: { type: string, description: Actor client id }
                ownerClientId: { type: string, description: List owner when mutating a shared list }
                baseVersion: { type: integer, format: int64 }
                exchange: { type: string, default: binance }
                symbol: { type: string }
                note: { type: string }
      responses:
        '200':
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          description: Symbol note conflict with concurrent edit
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
                  conflict:
                    $ref: '#/components/schemas/WatchlistSyncConflict'
    delete:
      summary: Remove a watchlist item
      description: |
        Owner or editor may remove symbols. Send `baseVersion` (query or If-Match).
        If another device changed the same symbol, returns 409 so the user can choose.
      operationId: removeWatchlistItem
      tags: [Watchlist]
      parameters:
        - name: exchange
          in: query
          required: true
          schema: { type: string }
        - name: symbol
          in: query
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: ownerClientId
          in: query
          description: List owner when mutating a shared list
          schema: { type: string }
        - name: baseVersion
          in: query
          schema: { type: integer, format: int64 }
        - name: If-Match
          in: header
          description: Optional alternative to baseVersion (list version)
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          description: Delete vs concurrent update conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
                  conflict:
                    $ref: '#/components/schemas/WatchlistSyncConflict'

  /api/v1/watchlist/shares:
    get:
      summary: List shares granted on the owner's watchlist
      operationId: listWatchlistShares
      tags: [Watchlist]
      parameters:
        - name: clientId
          in: query
          schema: { type: string, minLength: 1 }
        - name: X-Client-Id
          in: header
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Share list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ownerClientId: { type: string }
                  count: { type: integer }
                  shares:
                    type: array
                    items:
                      $ref: '#/components/schemas/WatchlistShare'
        '400':
          $ref: '#/components/responses/Error'
    post:
      summary: Share watchlist with another client (owner only)
      description: |
        Grants viewer (read-only) or editor (add/remove symbols only) access.
        Cannot share with self. Same grantee cannot be shared twice (use PATCH to change role).
        Editors cannot delete the list or change sharing settings.
      operationId: shareWatchlist
      tags: [Watchlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granteeClientId, role]
              properties:
