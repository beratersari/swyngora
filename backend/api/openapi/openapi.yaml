        content:
          application/json:
            schema:
              type: object
              required: [ruleId, symbol, rangeStart, rangeEnd]
              properties:
                clientId: { type: string }
                ruleId: { type: string }
                exchange: { type: string, enum: [binance, coinbase, bybit], default: binance }
                symbol: { type: string }
                rangeStart: { type: string, format: date-time }
                rangeEnd: { type: string, format: date-time }
      responses:
        '202':
          description: Job accepted or existing job returned
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      summary: List scanner backtests
      operationId: listScannerBacktests
      tags: [Scanner]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Backtest list
  /api/v1/scanner/backtests/{id}:
    get:
      summary: Get scanner backtest progress and summary
      operationId: getScannerBacktest
      tags: [Scanner]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Job with progressPct, signalCount, status
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/scanner/backtests/{id}/cancel:
    post:
      summary: Cancel a pending or running backtest
      operationId: cancelScannerBacktest
      tags: [Scanner]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Canceled job
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/scanner/backtests/{id}/signals:
    get:
      summary: List backtest signals with forward returns
      description: |
        Each signal includes signalAt, closePrice, and optional return1d/return5d/return20d
        (percent price change after 1/5/20 calendar days when data exists).
      operationId: listScannerBacktestSignals
      tags: [Scanner]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Signals list
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/export:
    post:
      summary: Start a user data export
      description: |
        Queues an export of the caller's own data as JSON or CSV.
        Sections default to all of: watchlist, shares, alerts, backtests, portfolios.
        Only one pending/running export is allowed per clientId (409 conflict otherwise).
        Jobs run in the background; poll GET /api/v1/export/{id} for progressPct and status.
      operationId: startExport
      tags: [Export]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string }
                format: { type: string, enum: [json, csv], default: json }
                sections:
                  type: array
                  items: { type: string, enum: [watchlist, shares, alerts, backtests, portfolios] }
                  description: Omit for all sections
      responses:
        '202':
          description: Export job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      summary: List export jobs for a client
      operationId: listExports
      tags: [Export]
      parameters:
        - name: clientId
          in: query
          schema: { type: string, minLength: 1 }
        - name: X-Client-Id
          in: header
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Export list
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId: { type: string }
                  count: { type: integer }
                  exports:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExportJob'
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/export/{id}:
    get:
      summary: Get export job status and progress
      operationId: getExport
      tags: [Export]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Job with progressPct, status, downloadUrl when ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/export/{id}/cancel:
    post:
      summary: Cancel a pending or running export
      operationId: cancelExport
      tags: [Export]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Canceled (or already terminal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/export/{id}/download:
    get:
      summary: Download a completed export file
      description: |
        Only the owning clientId may download. Returns 400 if not completed, 404 if expired
        or missing. Files are deleted automatically after EXPORT_FILE_TTL (default 1h).
      operationId: downloadExport
      tags: [Export]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Export file body (JSON or CSV)
          content:
            application/json:
              schema: { type: object }
            text/csv:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/account:
    get:
      summary: Get account close/reopen status for a clientId
      operationId: getAccount
      tags: [Account]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Account status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/account/close:
    post:
      summary: Close account (7-day grace period)
      description: |
        Marks the clientId closed. Product APIs return 403 for that clientId.
        Shared watchlists owned by this client become inaccessible to grantees.
        Data is retained until purgeAt (closedAt + 7 days). Active jobs are canceled.
      operationId: closeAccount
      tags: [Account]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string }
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/account/reopen:
    post:
      summary: Reopen a closed account within the grace period
      operationId: reopenAccount
      tags: [Account]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string }
      responses:
        '200':
          description: Reopened (active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/account/api-keys:
    get:
      summary: List API keys for this account
      description: |
        Named keys for bots/apps. Secrets are never listed. Manage keys with the
        main account (`X-Client-Id` plus optional process `API_AUTH_TOKEN`).
        User-issued keys cannot list or create other keys.
      operationId: listAccountAPIKeys
      tags: [Account]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Key metadata (no secrets)
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId: { type: string }
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountAPIKey'
                  count: { type: integer }
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      summary: Create a named API key
      description: |
        permission=read → GET only. permission=trade → can place/cancel paper trades
        and other mutations except account close and key management.
        The full secret is returned once.
      operationId: createAccountAPIKey
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                clientId: { type: string }
                name: { type: string, example: Trading bot }
                permission: { type: string, enum: [read, trade], default: read }
      responses:
        '201':
          description: Created key including one-time secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAPIKeyCreated'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/account/api-keys/{id}:
    delete:
      summary: Revoke an API key
      description: Immediate; the secret stops working. Idempotent if already revoked.
      operationId: revokeAccountAPIKey
      tags: [Account]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Revoked key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAPIKey'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/import/preview:
    post:
      summary: Upload an export file and get a restore preview
      description: |
        Accepts multipart form field `file` (or raw JSON/CSV body).
        Parses watchlist, shares, alerts, backtests, and paper portfolios; returns counts of valid, invalid,
        willAdd (under merge), and duplicates. Does not apply data until confirm.
        Ownership is always the uploading clientId (file clientId is ignored).
      operationId: previewImport
      tags: [Import]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
        - name: format
          in: query
          schema: { type: string, enum: [json, csv] }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                clientId: { type: string }
                format: { type: string, enum: [json, csv] }
                file: { type: string, format: binary }
          application/json:
            schema: { type: object }
          text/csv:
            schema: { type: string }
      responses:
        '200':
          description: Preview with section counts (status=previewed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/import:
    get:
      summary: List import jobs for a client
      operationId: listImports
      tags: [Import]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Import list
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/import/{id}:
    get:
      summary: Get import job status, progress, and preview counts
      operationId: getImport
      tags: [Import]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Import job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/import/{id}/confirm:
    post:
      summary: Start applying a previewed import
      description: |
        mode=merge adds only missing records (no duplicate symbols/shares/ids).
        mode=replace clears existing section data for the client then imports from the file.
        Only one pending/running import per client (409 otherwise). Runs in the background.
      operationId: confirmImport
      tags: [Import]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                clientId: { type: string }
                mode: { type: string, enum: [merge, replace] }
      responses:
        '202':
          description: Import queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/import/{id}/cancel:
    post:
      summary: Cancel a previewed, pending, or running import
      operationId: cancelImport
      tags: [Import]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/ai/chat:
    post:
      summary: Chat with the multi-agent AI assistant
      description: |
        Proxies to the Python multi-agent service (`AI_SERVICE_URL`).
        Market figures must come from tools on the assistant side.
        Returns 503 when AI is not configured; 502 on upstream failure.
        Informational only - not financial advice.
      operationId: postAiChat
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiChatRequest'
            example:
              message: "What is BTC RSI on binance 1h?"
              sessionId: "mobile-ai-example"
      responses:
        '200':
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiChatResponse'
        '400':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'


components:
  responses:
    Error:
      description: Error payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    RealtimeInfo:
      type: object
      properties:
        path:
          type: string
          example: /api/v1/ws
        protocol:
          type: integer
          example: 1
        maxSymbols:
          type: integer
          example: 100
        auth:
          type: string
        reconnect:
          type: string
        channels:
          type: array
          items: { type: string }
        clientTypes:
          type: array
          items: { type: string }
        serverTypes:
          type: array
          items: { type: string }
        access:
          type: string

    AiChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          description: User message (non-empty after trim)
        sessionId:
          type: string
          description: |
            Optional multi-turn session key. Server defaults to http-default
            when omitted. Clients should send a stable device session id.
    AiChatResponse:
      type: object
      required: [reply, sessionId]
      properties:
        reply:
          type: string
          description: Assistant text
        sessionId:
          type: string
        tools:
          type: array
          items: { type: string }
          description: Tool names invoked during the turn (optional)
        thinking:
          type: array
          items: { type: string }
          description: High-level plan lines (optional)
        note:
          type: string
          description: Disclaimer (e.g. not financial advice)
    CandlesResponse:
      type: object
      properties:
        symbol:
          type: string
        interval:
          type: string
        exchange:
          type: string
        candles:
          type: array
          items:
            $ref: '#/components/schemas/Candle'
    Candle:
      type: object
      properties:
        openTime:
          type: string
          format: date-time
        open:
          type: string
        high:
          type: string
        low:
          type: string
        close:
          type: string
        volume:
          type: string
        closeTime:
          type: string
          format: date-time
        quoteVolume:
          type: string
        tradeCount:
          type: integer
          format: int64
    Ticker24h:
      type: object
      properties:
        exchange:
          type: string
        symbol:
          type: string
        priceChange:
          type: string
        priceChangePercent:
          type: string
        lastPrice:
          type: string
        openPrice:
          type: string
        highPrice:
          type: string
        lowPrice:
          type: string
        volume:
          type: string
          description: Base asset volume (24h)
        quoteVolume:
          type: string
          description: Quote asset volume (24h)
        openTime:
          type: string
          format: date-time
        closeTime:
          type: string
          format: date-time
        tradeCount:
          type: integer
          format: int64
    OrderBookLevel:
      type: object
      properties:
        price: { type: string }
        quantity: { type: string, description: Base size at this grouped price }
        notional: { type: string, description: Quote notional (price * quantity) }
        cumulative: { type: string, description: Running base size from the spread }
        cumulativeNotional: { type: string }
        rawCount: { type: integer, description: Raw venue levels merged into this bucket }
        isWall: { type: boolean, description: Unusually large rest size on this side }
    SpotOrderBook:
      type: object
      properties:
        exchange: { type: string }
        symbol: { type: string }
        lastPrice: { type: string, description: Mid of best bid/ask }
        bestBid: { type: string }
        bestAsk: { type: string }
        spread: { type: string }
        spreadPct: { type: string }
        groupSize: { type: string, description: Applied price bucket (e.g. 0.1) }
        suggestedGroupSizes:
          type: array
          items: { type: string }
          description: Ready-made grouping steps for the UI
        levels: { type: integer }
        bids:
          type: array
          items: { $ref: '#/components/schemas/OrderBookLevel' }
          description: Best bid first (highest price)
        asks:
          type: array
          items: { $ref: '#/components/schemas/OrderBookLevel' }
          description: Best ask first (lowest price)
        bidVolume: { type: string }
        askVolume: { type: string }
        imbalance:
          type: number
          description: (bidVol-askVol)/(bidVol+askVol); positive = more resting bids
        bidWalls: { type: integer }
        askWalls: { type: integer }
        updatedAt: { type: string, format: date-time }
        live: { type: boolean, description: True when the book is a live local websocket copy }
        source: { type: string, enum: [websocket, rest], description: websocket when served from a live local book }
        note: { type: string }
    Supply:
      type: object
      properties:
        asset:
          type: string
        name:
          type: string
        providerId:
          type: string
        circulatingSupply:
          type: number
          nullable: true
        totalSupply:
          type: number
          nullable: true
        maxSupply:
          type: number
          nullable: true
        currentPriceUsd:
          type: number
          nullable: true
        asOf:
          type: string
          format: date-time
        source:
          type: string
        note:
          type: string

    SpotListResponse:
      type: object
      properties:
        exchange:
          type: string
        query:
          type: string
        tag:
          type: string
          description: Echo of applied tag filter (comma-separated)
        sort:
          type: string
        order:
          type: string
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpotMarket'
    PriceAlert:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        exchange: { type: string }
        symbol: { type: string }
        condition: { type: string, enum: [above, below] }
        targetPrice: { type: number }
        mode: { type: string, enum: [one_time, repeating] }
        armed:
          type: boolean
          description: Repeating only - ready to fire on next cross into the condition zone
        status: { type: string, enum: [active, triggered] }
        createdAt: { type: string, format: date-time }
        triggeredAt: { type: string, format: date-time, nullable: true }
        triggeredPrice: { type: number }
    AlertWebhook:
      type: object
      properties:
        clientId: { type: string }
        url: { type: string }
        deliveryMode: { type: string, enum: [immediate, hourly_digest] }
        timeZone: { type: string }
        quietHours:
          type: object
          properties:
            enabled: { type: boolean }
            start: { type: string }
            end: { type: string }
        configured: { type: boolean }
        updatedAt: { type: string, format: date-time }
    PortfolioSummary:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        name: { type: string }
        currency: { type: string }
        startingBalance: { type: number }
        cashBalance: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SharedPortfolioSummary:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        name: { type: string }
        role: { type: string, enum: [viewer, trader] }
        currency: { type: string }
        startingBalance: { type: number }
        cashBalance: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PortfolioShare:
      type: object
      properties:
        portfolioId: { type: string }
        ownerClientId: { type: string }
        granteeClientId: { type: string }
        role: { type: string, enum: [viewer, trader] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PortfolioView:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, viewer, trader] }
        currency: { type: string }
        startingBalance: { type: number }
        cashBalance: { type: number }
        netDeposits:
          type: number
          description: Later deposits minus withdrawals (excludes opening startingBalance)
        contributedCapital:
          type: number
          description: startingBalance + netDeposits
        reservedCash:
          type: number
          description: Cash locked by open spot buy pending orders (includes worst-case slip + fee)
        reservedMargin:
          type: number
          description: Margin reserved by open margin limit orders
        availableCash:
          type: number
          description: Free cash after spot/margin reservations; cross mode also adds margin unrealized PnL
        positionsValue: { type: number }
        marginMode: { type: string, enum: [isolated, cross] }
        marginLocked:
          type: number
          description: Margin in open margin positions (already deducted from cash)
        marginUnrealizedPnL: { type: number }
        marginEquity: { type: number }
        equity: { type: number }
        unrealizedPnL: { type: number }
        realizedPnLTotal: { type: number }
        totalPnL:
          type: number
          description: equity minus contributedCapital (deposits/withdrawals are not P&L)
        positions: { type: array, items: { type: object } }
        marginPositions:
          type: array
          items:
            $ref: '#/components/schemas/MarginPosition'
        note: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaxLot:
      type: object
      description: One remaining (or closed) buy lot used for FIFO/LIFO realized PnL
      properties:
        id: { type: string }
        exchange: { type: string }
        symbol: { type: string }
        quantity: { type: number, description: Remaining quantity }
        originalQuantity: { type: number }
        price: { type: number, description: Fee-inclusive unit cost }
        openedAt: { type: string, format: date-time }
        sourceTradeId: { type: string }
        closedAt: { type: string, format: date-time, nullable: true }
    TaxLotFill:
      type: object
      properties:
        lotId: { type: string }
        quantity: { type: number }
        costPrice: { type: number }
        sellPrice: { type: number }
        realizedPnL: { type: number }
    PaperTrade:
      type: object
      description: Filled paper order leg (market or pending). price is the slipped fill.
      properties:
        id: { type: string }
        exchange: { type: string }
        symbol: { type: string }
        side: { type: string, enum: [buy, sell] }
        quantity: { type: number }
        price: { type: number, description: Fill price after adverse slippage }
        notional: { type: number, description: quantity × slipped fill (fee not included) }
        realizedPnL: { type: number, description: Sell realized after fee vs lot cost (fee-inclusive on buys) }
        pendingOrderId: { type: string }
        lotMethod: { type: string, enum: [fifo, lifo] }
        lotFills:
          type: array
          items: { $ref: '#/components/schemas/TaxLotFill' }
        fee: { type: number, description: Quote-currency taker fee }
        lastPrice: { type: number, description: Last/mark before slippage (0 if not stored) }
        createdAt: { type: string, format: date-time }
    PaperTradingCost:
      type: object
      properties:
        exchange: { type: string, enum: [binance, coinbase, bybit] }
        feeRate: { type: number, description: Taker fee as a fraction (0.001 = 0.10%) }
        slippageRate: { type: number, description: Adverse slippage as a fraction }
        feePct: { type: number, description: Fee in percent }
        slippagePct: { type: number, description: Slippage in percent }
    PaperTradingCostsResponse:
      type: object
      properties:
        exchange: { type: string }
        feeRate: { type: number }
        slippageRate: { type: number }
        feePct: { type: number }
        slippagePct: { type: number }
        items:
          type: array
          items: { $ref: '#/components/schemas/PaperTradingCost' }
        note: { type: string }
    PortfolioCashMovement:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [deposit, withdrawal, transfer_out, transfer_in] }
        amount: { type: number }
        cashAfter: { type: number }
        netDepositsAfter: { type: number }
        note: { type: string }
        counterpartyPortfolioId: { type: string, description: Other book on an internal transfer }
        counterpartyPortfolioName: { type: string, description: Other book name at transfer time }
        peerMovementId: { type: string, description: Matching ledger row on the other book }
        createdAt: { type: string, format: date-time }
    PortfolioCashMoveResponse:
      type: object
      properties:
        movement:
          $ref: '#/components/schemas/PortfolioCashMovement'
        portfolio:
          $ref: '#/components/schemas/PortfolioView'
    PortfolioTransferResponse:
      type: object
      properties:
        from:
          $ref: '#/components/schemas/PortfolioCashMoveResponse'
        to:
          $ref: '#/components/schemas/PortfolioCashMoveResponse'
        note: { type: string }
    PortfolioPerformance:
      type: object
      description: Period P&L plus equity time series for a paper portfolio chart
      properties:
        clientId: { type: string }
        currency: { type: string }
        period: { type: string, enum: [1d, 1w, 1m, 3m] }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        startEquity: { type: number }
        endEquity: { type: number }
        changeAmount:
          type: number
          description: endEquity minus startEquity (portfolio currency)
        changePct:
          type: number
          nullable: true
          description: Percent change vs startEquity; null when startEquity is ~0
        partial:
          type: boolean
          description: True when the portfolio is younger than the requested period
        pointCount: { type: integer }
        points:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioEquityPoint'
        note: { type: string }
    PortfolioEquityPoint:
      type: object
      properties:
        t: { type: string, format: date-time }
        equity: { type: number }
        cashBalance: { type: number }
        positionsValue: { type: number }
        marginEquity: { type: number }
    MarginPosition:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        exchange: { type: string }
        symbol: { type: string }
        side: { type: string, enum: [long, short] }
        mode: { type: string, enum: [isolated, cross] }
        quantity: { type: number }
        entryPrice: { type: number }
        leverage: { type: integer }
        margin: { type: number }
        debtPrincipal:
          type: number
          description: Main borrowed amount (quote cash for long, base coins for short)
        debtInterest:
          type: number
          description: Accrued interest in the same unit as debtPrincipal
        debtAsset: { type: string, enum: [quote, base] }
        debtNotional:
          type: number
          description: Principal+interest valued in quote (short uses mark)
        lastInterestAt: { type: string, format: date-time }
        liquidationPrice: { type: number }
        stopLoss: { type: number, nullable: true }
        takeProfit: { type: number, nullable: true }
        status: { type: string, enum: [open, closed] }
        markPrice: { type: number }
        unrealizedPnL: { type: number }
        realizedPnL: { type: number }
        closeReason: { type: string }
        openedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
    PendingOrder:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        exchange: { type: string }
        symbol: { type: string }
        type: { type: string, enum: [limit_buy, limit_sell, stop_loss, trailing_stop] }
        side: { type: string, enum: [buy, sell] }
        quantity: { type: number, description: Original order size }
        filledQuantity: { type: number }
        remainingQuantity: { type: number }
        triggerPrice: { type: number, description: Limit/stop level; for trailing_stop the current ratcheted stop }
        reservedCash:
          type: number
          description: Cash reserved for remaining buy size (remaining × slipped trigger × (1+fee))
        reservedQuantity:
          type: number
          description: Position quantity reserved for remaining sell size
        timeInForce: { type: string, enum: [gtc, ioc, fok] }
        expiresAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [open, filled, canceled, rejected, pending] }
        ocoGroupId: { type: string, description: Shared id for OCO take-profit + stop-loss pair }
        ocoPeerId: { type: string, description: Id of the other OCO leg }
        bracketId: { type: string, description: Shared id for bracket entry + exits }
        bracketRole: { type: string, enum: [entry, take_profit, stop_loss] }
        trailType: { type: string, enum: [percent, offset], description: Trailing distance mode }
        trailValue: { type: number, description: Trail distance (fraction or price offset) }
        trailPeak: { type: number, description: High-water mark for trailing stop (sell) }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        filledAt: { type: string, format: date-time, nullable: true }
        canceledAt: { type: string, format: date-time, nullable: true }
        fillTradeId: { type: string, description: Latest fill trade id }
        fillPrice: { type: number, description: Latest fill price }
        rejectReason: { type: string }
        cancelReason:
          type: string
          description: user | expired | ioc_remainder | ioc_no_fill | fok_unfilled | oco_peer_filled | oco_group_canceled
        lotMethod: { type: string, enum: [fifo, lifo], description: Lot matching used when this sell fills }
    AmendPendingOrderRequest:
      type: object
      description: At least one of triggerPrice or remainingQuantity is required.
      properties:
        triggerPrice:
          type: number
          exclusiveMinimum: 0
          description: New limit or stop price
        remainingQuantity:
          type: number
          exclusiveMinimum: 0
          description: New remaining size (must stay above zero; original quantity becomes filled + remaining)
    PendingOrderAmendHints:
      type: object
      properties:
        availableCashForOrder:
          type: number
          description: Available cash plus this order's current cash reservation (buy)
        availableQuantityForOrder:
          type: number
          description: Available position plus this order's current qty reservation (sell)
        maxRemainingQuantity:
          type: number
          description: Max remaining at the order's current triggerPrice
        minRemainingQuantity:
          type: number
          description: Minimum remaining size (MinTradeQuantity)
    PendingOrderDetail:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/PendingOrder'
        lastPrice:
          type: number
          description: Last market price for the pair (0 if unavailable)
        editable:
          type: boolean
          description: True when PATCH amend is allowed
        amend:
          $ref: '#/components/schemas/PendingOrderAmendHints'
        note: { type: string }
    RecurringBuyPlan:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        exchange: { type: string }
        symbol: { type: string }
        name:
          type: string
          description: User label e.g. Salary Day Buy
        amount:
          type: number
          description: Cash notional spent each successful run
        frequency:
          type: string
          enum: [daily, weekly, monthly, interval]
        weekday:
          type: string
          enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        dayOfMonth:
          type: integer
          description: Monthly calendar day 1-31
        intervalHours:
          type: integer
          description: Hours between interval buys
        status:
          type: string
          enum: [active, paused]
        nextRunAt: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastPeriodKey:
          type: string
          description: Last claimed period key (idempotency)
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RecurringBuyRun:
      type: object
      properties:
        id: { type: string }
        planId: { type: string }
        periodKey:
          type: string
          description: Calendar period key e.g. 2024-06-15 | 2024-W24 | 2024-06
        status:
          type: string
          enum: [succeeded, failed]
        amount: { type: number }
        quantity: { type: number }
        price: { type: number }
        tradeId: { type: string }
        failReason:
          type: string
          description: e.g. insufficient cash balance, market price unavailable
        scheduledFor: { type: string, format: date-time }
        executedAt: { type: string, format: date-time }
    AllocationTarget:
      type: object
      required: [asset, weightPct]
      properties:
        asset:
          type: string
          description: Coin ticker or portfolio cash currency (e.g. BTC, ETH, USDT)
          example: BTC
        exchange:
          type: string
          enum: [binance, coinbase, bybit]
          description: Venue used to trade this asset (ignored for cash)
        weightPct:
          type: number
          description: Target percent of spot equity (0.01–100); all targets must sum to 100
          example: 50
    AllocationBasket:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        name: { type: string }
        targets:
          type: array
          items: { $ref: '#/components/schemas/AllocationTarget' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RiskLimitsView:
      type: object
      description: Settings screen DTO — current rules plus live daily PnL and per-asset weights
      properties:
        clientId: { type: string }
        limits:
          type: object
          properties:
            maxDailyLossPct: { type: number, nullable: true }
            maxAssetWeightPct: { type: number, nullable: true }
            updatedAt: { type: string, format: date-time }
        status:
          type: object
          properties:
            dayKey: { type: string, description: UTC calendar day YYYY-MM-DD }
            timezone: { type: string, example: UTC }
            startOfDayEquity: { type: number }
            equity: { type: number }
            dailyPnl: { type: number }
            dailyPnlPct: { type: number }
            dailyLossLimitHit: { type: boolean }
            assets:
              type: array
              items:
                type: object
                properties:
                  asset: { type: string }
                  value: { type: number }
                  weightPct: { type: number }
                  atOrOverLimit: { type: boolean }
            canOpenSpotBuy:
              type: boolean
              description: False when daily-loss rule is currently hit (concentration is per-coin on each order)
            canOpenMargin: { type: boolean }
            blockReasons:
              type: array
              items: { type: string }
        note: { type: string }
    PriceDiffWatch:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        symbol: { type: string }
        minNetDiffPct:
          type: number
          description: Minimum net % edge after fees to open an opportunity
        feeBinancePct: { type: number }
        feeCoinbasePct: { type: number }
        feeBybitPct: { type: number }
        status: { type: string, enum: [active, paused] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PriceDiffOpportunity:
      type: object
      properties:
        id: { type: string }
        watchId: { type: string }
        clientId: { type: string }
        symbol: { type: string }
        buyExchange: { type: string, enum: [binance, coinbase, bybit] }
        sellExchange: { type: string, enum: [binance, coinbase, bybit] }
        buyPrice: { type: number }
        sellPrice: { type: number }
        grossDiffPct: { type: number }
        netDiffPct: { type: number }
        minNetDiffPct: { type: number }
        status: { type: string, enum: [open, closed] }
        openedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
    Watchlist:
      type: object
      properties:
        clientId: { type: string, description: List owner id (same as ownerClientId) }
        ownerClientId: { type: string, description: List owner }
        role:
          type: string
          enum: [owner, viewer, editor]
          description: Caller's access role on this list
        version:
          type: integer
          format: int64
          description: Monotonic revision for multi-device optimistic concurrency (starts at 0)
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              exchange: { type: string }
              symbol: { type: string }
              note: { type: string }
              addedAt: { type: string, format: date-time }
    WatchlistSyncConflict:
      type: object
      description: Returned in 409 responses when a write cannot be auto-merged
      properties:
        baseVersion: { type: integer, format: int64 }
        serverVersion: { type: integer, format: int64 }
        server:
          $ref: '#/components/schemas/Watchlist'
        clientProposed:
          type: array
          items:
            type: object
            properties:
              exchange: { type: string }
              symbol: { type: string }
              note: { type: string }
        autoMerged:
          type: array
          description: Non-conflicting merge preview
          items:
            type: object
            properties:
              exchange: { type: string }
              symbol: { type: string }
              note: { type: string }
        conflicts:
          type: array
          items:
            type: object
            properties:
              exchange: { type: string }
              symbol: { type: string }
              type:
                type: string
                enum: [update_vs_update, delete_vs_update, update_vs_delete]
              serverItem:
                type: object
                nullable: true
              clientItem:
                type: object
                nullable: true
    WatchlistShare:
      type: object
      properties:
        ownerClientId: { type: string }
        granteeClientId: { type: string }
        role: { type: string, enum: [viewer, editor] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WatchlistAuditEvent:
      type: object
      properties:
        id: { type: string }
        ownerClientId: { type: string }
        actorClientId: { type: string }
        action:
          type: string
          enum: [share_granted, share_updated, share_revoked, item_added, item_removed, list_replaced]
        exchange: { type: string }
        symbol: { type: string }
        detail: { type: string }
        createdAt: { type: string, format: date-time }
    ExportJob:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        format: { type: string, enum: [json, csv] }
        sections:
          type: array
          items: { type: string, enum: [watchlist, shares, alerts, backtests, portfolios] }
        status: { type: string, enum: [pending, running, completed, canceled, failed] }
        progressPct: { type: number, description: 0–100 }
        stage: { type: string }
        errorMessage: { type: string }
        fileName: { type: string }
        byteSize: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        downloadUrl: { type: string, description: Relative path when status=completed }
    ImportSectionCounts:
      type: object
      properties:
        valid: { type: integer }
        invalid: { type: integer }
        willAdd: { type: integer }
        duplicates: { type: integer }
    Account:
      type: object
      properties:
        clientId: { type: string }
        status: { type: string, enum: [active, closed, purged] }
        closedAt: { type: string, format: date-time }
        purgeAt: { type: string, format: date-time }
        reopenedAt: { type: string, format: date-time }
        canReopen: { type: boolean }
        graceDays: { type: integer, example: 7 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AccountAPIKey:
      type: object
      description: Named user API key metadata (secret is never listed)
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: Public prefix of the secret (e.g. swy_ab12cd34) }
        permission: { type: string, enum: [read, trade] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        revoked: { type: boolean }
    AccountAPIKeyCreated:
      allOf:
        - $ref: '#/components/schemas/AccountAPIKey'
        - type: object
          properties:
            secret:
              type: string
              description: Full token; shown only at creation. Send as Authorization Bearer or X-API-Key.
    ImportJob:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        format: { type: string, enum: [json, csv] }
        mode: { type: string, enum: [merge, replace] }
        status:
          type: string
          enum: [previewed, pending, running, completed, canceled, failed]
        progressPct: { type: number }
        stage: { type: string }
        errorMessage: { type: string }
        sections:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ImportSectionCounts'
        totals:
          $ref: '#/components/schemas/ImportSectionCounts'
        added:
          type: object
          additionalProperties: { type: integer }
          description: Records actually inserted after completed apply
        fileName: { type: string }
        byteSize: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    PumpEvent:
      type: object
      description: Single mechanical pump/dump window on a candle series
      properties:
        index: { type: integer }
        openTime: { type: string, format: date-time }
        closeTime: { type: string, format: date-time }
        startPrice: { type: number }
        endPrice: { type: number }
        returnPct: { type: number }
        high: { type: number }
        low: { type: number }
        volume: { type: number }
        volumeRatio: { type: number }
        mode: { type: string }
        windowBars: { type: integer }
    PumpEventsResponse:
      type: object
      properties:
        symbol: { type: string }
        exchange: { type: string }
        interval: { type: string }
        lookbackHours: { type: number }
        barsAnalyzed: { type: integer }
        minReturnPct: { type: number }
        windowBars: { type: integer }
        mode: { type: string }
        direction: { type: string }
        eventCount: { type: integer }
        events:
          type: array
          items:
            $ref: '#/components/schemas/PumpEvent'
        note: { type: string }
    PumpScanHit:
      type: object
      properties:
        symbol: { type: string }
        exchange: { type: string }
        interval: { type: string }
        bestReturnPct: { type: number }
        events:
          type: array
          items:
            $ref: '#/components/schemas/PumpEvent'
    PumpScanResponse:
      type: object
      properties:
        exchange: { type: string }
        quote: { type: string }
        interval: { type: string }
        lookbackHours: { type: number }
        minReturnPct: { type: number }
        windowBars: { type: integer }
        mode: { type: string }
        direction: { type: string }
        symbolLimit: { type: integer }
        maxTotalEvents: { type: integer }
        hitCount: { type: integer }
        eventCount: { type: integer }
        hits:
          type: array
          items:
            $ref: '#/components/schemas/PumpScanHit'
        note: { type: string }

    SpotMarket:
      type: object
      properties:
        symbol:
          type: string
        lastPrice:
          type: string
        priceChange:
          type: string
        priceChangePercent:
          type: string
        highPrice:
          type: string
        lowPrice:
          type: string
        volume:
          type: string
        quoteVolume:
          type: string
        tradeCount:
          type: integer
          format: int64
        tags:
          type: array
          items:
            type: string
          description: Binance product-catalog tags for the base asset
          example: ["Layer1_Layer2", "pos"]
        circulatingSupply:
          type: number
          nullable: true
        totalSupply:
          type: number
          nullable: true
        maxSupply:
          type: number
          nullable: true
        marketCapCirculating:
          type: number
          nullable: true
          description: USD price times circulating supply
        marketCapTotal:
          type: number
          nullable: true
          description: USD price times total supply
        marketCapMax:
          description: USD price times max supply, or infinity when max supply is undefined
          nullable: true
          oneOf:
            - type: number
            - type: string
              enum: ["\u221E"]
        delistTime:
          type: string
          format: date-time
          nullable: true
          description: Scheduled spot delist time (UTC) when known

    DelistScheduleResponse:
      type: object
      properties:
        exchange: { type: string }
        enabled:
          type: boolean
          description: False when BINANCE_API_KEY is not configured
        items:
          type: array
