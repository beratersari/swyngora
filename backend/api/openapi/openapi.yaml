    MarketLiquidationCascadeVenue:
      type: object
      properties:
        exchange: { type: string }
        symbol: { type: string }
        windows:
          type: array
          items: { $ref: '#/components/schemas/MarketLiquidationCascadeWindow' }
        side: { type: string, enum: [long, short, both, none] }
        grade: { type: string, enum: [quiet, elevated, cascade, extreme] }
        score: { type: number }
        hottest: { type: string }
        startedAt: { type: string, format: date-time }
        summary: { type: string }
    MarketLiquidationCascadeBoth:
      type: object
      description: Same-side burst on Binance and Bybit together
      properties:
        agree: { type: boolean, description: True only when the same side is cascade+ on both venues }
        side: { type: string, enum: [long, short, both, none] }
        grade: { type: string, enum: [quiet, elevated, cascade, extreme] }
        score: { type: number }
        hottest: { type: string }
        summary: { type: string }
    MarketLiquidationCascade:
      type: object
      description: Cascade risk for one coin or the pooled market (symbol=all)
      properties:
        symbol: { type: string }
        exchange: { type: string }
        asOf: { type: string, format: date-time }
        venues:
          type: array
          items: { $ref: '#/components/schemas/MarketLiquidationCascadeVenue' }
        both: { $ref: '#/components/schemas/MarketLiquidationCascadeBoth' }
        episodes:
          type: array
          items: { $ref: '#/components/schemas/MarketLiquidationCascadeEpisode' }
        summary: { type: string }
        note: { type: string }
    MarketLiquidationCascadeEpisode:
      type: object
      description: One liquidation wave (open or finished) in the last 24h
      properties:
        symbol: { type: string }
        exchange: { type: string, description: binance | bybit | both }
        combined: { type: boolean, description: Same-side wave on Binance and Bybit at once }
        side: { type: string, enum: [long, short, both, none] }
        grade: { type: string, enum: [quiet, elevated, cascade, extreme] }
        score: { type: number }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        open: { type: boolean }
        durationSec: { type: integer }
        longNotional: { type: string }
        shortNotional: { type: string }
        totalNotional: { type: string }
        count: { type: integer }
        peakRatio: { type: number }
        priceOpen: { type: string }
        priceClose: { type: string }
        priceHigh: { type: string }
        priceLow: { type: string }
        priceChangePct: { type: string, description: Signed percent, e.g. -1.24 }
        summary: { type: string }
    MarketLiquidationCascadeHit:
      type: object
      properties:
        symbol: { type: string }
        side: { type: string }
        grade: { type: string }
        score: { type: number }
        hottest: { type: string }
        both: { type: boolean }
        summary: { type: string }
    MarketLiquidationCascadeScan:
      type: object
      description: Market-wide cascade plus coins currently bursting
      properties:
        exchange: { type: string }
        asOf: { type: string, format: date-time }
        market: { $ref: '#/components/schemas/MarketLiquidationCascade' }
        hits:
          type: array
          items: { $ref: '#/components/schemas/MarketLiquidationCascadeHit' }
        summary: { type: string }
        note: { type: string }
    LiquidationHuntWeightRow:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        weightPct: { type: number }
        status: { type: string, enum: [used, missing, disabled] }
        detail: { type: string }
    LiquidationHuntScoreMix:
      type: object
      description: How direction scores were built. requested percents stay as given; missing factors are not redistributed.
      properties:
        source: { type: string, enum: [default, custom] }
        requested:
          type: array
          items: { $ref: '#/components/schemas/LiquidationHuntWeightRow' }
        used:
          type: array
          items: { $ref: '#/components/schemas/LiquidationHuntWeightRow' }
        requestedTotal: { type: number }
        usedTotal: { type: number }
        missing:
          type: array
          items: { type: string }
        disabled:
          type: array
          items: { type: string }
        note: { type: string }
    LiquidationHuntScoreFactorVenue:
      type: object
      description: One venue's contribution to a combined factor row
      properties:
        exchange: { type: string }
        status: { type: string, enum: [used, missing, disabled] }
        score: { type: number }
        appliedEffect: { type: number }
        detail: { type: string }
    LiquidationHuntScoreFactorCompare:
      type: object
      description: One factor under default vs applied weights (same requested percents; missing adds 0). Combined rows list which venues used or missed the factor.
      properties:
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [used, missing, disabled] }
        score: { type: number, description: Raw 0–100 for this factor (independent of mix). Combined is OI-weighted across used venues only. }
        defaultPct: { type: number }
        appliedPct: { type: number }
        defaultEffect: { type: number }
        appliedEffect: { type: number }
        deltaEffect: { type: number, description: appliedEffect − defaultEffect }
        detail: { type: string }
        usedVenues:
          type: array
          items: { type: string }
        missingVenues:
          type: array
          items: { type: string }
        disabledVenues:
          type: array
          items: { type: string }
        venues:
          type: array
          items: { $ref: '#/components/schemas/LiquidationHuntScoreFactorVenue' }
    LiquidationHuntScoreLargestChange:
      type: object
      description: The factor whose custom mix moved one direction score the most versus default
      properties:
        direction: { type: string, enum: [up, down] }
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [used, missing, disabled] }
        score: { type: number }
        defaultPct: { type: number }
        appliedPct: { type: number }
        defaultEffect: { type: number }
        appliedEffect: { type: number }
        deltaEffect: { type: number, description: appliedEffect − defaultEffect }
        detail: { type: string }
        summary: { type: string }
    LiquidationHuntScoreSnapshot:
      type: object
      description: Up/down scores for one mix (default or applied). Factor rows are per direction.
      properties:
        source: { type: string, enum: [default, custom] }
        upScore: { type: number }
        downScore: { type: number }
        lean: { type: string, enum: [up, down, even] }
        margin: { type: number }
        levelUp: { type: string, enum: [easier, likely, mixed, hard] }
        levelDown: { type: string, enum: [easier, likely, mixed, hard] }
        summary: { type: string }
        upFactors:
          type: array
          items: { $ref: '#/components/schemas/LiquidationHuntScoreFactorCompare' }
        downFactors:
          type: array
          items: { $ref: '#/components/schemas/LiquidationHuntScoreFactorCompare' }
    LiquidationHuntScoreCompare:
      type: object
      description: Default mix vs applied mix. Direction score = 50 + sum(effect). Missing factors keep their percent and contribute 0. upFactors / downFactors are separate. upLargestChange / downLargestChange is the factor that moved that direction the most.
      properties:
        default: { $ref: '#/components/schemas/LiquidationHuntScoreSnapshot' }
        applied: { $ref: '#/components/schemas/LiquidationHuntScoreSnapshot' }
        delta:
          type: object
          properties:
            upScore: { type: number }
            downScore: { type: number }
            leanChanged: { type: boolean }
            upFactors:
              type: array
              items: { $ref: '#/components/schemas/LiquidationHuntScoreFactorCompare' }
            downFactors:
              type: array
              items: { $ref: '#/components/schemas/LiquidationHuntScoreFactorCompare' }
            upLargestChange: { $ref: '#/components/schemas/LiquidationHuntScoreLargestChange' }
            downLargestChange: { $ref: '#/components/schemas/LiquidationHuntScoreLargestChange' }
        note: { type: string }
    LiquidationHuntFactor:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        score: { type: number, description: 0–100 for this direction }
        weight: { type: number, description: requestedPct/100 when used; 0 when missing or disabled }
        requestedPct: { type: number, description: Mix percent as requested (not rescaled) }
        sharePct: { type: number, description: Same as requestedPct; missing factors keep this percent and add 0 }
        effect: { type: number, description: Signed points versus 50. Direction score = 50 + sum(effect) }
        status: { type: string, enum: [used, missing, disabled] }
        detail: { type: string }
    LiquidationHuntDirectionScore:
      type: object
      description: How easy / likely one hunt direction looks (does not change zone math)
      properties:
        direction: { type: string, enum: [up, down] }
        score: { type: number, description: 0–100 }
        level: { type: string, enum: [easier, likely, mixed, hard] }
        coverage: { type: number, description: 0–100 completeness of inputs used for this score }
        factors:
          type: array
          items: { $ref: '#/components/schemas/LiquidationHuntFactor' }
        reasons:
          type: array
          items: { type: string }
    LiquidationHuntInputStatus:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [ok, weak, missing, error] }
        weight: { type: number }
        detail: { type: string }
        have: { type: string, description: Collected span, e.g. 18m }
        need: { type: string, description: Requested window, e.g. 1h }
        coverPct: { type: number, description: 0–100 of the requested lookback }
        age: { type: string, description: How old the sample is when it is not the requested window, e.g. 2h }
        stale: { type: boolean, description: True when an older print was found instead of the requested 1h/4h sample }
    LiquidationHuntCoverage:
      type: object
