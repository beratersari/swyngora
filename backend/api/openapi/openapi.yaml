      properties:
        score: { type: number, description: 0–100 }
        level: { type: string, enum: [complete, usable, thin, insufficient] }
        usable: { type: boolean }
        inputs:
          type: array
          items: { $ref: '#/components/schemas/LiquidationHuntInputStatus' }
        missing:
          type: array
          items: { type: string }
        weak:
          type: array
          items: { type: string }
        summary: { type: string }
    LiquidationHuntBias:
      type: object
      properties:
        lean: { type: string, enum: [up, down, even] }
        margin: { type: number }
        upScore: { type: number }
        downScore: { type: number }
        summary: { type: string }
        coverage: { $ref: '#/components/schemas/LiquidationHuntCoverage' }
        included:
          type: array
          items: { type: string }
        excluded:
          type: array
          items: { type: string }
    LiquidationHuntBand:
      type: object
      properties:
        side: { type: string }
        direction: { type: string }
        leverage: { type: string }
        price: { type: string }
        movePct: { type: string }
        estNotional: { type: string }
        observedNotional: { type: string }
        source: { type: string }
    LiquidationHuntWalk:
      type: object
      properties:
        side: { type: string }
        targetPrice: { type: string }
        quantity: { type: string }
        notional: { type: string }
        averagePrice: { type: string }
        endPrice: { type: string }
        reachable: { type: boolean }
        exhausted: { type: boolean }
        maxReachablePrice: { type: string }
        visibleNotional: { type: string }
    LiquidationHuntScenario:
      type: object
      properties:
        direction: { type: string, enum: [up, down] }
        thesis: { type: string }
        target: { $ref: '#/components/schemas/LiquidationHuntBand' }
        spot: { $ref: '#/components/schemas/LiquidationHuntWalk' }
        estLiquidated: { type: string }
        cascadeExitNotional: { type: string }
        bookOnlyPnl: { type: string }
        cascadeInventoryPnl: { type: string }
        liquidationTake: { type: string }
        fees: { type: string }
        netBookOnly: { type: string }
        netWithCascade: { type: string }
        houseEdge: { type: string, enum: [profit, loss, unreachable] }
        efficiency: { type: string }
    LiquidationHuntCascadeStep:
      type: object
      description: One price-ordered liquidation zone on a hunt cascade path
      properties:
        index: { type: integer }
        band: { $ref: '#/components/schemas/LiquidationHuntBand' }
        fromPrice: { type: string }
        movePct: { type: string }
        hopPct: { type: string }
        zoneNotional: { type: string }
        cumulativeNotional: { type: string }
        fuelAdds: { type: string, description: Assumed exit flow this zone adds if it has estimated notional }
        standalone: { $ref: '#/components/schemas/LiquidationHuntWalk' }
        incremental: { $ref: '#/components/schemas/LiquidationHuntWalk' }
        remaining: { $ref: '#/components/schemas/LiquidationHuntWalk' }
        priorCascadeNotional: { type: string }
        fuelSpent: { type: string }
        fuelLeft: { type: string }
        assistancePct: { type: string, description: Omitted when the hop cannot be scored }
        strength: { type: string, description: 0–100 hop feed strength; omitted when inputs are missing }
        strengthLevel: { type: string, enum: [self, strong, mixed, weak] }
        role: { type: string, enum: [start, self, helped, stall, unreachable, missing, observed] }
        easier: { type: boolean }
        selfFueling: { type: boolean }
        reachable: { type: boolean }
        zoneEst: { type: string, enum: [model, observed, missing], description: What liquidation size was used }
        note: { type: string }
    LiquidationHuntCascadePath:
      type: object
      description: Zones from last price outward; earlier estimated liquidations may cheapen later hops
      properties:
        direction: { type: string, enum: [up, down] }
        steps:
          type: array
          items: { $ref: '#/components/schemas/LiquidationHuntCascadeStep' }
        reachableCount: { type: integer }
        easierCount: { type: integer }
