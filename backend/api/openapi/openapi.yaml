  /api/v1/portfolio/margin/orders:
    post:
      summary: Open paper margin long/short (market or limit)
      description: |
        Uses account marginMode (isolated or cross). Leverage 1–10x. Market opens immediately;
        limit rests until last crosses limitPrice and reserves required margin until fill/cancel.
        Initial margin = qty * price / leverage from available cash.
        Optional stopLoss / takeProfit. Optional Idempotency-Key / idempotencyKey replays the original open.
        Simulated only — not real money.
      operationId: placeMarginOrder
      tags: [Portfolio]
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string, maxLength: 128 }
        - name: X-Idempotency-Key
          in: header
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, side, quantity, leverage]
              properties:
                clientId: { type: string }
                exchange: { type: string, enum: [binance, coinbase, bybit], default: binance }
                symbol: { type: string }
                side: { type: string, enum: [long, short] }
                type: { type: string, enum: [market, limit], default: market }
                quantity: { type: number, exclusiveMinimum: 0 }
                leverage: { type: integer, minimum: 1, maximum: 10 }
                limitPrice: { type: number, exclusiveMinimum: 0, description: Required for type=limit }
                stopLoss: { type: number, exclusiveMinimum: 0 }
                takeProfit: { type: number, exclusiveMinimum: 0 }
                idempotencyKey:
                  type: string
                  maxLength: 128
                  description: Optional client key; same key + same request returns the original open
      responses:
        '201':
          description: Position opened (market) or limit order resting
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
