          items:
            type: object
            properties:
              exchange: { type: string }
              buyExchange: { type: string }
              sellExchange: { type: string }
              reason: { type: string, enum: [order_book_unavailable, no_asks, no_bids] }
              message: { type: string }
        note: { type: string }
    Watchlist:
      type: object
      properties:
        clientId: { type: string, description: List owner id (same as ownerClientId) }
        ownerClientId: { type: string, description: List owner }
        role:
          type: string
          enum: [owner, viewer, editor]
          description: Caller's access role on this list
        version:
          type: integer
          format: int64
          description: Monotonic revision for multi-device optimistic concurrency (starts at 0)
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              exchange: { type: string }
              symbol: { type: string }
              note: { type: string }
              addedAt: { type: string, format: date-time }
    WatchlistSyncConflict:
      type: object
      description: Returned in 409 responses when a write cannot be auto-merged
      properties:
        baseVersion: { type: integer, format: int64 }
        serverVersion: { type: integer, format: int64 }
        server:
          $ref: '#/components/schemas/Watchlist'
        clientProposed:
          type: array
          items:
            type: object
            properties:
              exchange: { type: string }
              symbol: { type: string }
              note: { type: string }
        autoMerged:
          type: array
          description: Non-conflicting merge preview
          items:
            type: object
            properties:
              exchange: { type: string }
              symbol: { type: string }
              note: { type: string }
        conflicts:
          type: array
          items:
            type: object
            properties:
              exchange: { type: string }
              symbol: { type: string }
              type:
                type: string
                enum: [update_vs_update, delete_vs_update, update_vs_delete]
              serverItem:
                type: object
                nullable: true
              clientItem:
                type: object
                nullable: true
    WatchlistShare:
      type: object
      properties:
        ownerClientId: { type: string }
        granteeClientId: { type: string }
        role: { type: string, enum: [viewer, editor] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WatchlistAuditEvent:
      type: object
      properties:
        id: { type: string }
        ownerClientId: { type: string }
        actorClientId: { type: string }
        action:
          type: string
          enum: [share_granted, share_updated, share_revoked, item_added, item_removed, list_replaced]
        exchange: { type: string }
        symbol: { type: string }
        detail: { type: string }
        createdAt: { type: string, format: date-time }
    ExportJob:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        format: { type: string, enum: [json, csv] }
        sections:
          type: array
          items: { type: string, enum: [watchlist, shares, alerts, backtests, portfolios, customSignals] }
        status: { type: string, enum: [pending, running, completed, canceled, failed] }
        progressPct: { type: number, description: 0–100 }
        stage: { type: string }
        errorMessage: { type: string }
        fileName: { type: string }
        byteSize: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        downloadUrl: { type: string, description: Relative path when status=completed }
    ImportSectionCounts:
      type: object
      properties:
        valid: { type: integer }
        invalid: { type: integer }
        willAdd: { type: integer }
        willUpdate:
          type: integer
          description: Valid custom-signal names that match exactly one saved mix
        willConflict:
          type: integer
          description: Custom-signal names that need a user pick (more than one file row or saved mix)
        duplicates: { type: integer }
        addNames:
          type: array
          items: { type: string }
          description: Custom signal profile names that would be created as new
        updateNames:
          type: array
          items: { type: string }
          description: Custom signal profile names that already exist and would be updated
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ImportProfileConflict'
        deskCandidates:
          type: array
          description: Preview snapshot of saved mixes whose names appear in the file (id, name, default, updatedAt)
          items:
            $ref: '#/components/schemas/ImportProfileCandidate'
    ImportProfileIncoming:
      type: object
      properties:
        index: { type: integer }
        isDefault: { type: boolean }
        weights:
          type: object
          additionalProperties: { type: number }
    ImportProfileCandidate:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        isDefault: { type: boolean }
        updatedAt: { type: string, format: date-time }
    ImportProfileConflict:
      type: object
      properties:
        name: { type: string }
        incoming:
          type: array
          items:
            $ref: '#/components/schemas/ImportProfileIncoming'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ImportProfileCandidate'
    CustomSignalResolution:
      type: object
      properties:
        name: { type: string }
        incomingIndex: { type: integer, description: Which file row to apply when the file has more than one mix with this name }
        profileId: { type: string, description: Which saved mix to update when more than one exists; omit to skip }
    Account:
      type: object
      properties:
        clientId: { type: string }
        status: { type: string, enum: [active, closed, purged] }
        closedAt: { type: string, format: date-time }
        purgeAt: { type: string, format: date-time }
        reopenedAt: { type: string, format: date-time }
        canReopen: { type: boolean }
        graceDays: { type: integer, example: 7 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AccountAPIKey:
      type: object
      description: Named user API key metadata (secret is never listed)
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: Public prefix of the secret (e.g. swy_ab12cd34) }
        permission: { type: string, enum: [read, trade] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        revoked: { type: boolean }
    AccountAPIKeyCreated:
      allOf:
        - $ref: '#/components/schemas/AccountAPIKey'
        - type: object
          properties:
            secret:
              type: string
              description: Full token; shown only at creation. Send as Authorization Bearer or X-API-Key.
    ImportJob:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        format: { type: string, enum: [json, csv] }
        mode: { type: string, enum: [merge, replace] }
        status:
          type: string
          enum: [previewed, pending, running, completed, canceled, failed]
        progressPct: { type: number }
        stage: { type: string }
        errorMessage: { type: string }
        sections:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ImportSectionCounts'
        totals:
          $ref: '#/components/schemas/ImportSectionCounts'
        added:
          type: object
          additionalProperties: { type: integer }
          description: Records actually inserted after completed apply
        fileName: { type: string }
        byteSize: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    PumpEvent:
      type: object
      description: Single mechanical pump/dump window on a candle series
      properties:
        index: { type: integer }
        openTime: { type: string, format: date-time }
        closeTime: { type: string, format: date-time }
        startPrice: { type: number }
        endPrice: { type: number }
        returnPct: { type: number }
        high: { type: number }
        low: { type: number }
        volume: { type: number }
        volumeRatio: { type: number }
        mode: { type: string }
        windowBars: { type: integer }
    PumpEventsResponse:
      type: object
      properties:
        symbol: { type: string }
        exchange: { type: string }
        interval: { type: string }
        lookbackHours: { type: number }
        barsAnalyzed: { type: integer }
        minReturnPct: { type: number }
        windowBars: { type: integer }
        mode: { type: string }
        direction: { type: string }
        eventCount: { type: integer }
        events:
          type: array
          items:
            $ref: '#/components/schemas/PumpEvent'
        note: { type: string }
    PumpScanHit:
      type: object
      properties:
        symbol: { type: string }
        exchange: { type: string }
        interval: { type: string }
        bestReturnPct: { type: number }
        bestVolumeRatio: { type: number }
        bestOpenTime: { type: string, format: date-time }
        events:
          type: array
          items:
            $ref: '#/components/schemas/PumpEvent'
    PumpScanResponse:
      type: object
      properties:
        exchange: { type: string }
        quote: { type: string }
        interval: { type: string }
        lookbackHours: { type: number }
        minReturnPct: { type: number }
        windowBars: { type: integer }
        mode: { type: string }
        direction: { type: string }
        symbolLimit: { type: integer }
        maxTotalEvents: { type: integer }
        hitCount: { type: integer }
        eventCount: { type: integer }
        hits:
          type: array
          items:
            $ref: '#/components/schemas/PumpScanHit'
        note: { type: string }

    FxRates:
      type: object
      properties:
        base:
          type: string
          example: USD
        asOf:
          type: string
          format: date-time
        rates:
          type: object
          additionalProperties:
            type: number
          description: Units of each currency per 1 USD (USDT=1)
          example: { USD: 1, USDT: 1, TRY: 40.5, EUR: 0.92 }
        stale:
          type: boolean
        venueQuotes:
          type: object
          additionalProperties: { type: string }
          description: Native quote of last/open/high/low/quoteVolume per venue
        marketCapQuotes:
          type: object
          additionalProperties: { type: string }
          description: Currency of market-cap fields per venue
        aliases:
          type: object
          additionalProperties: { type: string }
          description: Stablecoin aliases for display FX (USDT→USD)
        note:
          type: string

    RSIHeatmapRow:
      type: object
      properties:
        rank: { type: integer }
        symbol: { type: string, example: BTCUSDT }
        base: { type: string, example: BTC }
        lastPrice: { type: string }
        priceChangePercent: { type: string }
        quoteVolume: { type: string }
        marketCapCirculating: { type: number, nullable: true }
        rsi: { type: number, nullable: true }
        zone: { type: string, enum: [oversold, neutral, overbought] }
        error: { type: string }
    RSIHeatmap:
      type: object
      properties:
        exchange: { type: string }
        quote: { type: string }
        interval: { type: string }
        period: { type: integer }
        oversold: { type: number }
        overbought: { type: number }
        sort: { type: string }
        averageRsi: { type: number, nullable: true }
        oversoldCount: { type: integer }
        neutralCount: { type: integer }
        overboughtCount: { type: integer }
        asOf: { type: string, format: date-time }
        stale: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/RSIHeatmapRow' }
        note: { type: string }
    MarketForensics:
      type: object
      description: Around-the-move tape plus similar past setups for one event time
      properties:
        symbol: { type: string }
        exchange: { type: string }
        at: { type: string, format: date-time }
        window: { type: string }
        during: { type: string }
        asOf: { type: string, format: date-time }
        tape: { type: object, description: Before / during / after around-the-move tape }
        similar: { type: object, description: Similar past setups and afterHorizons }
        similarError: { type: string, description: Set when similar-move search failed }
        why:
          $ref: '#/components/schemas/MarketForensicsWhy'
        timeline:
          $ref: '#/components/schemas/MarketForensicsTimeline'
        summary: { type: string }
        note: { type: string }
    MarketForensicsWhy:
      type: object
      description: Plain-language read of why the move may have happened
      properties:
        headline: { type: string }
        before: { type: string, description: What the tape looked like before the move }
        during: { type: string, description: What happened during the move }
        after: { type: string, description: What happened after the move }
        similar: { type: string, description: How similar past setups resolved }
        caution: { type: string }
    MarketForensicsTimeline:
      type: object
      description: One clock of what printed around the event (OI, takers, price, follow-through, liquidations, options, dealer gamma, futures curve, sweeps). Only prints at or before knownUntil.
      properties:
        summary: { type: string }
        knownUntil:
          type: string
          format: date-time
          description: Latest time a timeline print may have — the observer clock (`asOf`, or now)
        orderKnown:
          type: boolean
          description: False when two beats overlap at this tape's bar/sample size so the order is not certain
        events:
          type: array
          items: { $ref: '#/components/schemas/MarketForensicsTimelineEvent' }
    MarketForensicsTimelineEvent:
      type: object
      description: One beat on the forensics clock
      properties:
        at: { type: string, format: date-time }
        offset: { type: string, description: Signed short offset from the event time (-8m, 0, +3m) }
        offsetLabel: { type: string, description: Plain-language offset (about 8 minutes before) }
        phase: { type: string, description: before | during | after }
        kind: { type: string, description: oi | takers | price | liquidations | options | gamma | curve | tape | sweep | absorption }
        venue: { type: string, description: binance | bybit | deribit | all }
        direction: { type: string }
        title: { type: string }
        detail: { type: string }
        resolution:
          type: string
          description: Bar or sample size this stamp is known to (1m, 5m). Empty when the time is an exact tick.
        orderUnknown:
          type: boolean
          description: True when this beat overlaps another so we cannot say which printed first
    MarketForensicsScan:
      type: object
      description: Coins whose current tape looks like past important-move setups
      properties:
        exchange: { type: string }
        quote: { type: string }
        lookback: { type: string }
        window: { type: string }
        interval: { type: string }
        scanned: { type: integer }
        compared: { type: integer }
        hits:
          type: array
          items: { $ref: '#/components/schemas/MarketForensicsScanHit' }
        summary: { type: string }
        note: { type: string }
    MarketForensicsScanHit:
      type: object
      description: One coin whose current tape looks like a past pre-move setup
      properties:
        symbol: { type: string }
        exchange: { type: string }
        similarity: { type: string, description: Overall closeness 0–100 }
        coverage: { type: string }
        events: { type: integer }
        matches: { type: integer }
        lean: { type: string, enum: [up, down, mixed, unknown] }
        whySimilar: { type: string, description: Which tape pieces matched the closest past setup }
        compared:
          type: array
          description: Closest twin scores for price, volume, takers, oi, book, options
          items:
            type: object
            properties:
              name: { type: string, enum: [price, volume, takers, oi, book, options] }
              used: { type: boolean }
              score: { type: string, description: 0–100 closeness when used }
              weight: { type: string }
        afterStory: { type: string }
        afterHorizons:
          type: array
          items: { type: object }
        closestAt: { type: string, format: date-time }
        closestDirection: { type: string }
        closestReturnPct: { type: string }
        summary: { type: string }
    MarketForensicsRadarReview:
      type: object
      description: Saved Setup Radar hits and how useful they were
      properties:
        exchange: { type: string }
        symbol: { type: string }
        since: { type: string }
        from: { type: string, format: date-time }
        limit: { type: integer }
        asOf: { type: string, format: date-time }
        summary: { type: string }
        note: { type: string }
        horizons:
          type: array
          items:
            type: object
            properties:
              horizon: { type: string }
              sample: { type: integer }
              leanRight: { type: integer }
              leanWrong: { type: integer }
              up: { type: integer }
              down: { type: integer }
              flat: { type: integer }
              medianPct: { type: string }
              averagePct: { type: string }
              usefulPct: { type: string }
        cases:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              exchange: { type: string }
              symbol: { type: string }
              foundAt: { type: string, format: date-time }
              foundPrice: { type: string }
              similarity: { type: string }
              lean: { type: string }
              whySimilar: { type: string }
              afterStory: { type: string }
              after:
                type: array
                items:
                  type: object
                  properties:
                    horizon: { type: string }
                    dueAt: { type: string }
                    filledAt: { type: string }
                    returnPct: { type: string }
                    direction: { type: string }
                    useful: { type: boolean, nullable: true }
    SpotMarket:
      type: object
      properties:
        symbol:
          type: string
        lastPrice:
          type: string
        priceChange:
          type: string
        priceChangePercent:
          type: string
        highPrice:
          type: string
        lowPrice:
          type: string
        volume:
          type: string
        quoteVolume:
          type: string
        tradeCount:
          type: integer
          format: int64
        tags:
          type: array
          items:
            type: string
          description: Binance product-catalog tags for the base asset
          example: ["Layer1_Layer2", "pos"]
        circulatingSupply:
          type: number
          nullable: true
        totalSupply:
          type: number
          nullable: true
        maxSupply:
          type: number
          nullable: true
        marketCapCirculating:
          type: number
          nullable: true
          description: USD price times circulating supply
        marketCapTotal:
          type: number
          nullable: true
          description: USD price times total supply
        marketCapMax:
          description: USD price times max supply, or infinity when max supply is undefined
          nullable: true
          oneOf:
            - type: number
            - type: string
              enum: ["\u221E"]
        delistTime:
          type: string
          format: date-time
          nullable: true
          description: Scheduled spot delist time (UTC) when known
        announcedAt:
          type: string
          format: date-time
          nullable: true
          description: When the venue published the delist announcement (UTC)

    DelistScheduleResponse:
      type: object
      properties:
        exchange: { type: string }
        enabled:
          type: boolean
          description: False when this venue has no delist feed (Binance needs BINANCE_API_KEY; Bybit is always on)
        items:
          type: array
          items:
            $ref: '#/components/schemas/DelistScheduleItem'
    DelistScheduleItem:
      type: object
      properties:
        symbol: { type: string }
        delistTime: { type: string, format: date-time }
        announcedAt:
          type: string
          format: date-time
          description: When the venue published the delist announcement (UTC)
    PostDelistResponse:
      type: object
      properties:
        exchange: { type: string }
        symbol: { type: string }
        base: { type: string }
        delistTime:
          type: string
          format: date-time
        available:
          type: boolean
          description: True when an off-venue last price was found
        source:
          type: string
          description: Provider id (coingecko, bybit, coinbase, binance)
        sourceLabel:
          type: string
          description: Human label for the source
        note:
          type: string
          description: Why this is not the home venue tape
        lastPrice: { type: string }
        priceChangePercent: { type: string }
        quote:
          type: string
          description: Quote asset of lastPrice (USD or USDT)
        asOf:
          type: string
          format: date-time
        interval: { type: string }
        candles:
          type: array
          items:
            $ref: '#/components/schemas/Candle'
