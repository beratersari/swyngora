  /api/v1/price-diff/watches:
    post:
      summary: Create a cross-exchange price difference watch
      description: |
        Tracks last prices for a symbol on Binance, Coinbase, and Bybit.
        When net edge after exchange fees exceeds minNetDiffPct, stores an opportunity
        with buyExchange and sellExchange. Does not create a duplicate while open.
        When net falls below the limit the opportunity closes; a later re-cross opens a new one.
        Stale or missing exchange prices skip evaluation for that venue (no signal).
        Open opportunities are durable (SQLite) and survive worker restarts.
        Informational only — not financial advice / not executable trading.
      operationId: createPriceDiffWatch
      tags: [PriceDiff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, minNetDiffPct]
              properties:
                clientId: { type: string }
                symbol: { type: string, example: BTCUSDT }
                minNetDiffPct:
                  type: number
                  exclusiveMinimum: 0
                  description: Minimum net difference percent after fees (e.g. 0.5 = 0.5%)
                  example: 0.5
                feeBinancePct: { type: number, minimum: 0, example: 0.1 }
                feeCoinbasePct: { type: number, minimum: 0, example: 0.6 }
                feeBybitPct: { type: number, minimum: 0, example: 0.1 }
      responses:
        '201':
          description: Created watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceDiffWatch'
        '400':
          $ref: '#/components/responses/Error'
    get:
      summary: List price difference watches
      operationId: listPriceDiffWatches
      tags: [PriceDiff]
      parameters:
