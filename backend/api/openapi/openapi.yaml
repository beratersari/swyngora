  /api/v1/portfolio/baskets:
    post:
      summary: Create a paper allocation basket
      description: |
        Named target mix (e.g. 50% BTC, 30% ETH, 20% USDT). Weights must sum to 100.
        Saving a basket does not trade. Rebalance is a separate explicit action.
        Spot only; margin positions are ignored. Paper trading — not real money.
      operationId: createPortfolioBasket
      tags: [Portfolio]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, targets]
              properties:
                clientId: { type: string }
                name: { type: string, example: Core 50/30/20 }
                targets:
                  type: array
                  items: { $ref: '#/components/schemas/AllocationTarget' }
      responses:
        '201':
          description: Created basket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllocationBasket' }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      summary: List paper allocation baskets
      operationId: listPortfolioBaskets
      tags: [Portfolio]
      parameters:
        - name: clientId
          in: query
