        - name: weightEmaCrossover
          in: query
          schema: { type: number }
        - name: weightEmaTrend
          in: query
          schema: { type: number }
        - name: weightSupertrend
          in: query
          schema: { type: number }
        - name: weightRsiRecovery
          in: query
          schema: { type: number }
        - name: weightMacd
          in: query
          schema: { type: number }
        - name: weightAdx
          in: query
          schema: { type: number }
        - name: weightAccumulation
          in: query
          schema: { type: number }
        - name: weightVolumeBreakout
          in: query
          schema: { type: number }
        - name: weightHuntUp
          in: query
