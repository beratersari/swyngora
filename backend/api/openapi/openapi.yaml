  /api/v1/price-diff/watches:
    post:
      summary: Create a cross-exchange price difference watch
      description: |
        Tracks a symbol on Binance, Coinbase, and Bybit. Walks **fresh** live books for
        `notional` and opens an opportunity only when that size can be bought
        and sold and after-fee profit (including slippage) is at least `minProfit`.
        Stale books (FetchedAt older than 2 minutes) are ignored. `minDurationSec`
        requires the fill to stay qualifying that long; a break resets the timer.
        Does not open from ticker last-price gaps alone. Does not create a
        duplicate while open. When the book fill no longer meets the floor the
        opportunity closes; a later re-cross opens a new one. Missing or stale
        books skip that venue. Informational only — not financial advice.
      operationId: createPriceDiffWatch
      tags: [PriceDiff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, notional, minProfit]
              properties:
                clientId: { type: string }
                symbol: { type: string, example: BTCUSDT }
                notional:
                  type: number
                  exclusiveMinimum: 0
                  description: Quote size walked on the buy book (e.g. 10000 USDT)
                  example: 10000
                minProfit:
                  type: number
                  minimum: 0
                  description: Minimum after-fee profit in quote currency
                  example: 20
                minDurationSec:
                  type: number
                  minimum: 0
                  description: Seconds the qualifying fill must hold before opening; 0 = first tick
                  example: 60
                minNetDiffPct:
                  type: number
                  minimum: 0
                  description: Optional extra profit percent floor
                  example: 0.5
                feeBinancePct: { type: number, minimum: 0, example: 0.1 }
                feeCoinbasePct: { type: number, minimum: 0, example: 0.6 }
                feeBybitPct: { type: number, minimum: 0, example: 0.1 }
                exchanges:
                  type: array
                  minItems: 2
                  items:
                    type: string
                    enum: [binance, coinbase, bybit]
                  description: Venues to walk. Default all three. At least two required.
                  example: [binance, bybit]
      responses:
        '201':
          description: Created watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceDiffWatch'
        '400':
          $ref: '#/components/responses/Error'
    get:
      summary: List price difference watches
      operationId: listPriceDiffWatches
      tags: [PriceDiff]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Watch list
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/price-diff/watches/{id}:
    get:
      summary: Get a price difference watch
      operationId: getPriceDiffWatch
      tags: [PriceDiff]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceDiffWatch'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      summary: Update price-diff watch settings
      description: |
        Change notional, minProfit, minDurationSec, minNetDiffPct, or per-venue fees
        without deleting the watch. Clears the duration timer so the next hold
        starts from zero. Does not change status.
      operationId: updatePriceDiffWatch
      tags: [PriceDiff]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string }
                notional: { type: number, exclusiveMinimum: 0 }
                minProfit: { type: number, minimum: 0 }
                minDurationSec: { type: number, minimum: 0 }
                minNetDiffPct: { type: number, minimum: 0 }
                feeBinancePct: { type: number, minimum: 0 }
                feeCoinbasePct: { type: number, minimum: 0 }
                feeBybitPct: { type: number, minimum: 0 }
                exchanges:
                  type: array
                  minItems: 2
                  items:
                    type: string
                    enum: [binance, coinbase, bybit]
                  description: Replace the venue set. At least two required.
      responses:
        '200':
          description: Updated watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceDiffWatch'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete a price difference watch
      description: Removes the watch and its opportunities.
      operationId: deletePriceDiffWatch
      tags: [PriceDiff]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/price-diff/watches/{id}/pause:
    post:
      summary: Pause a price-diff watch
      description: |
        Marks the watch paused first so an in-flight checker tick cannot open a
        new opportunity. Open opportunities are closed. The duration timer is
        dropped so resume starts a new wait.
      operationId: pausePriceDiffWatch
      tags: [PriceDiff]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Paused watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceDiffWatch'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/price-diff/watches/{id}/resume:
    post:
      summary: Resume a price-diff watch
      description: |
        Starts evaluating again. Does not continue a duration wait from before
        pause — the timer starts from zero.
      operationId: resumePriceDiffWatch
      tags: [PriceDiff]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Active watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceDiffWatch'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/price-diff/watches/{id}/quote:
    get:
      summary: Scan all venue pairs for a stored watch
      description: |
        Uses the watch symbol and per-exchange fees. Walks live books on
        Binance, Coinbase, and Bybit for every buy/sell pair at the given size.
        Routes are ranked by after-fee profit. `usedNotional` / `usedPct` show
        how much of the entered money can still be deployed while the total
        trade stays profitable.
      operationId: quotePriceDiffWatch
      tags: [PriceDiff]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
          schema: { type: string }
        - name: notional
          in: query
          schema: { type: number, exclusiveMinimum: 0, example: 10000 }
        - name: quantity
          in: query
          schema: { type: number, exclusiveMinimum: 0 }
        - name: minProfitPct
          in: query
          schema: { type: number, minimum: 0 }
        - name: minProfitAmount
          in: query
          schema: { type: number, minimum: 0 }
      responses:
        '200':
          description: Ranked routes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceDiffQuoteScan'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/price-diff/opportunities:
    get:
      summary: List price difference opportunities
      operationId: listPriceDiffOpportunities
      tags: [PriceDiff]
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: X-Client-Id
          in: header
